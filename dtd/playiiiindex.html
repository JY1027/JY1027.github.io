<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夢幻景點機</title>

<style>
:root {
    --pink: #f47fa6;
    --deep-pink: #cf527e;
    --light-pink: #ffe5ed;
    --cream: #fff8f2;
    --dark: #573b4b;
    --mint: #b9e6d8;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 12px;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background:
        radial-gradient(circle at 15% 20%, #ffffff 0 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, #ffffff 0 2px, transparent 3px),
        linear-gradient(135deg, #fff0f4, #fce0e9 55%, #fff4e9);
    background-size: 55px 55px, 75px 75px, auto;
    color: var(--dark);
}

/* 機台主體 */
.machine {
    position: relative;
    width: min(100%, 490px);
    padding: 15px;
    border: 5px solid #fff;
    border-radius: 34px;
    background: linear-gradient(145deg, #ffb4cb, #f47fa6 55%, #e96c98);
    box-shadow:
        0 12px 0 #cf6489,
        0 22px 35px rgba(164, 83, 116, .25),
        inset 0 3px 8px rgba(255,255,255,.8);
}

/* 機台頂部 */
.machine-top {
    position: relative;
    padding: 17px 10px 15px;
    margin-bottom: 15px;
    text-align: center;
    border: 3px solid #fff;
    border-radius: 22px;
    background: linear-gradient(180deg, #fff9fb, #ffe9f0);
    box-shadow: inset 0 -4px 0 #f3c4d3;
}

.machine-top h1 {
    margin: 10px 0 0;
    font-size: clamp(23px, 6vw, 30px);
    letter-spacing: 3px;
    color: #bd557b;
    text-shadow: 1px 2px 0 #fff;
}

.subtitle {
    margin-top: 7px;
    color: #bd8298;
    font-size: 12px;
    letter-spacing: 3px;
}

/* 頂部燈泡 */
.lights {
    display: flex;
    justify-content: space-around;
    margin: 0 5px 12px;
}

.light {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff5bd;
    box-shadow: 0 0 8px #fff5bd, 0 0 14px #fff;
    animation: blink 1.5s infinite alternate;
}

.light:nth-child(2n) { animation-delay: .5s; }

.light:nth-child(3n) {
    background: #d9fff0;
    box-shadow: 0 0 8px #d9fff0, 0 0 14px #fff;
    animation-delay: .9s;
}

@keyframes blink {
    from { opacity: .55; transform: scale(.85); }
    to { opacity: 1; transform: scale(1.15); }
}

/* 旅行主題插畫 */
.art-illustrations {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    margin: 5px auto 8px;
}

.art-illustrations svg {
    width: 75px;
    height: 75px;
    overflow: visible;
    filter: drop-shadow(0 4px 3px rgba(180, 100, 130, .15));
}

.art-illustrations svg:nth-child(2) {
    width: 88px;
    height: 88px;
}

/* 展示窗 */
.showcase {
    position: relative;
    padding: 17px;
    border: 5px solid #d98aa7;
    border-radius: 22px;
    background: linear-gradient(145deg, #fffdfb, #ffeef3);
    box-shadow:
        inset 0 0 0 3px #fff,
        inset 0 0 18px rgba(201, 116, 149, .18),
        0 5px 0 #c96d91;
}

.showcase-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
}

.showcase-header span {
    color: #b75b7d;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

.status-light {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #75ad9c;
    font-size: 11px;
    font-weight: bold;
}

.status-light::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #8ed9b8;
    box-shadow: 0 0 7px #8ed9b8;
}

/* 稀有度機率 */
.rates {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-bottom: 15px;
}

.rate-item {
    padding: 9px 3px;
    border-radius: 10px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    background: #fff;
    border: 1px solid #f1d3df;
    color: #8b7180;
}

.rate-item strong {
    display: block;
    margin-bottom: 3px;
    font-size: 17px;
}

.rate-item.ssr strong { color: #d69a28; }
.rate-item.sr strong { color: #a477d5; }
.rate-item.r strong { color: #8296a5; }

/* 卡片出卡口 */
.dispenser {
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border: 5px solid #e8bdcd;
    border-radius: 16px;
    background: linear-gradient(180deg, #59434f, #392c36);
    box-shadow:
        inset 0 8px 15px rgba(0,0,0,.5),
        0 2px 0 #fff;
}

.dispenser::before,
.dispenser::after {
    content: "✦";
    position: absolute;
    color: rgba(255,255,255,.2);
    font-size: 30px;
    pointer-events: none;
}

.dispenser::before { top: 12px; left: 15px; }
.dispenser::after { bottom: 12px; right: 15px; }

.empty-message {
    color: #d9b9c8;
    font-size: 14px;
    letter-spacing: 2px;
}

/* 抽選文字 */
.drawing-message {
    position: absolute;
    z-index: 3;
    color: #fff0f6;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow:
        0 0 5px #ffb4d0,
        0 0 12px #f47fa6,
        0 0 20px #f47fa6;
    display: none;
    pointer-events: none;
}

.drawing-message.show {
    display: block;
    animation: drawingBlink .55s infinite alternate;
}

@keyframes drawingBlink {
    from {
        opacity: .3;
        transform: scale(.96);
    }
    to {
        opacity: 1;
        transform: scale(1.04);
    }
}

/* 卡片 */
.card {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(78%, 300px);
    height: 135px;
    padding: 12px;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(145deg, #fff, #fff1f5);
    color: #775365;
    border: 3px solid #f2cada;
    box-shadow: 0 8px 18px rgba(0,0,0,.3);

    transform: translate(-50%, -230px) scale(.85);
    opacity: 0;
    visibility: hidden;

    transition:
        transform .65s cubic-bezier(.2, 1.35, .4, 1),
        opacity .3s ease;

    z-index: 2;
}

.card.drop {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    visibility: visible;
}

.card-rarity {
    margin-bottom: 9px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 3px;
}

.card-name {
    font-size: clamp(18px, 5vw, 24px);
    font-weight: bold;
    line-height: 1.4;
}

/* SSR 卡片 */
.card.SSR {
    background: linear-gradient(135deg, #fff3b8, #ffc95f, #f4a63d);
    border: 4px solid #fff6d6;
    color: #8d541b;
    box-shadow:
        0 0 12px #ffdb70,
        0 0 30px rgba(255, 190, 64, .8),
        0 8px 18px rgba(0,0,0,.3);
}

/* SR 卡片 */
.card.SR {
    background: linear-gradient(135deg, #f2e5ff, #d6b8fa, #b991e7);
    border: 4px solid #fff;
    color: #63458d;
    box-shadow:
        0 0 18px rgba(199, 158, 255, .7),
        0 8px 18px rgba(0,0,0,.3);
}

/* R 卡片 */
.card.R {
    background: linear-gradient(135deg, #fff, #eaf5f4);
    border: 3px solid #d5e8e3;
    color: #557a73;
}

/* 控制區 */
.control-panel {
    margin-top: 18px;
    padding: 15px;
    border: 3px solid #fff;
    border-radius: 20px;
    background: linear-gradient(145deg, #ffeaf1, #f8c8d9);
    box-shadow: inset 0 -4px 0 rgba(190, 92, 130, .15);
}

/* 抽卡按鈕 */
.draw-button {
    width: 100%;
    padding: 16px 12px;
    border: 3px solid #fff;
    border-radius: 15px;
    background: linear-gradient(180deg, #a8e8d5, #6cc9ae);
    color: #315f54;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow:
        0 6px 0 #4da88f,
        0 8px 12px rgba(100, 155, 135, .2);
    transition: .15s;
}

.draw-button:hover {
    filter: brightness(1.06);
    transform: translateY(-2px);
}

.draw-button:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #4da88f;
}

.draw-button:disabled {
    filter: grayscale(.5);
    cursor: not-allowed;
    transform: none;
}

/* 機台底部 */
.machine-bottom {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    padding-top: 17px;
    color: #fff;
    font-size: 11px;
    letter-spacing: 3px;
    text-shadow: 0 1px 3px rgba(130, 40, 75, .3);
}

@media (max-width: 420px) {
    .machine {
        padding: 11px;
        border-radius: 27px;
    }

    .showcase { padding: 12px; }
    .dispenser { height: 175px; }
    .control-panel { padding: 12px; }

    .art-illustrations { gap: 12px; }

    .art-illustrations svg {
        width: 65px;
        height: 65px;
    }
}
</style>
</head>

<body>

<div class="machine">

    <!-- 機台頂部 -->
    <div class="machine-top">

        <div class="lights">
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
        </div>

        <!-- 旅行主題 SVG 插畫 -->
        <div class="art-illustrations">

            <!-- 後背包 -->
            <svg viewBox="0 0 100 100" aria-label="後背包">

                <!-- 背帶 -->
                <path d="M29 35 Q15 42 19 72"
                      fill="none"
                      stroke="#BD6687"
                      stroke-width="7"
                      stroke-linecap="round"/>

                <path d="M71 35 Q85 42 81 72"
                      fill="none"
                      stroke="#BD6687"
                      stroke-width="7"
                      stroke-linecap="round"/>

                <!-- 包包主體 -->
                <rect x="24" y="30"
                      width="52" height="59"
                      rx="15"
                      fill="#F4A9C2"
                      stroke="#C96F91"
                      stroke-width="3"/>

                <!-- 上方提把 -->
                <path d="M39 31 Q39 13 50 13 Q61 13 61 31"
                      fill="none"
                      stroke="#C96F91"
                      stroke-width="6"
                      stroke-linecap="round"/>

                <!-- 前方口袋 -->
                <rect x="33" y="55"
                      width="34" height="24"
                      rx="8"
                      fill="#FFDCE8"
                      stroke="#D77D9F"
                      stroke-width="2.5"/>

                <!-- 口袋拉鍊 -->
                <path d="M42 57 L58 57"
                      stroke="#C96F91"
                      stroke-width="2.5"
                      stroke-linecap="round"/>

                <!-- 裝飾星星 -->
                <path d="M50 65 L52 70 L57 72 L52 74 L50 79 L48 74 L43 72 L48 70Z"
                      fill="#E6B84F"/>

            </svg>

            <!-- 行李箱 -->
            <svg viewBox="0 0 100 100" aria-label="行李箱">

                <!-- 拉桿 -->
                <path d="M39 25 V12 H61 V25"
                      fill="none"
                      stroke="#BD6687"
                      stroke-width="5"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>

                <!-- 箱體 -->
                <rect x="19" y="25"
                      width="62" height="62"
                      rx="12"
                      fill="#B9E6D8"
                      stroke="#70B9A2"
                      stroke-width="3"/>

                <!-- 箱體中線 -->
                <path d="M50 27 V85"
                      stroke="#70B9A2"
                      stroke-width="3"
                      stroke-dasharray="4 4"/>

                <!-- 裝飾橫線 -->
                <path d="M29 37 V75 M71 37 V75"
                      stroke="#E7FFF6"
                      stroke-width="4"
                      stroke-linecap="round"/>

                <!-- 把手 -->
                <rect x="43" y="48"
                      width="14" height="9"
                      rx="3"
                      fill="#FFF5E8"/>

                <!-- 輪子 -->
                <circle cx="32" cy="91" r="5" fill="#BD6687"/>
                <circle cx="68" cy="91" r="5" fill="#BD6687"/>

                <!-- 星星 -->
                <path d="M62 60 L64 64 L68 66 L64 68 L62 72 L60 68 L56 66 L60 64Z"
                      fill="#F4C66B"/>

            </svg>

            <!-- 旅遊地圖 -->
            <svg viewBox="0 0 100 100" aria-label="旅遊地圖">

                <!-- 地圖紙張 -->
                <path d="M12 25 L38 15 L63 25 L88 15
                         L88 75 L63 85 L38 75 L12 85Z"
                      fill="#FFF0C9"
                      stroke="#D6A85F"
                      stroke-width="3"
                      stroke-linejoin="round"/>

                <!-- 地圖折線 -->
                <path d="M38 15 V75 M63 25 V85"
                      stroke="#D6A85F"
                      stroke-width="2.5"
                      stroke-dasharray="3 3"/>

                <!-- 路線 -->
                <path d="M21 62 Q34 43 48 55 T76 38"
                      fill="none"
                      stroke="#E98EA9"
                      stroke-width="4"
                      stroke-linecap="round"
                      stroke-dasharray="5 4"/>

                <!-- 定位標記 -->
                <path d="M67 27 C67 19 73 15 79 19
                         C86 24 82 32 67 46
                         C52 32 48 24 55 19
                         C61 15 67 19 67 27Z"
                      fill="#F47FA6"
                      stroke="#BD6687"
                      stroke-width="2"/>

                <circle cx="67" cy="26" r="4"
                        fill="#FFF8F2"/>

                <!-- 小星星 -->
                <path d="M26 35 L28 40 L33 42 L28 44 L26 49 L24 44 L19 42 L24 40Z"
                      fill="#E6B84F"/>

            </svg>

        </div>
    </div>

    <!-- 展示櫥窗 -->
    <div class="showcase">

        <div class="showcase-header">
            <span>ATTRACTION COLLECTION</span>
            <span class="status-light">機台運作中</span>
        </div>

        <div class="rates">
            <div class="rate-item ssr">
                <strong>SSR</strong>
                5%
            </div>

            <div class="rate-item sr">
                <strong>SR</strong>
                20%
            </div>

            <div class="rate-item r">
                <strong>R</strong>
                75%
            </div>
        </div>

        <!-- 出卡口 -->
        <div class="dispenser">

            <div class="empty-message" id="empty-message">
                等待卡片掉落
            </div>

            <!-- 抽選文字 -->
            <div class="drawing-message" id="drawing-message">
                正在抽選……
            </div>

            <!-- 卡片 -->
            <div id="card-output" class="card">
                <div id="card-rarity" class="card-rarity"></div>
                <div id="card-name" class="card-name"></div>
            </div>

        </div>
    </div>

    <!-- 控制面板 -->
    <div class="control-panel">

        <button
            id="draw-button"
            class="draw-button"
            onclick="draw()"
        >
            就決定是你了
        </button>

    </div>

    <div class="machine-bottom">
        <span>✧</span>
        <span>LET'S CHOOSE YOUR ATTRACTION</span>
        <span>✧</span>
    </div>

</div>

<script>

const cardPool = {
    SSR: [
        "臺北101"
    ],

    SR: [
        "國立故宮博物院",
        "西門町",
        "中正紀念堂",
        "陽明山國家公園",
        "象山步道"
    ],

    R: [
        "國父紀念館",
        "大稻埕碼頭",
        "松山文創園區",
        "華山1914文創園區",
        "迪化街",
        "剝皮寮歷史街區",
        "榕錦時光生活園區",
        "赤峰街",
        "擎天崗草原",
        "大安森林公園",
        "北投地熱谷",
        "貓空",
        "臺北市立美術館",
        "臺北植物園",
        "國家兩廳院",
        "臺北市立動物園",
        "兒童新樂園",
        "士林夜市",
        "寧夏夜市"
    ]
};

let isDrawing = false;

/* 共用音效環境 */
let audioContext = null;

function playBeep(freq, type, duration) {
    try {
        if (!audioContext) {
            audioContext = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(
            0.09,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + duration
        );

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();
        osc.stop(audioContext.currentTime + duration);

    } catch (error) {
        console.log("音效無法播放：", error);
    }
}

/* 抽卡音效 */
function playStartSound() {
    playBeep(587.33, "sine", 0.15);

    setTimeout(() => {
        playBeep(880, "sine", 0.2);
    }, 100);
}

/* 稀有度抽選 */
function getRarity() {
    const roll = Math.random();

    if (roll < 0.05) {
        return "SSR";
    } else if (roll < 0.25) {
        return "SR";
    } else {
        return "R";
    }
}

/* 隨機取得景點 */
function getRandomArtItem(rarity) {
    const list = cardPool[rarity];
    const index = Math.floor(Math.random() * list.length);
    return list[index];
}

/* 等待指定時間 */
function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

/* 抽卡主程式 */
async function draw() {

    if (isDrawing) return;

    isDrawing = true;

    const cardOutput =
        document.getElementById("card-output");

    const cardRarity =
        document.getElementById("card-rarity");

    const cardName =
        document.getElementById("card-name");

    const emptyMessage =
        document.getElementById("empty-message");

    const drawingMessage =
        document.getElementById("drawing-message");

    const drawButton =
        document.getElementById("draw-button");

    /* 1. 收回上一張卡片 */
    cardOutput.className = "card";
    emptyMessage.style.display = "none";

    /* 隱藏舊抽選文字 */
    drawingMessage.classList.remove("show");

    /* 2. 鎖定按鈕 */
    drawButton.disabled = true;

    /* 3. 顯示抽選文字 */
    drawingMessage.classList.add("show");

    /* 播放啟動音效 */
    playStartSound();

    /* 4. 等待 1.2 秒 */
    await wait(1200);

    /* 5. 抽選文字消失 */
    drawingMessage.classList.remove("show");

    /* 決定稀有度與景點 */
    const rarity = getRarity();
    const name = getRandomArtItem(rarity);

    /* 設定卡片內容 */
    cardRarity.innerText = `${rarity} CHARACTER`;
    cardName.innerText = name;

    /* 6. 設定卡片稀有度 */
    cardOutput.className = `card ${rarity}`;

    /* 確保瀏覽器先套用初始位置 */
    void cardOutput.offsetWidth;

    /* 開始掉落動畫 */
    requestAnimationFrame(() => {
        cardOutput.classList.add("drop");
    });

    /* 7. 根據稀有度播放音效 */
    if (rarity === "SSR") {

        playBeep(1046, "sine", 0.2);

        setTimeout(() => {
            playBeep(1318, "sine", 0.25);
        }, 120);

    } else if (rarity === "SR") {

        playBeep(784, "triangle", 0.25);

    } else {

        playBeep(523, "triangle", 0.2);
    }

    /* 8. 等待卡片掉落動畫完成 */
    await wait(750);

    /* 9. 恢復抽卡功能，卡片留在出卡口 */
    drawButton.disabled = false;
    isDrawing = false;
}

</script>

</body>
</html>
