<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夢幻幸運扭蛋機</title>

<style>
:root {
    --pink: #f47fa6;
    --deep-pink: #cf527e;
    --light-pink: #ffe5ed;
    --cream: #fff8f2;
    --dark: #573b4b;
    --mint: #b9e6d8;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background:
        radial-gradient(circle at 15% 20%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, #fff 0 2px, transparent 3px),
        linear-gradient(135deg, #fff0f4, #fce0e9 55%, #fff4e9);
    background-size: 55px 55px, 75px 75px, auto;
    color: var(--dark);
}

h1 {
    position: absolute;
    top: 3vh;
    color: #bd557b;
    font-size: clamp(22px, 5vw, 32px);
    letter-spacing: 4px;
    text-shadow: 1px 2px 0 #fff;
    margin: 0;
    z-index: 5;
    transition: opacity .4s;
}

.subtitle {
    position: absolute;
    top: calc(3vh + 43px);
    color: #bd8298;
    font-size: 11px;
    letter-spacing: 4px;
    z-index: 5;
    transition: opacity .4s;
}

.hide-element {
    opacity: 0 !important;
    pointer-events: none;
}

.ambient-decorations {
    display: none;
}

.deco-ball.yellow {
    background: radial-gradient(circle at 30% 25%, #fff, #ffe5a0 55%, #edbd62);
}

.deco:nth-child(1) { top: 18%; left: 9%; }
.deco:nth-child(2) { top: 29%; right: 11%; animation-delay: .8s; }
.deco:nth-child(3) { top: 45%; left: 7%; animation-delay: 1.3s; }
.deco:nth-child(4) { top: 53%; right: 8%; animation-delay: .5s; }
.deco:nth-child(5) { top: 72%; left: 14%; animation-delay: 1.7s; }
.deco:nth-child(6) { top: 76%; right: 14%; animation-delay: .9s; }
.deco:nth-child(7) { top: 12%; right: 24%; animation-delay: 1.1s; }
.deco:nth-child(8) { top: 85%; left: 32%; animation-delay: 2s; }

@keyframes starFloat {
    0%, 100% {
        transform: translateY(0) rotate(-12deg) scale(.9);
        opacity: .65;
    }
    50% {
        transform: translateY(-17px) rotate(18deg) scale(1.2);
        opacity: 1;
    }
}

@keyframes heartFloat {
    0%, 100% { transform: translate(0, 0) rotate(-10deg); }
    50% { transform: translate(8px, -20px) rotate(12deg); }
}

@keyframes ballFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-13px) scale(1.08); }
    70% { transform: translateY(4px) scale(.95); }
}

/* 機台主體 */
.gachapon-machine {
    height: min(82vh, 720px);
    width: min(65vh, 490px);
    min-width: 280px;
    max-width: 92vw;
    background: linear-gradient(145deg, #ffb4cb, #f47fa6 55%, #e96c98);
    border: 5px solid #fff;
    border-radius: 34px;
    box-shadow:
        0 12px 0 #cf6489,
        0 22px 35px rgba(164, 83, 116, .25),
        inset 0 3px 8px rgba(255,255,255,.8);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 16px 0;
    transform-origin: center 30%;
    transition: transform .6s ease-in-out;
    z-index: 2;
}

.gachapon-machine.zoom-window {
    transform: scale(2.2);
    transform-origin: center 30%;
}

.gachapon-machine.zoom-exit {
    transform: scale(2.2);
    transform-origin: center 88%;
}

/* 機台頂部 */
.machine-top {
    width: 90%;
    padding: 12px 10px;
    margin-bottom: 14px;
    border: 3px solid #fff;
    border-radius: 22px;
    background: linear-gradient(180deg, #fff9fb, #ffe9f0);
    box-shadow: inset 0 -4px 0 #f3c4d3;
}

.lights {
    display: flex;
    justify-content: space-around;
    margin-bottom: 10px;
}

.light {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff5bd;
    box-shadow: 0 0 8px #fff5bd, 0 0 14px #fff;
    animation: blink 1.5s infinite alternate;
}

.light:nth-child(2n) {
    animation-delay: .5s;
}

.light:nth-child(3n) {
    background: #d9fff0;
    box-shadow: 0 0 8px #d9fff0, 0 0 14px #fff;
    animation-delay: .9s;
}

@keyframes blink {
    from { opacity: .55; transform: scale(.85); }
    to { opacity: 1; transform: scale(1.15); }
}

.machine-label {
    text-align: center;
    color: #bd557b;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 8px;
}

/* 扭蛋展示窗 */
.gachapon-window {
    width: 85%;
    height: 48%;
    min-height: 180px;
    background: linear-gradient(145deg, #fffdfb, #ffeef3);
    border: 5px solid #d98aa7;
    border-radius: 22px;
    overflow: hidden;
    position: relative;
    box-shadow:
        inset 0 0 0 3px #fff,
        inset 0 0 18px rgba(201, 116, 149, .18),
        0 5px 0 #c96d91;
}

#gachaCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

.shake-window {
    animation: shakeAnim .15s infinite;
}

@keyframes shakeAnim {
    0%, 100% { transform: translate(0,0); }
    25% { transform: translate(-3px,2px); }
    50% { transform: translate(3px,-2px); }
}

/* 控制面板 */
.control-panel {
    width: 85%;
    height: 35%;
    min-height: 140px;
    margin-top: 16px;
    padding: 15px 10px;
    border: 3px solid #fff;
    border-radius: 20px;
    background: linear-gradient(145deg, #ffeaf1, #f8c8d9);
    box-shadow: inset 0 -4px 0 rgba(190, 92, 130, .15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
}

.panel-ui {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    transition: opacity .3s;
}

/* 互動轉軸 */
.crank {
    width: 64px;
    height: 64px;
    margin-top: 12px;
    background: linear-gradient(145deg, #fff, #ffe5ed);
    border: 4px solid #d98aa7;
    border-radius: 50%;
    position: relative;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition:
        transform .25s,
        box-shadow .25s,
        filter .25s;
    box-shadow:
        0 5px 0 #c96d91,
        0 7px 12px rgba(160, 80, 115, .18);
}

.crank:hover {
    filter: brightness(1.05);
    box-shadow:
        0 6px 0 #c96d91,
        0 9px 16px rgba(160, 80, 115, .25);
}

.crank:active,
.crank.pressed {
    cursor: grabbing;
    transform: scale(.92);
    box-shadow: 0 2px 0 #c96d91;
}

.crank:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 5px;
}

.crank.rotate {
    animation: crankTurn .55s ease-in-out;
}

@keyframes crankTurn {
    0% { transform: rotate(0deg) scale(1); }
    35% { transform: rotate(150deg) scale(.9); }
    70% { transform: rotate(300deg) scale(1.05); }
    100% { transform: rotate(360deg) scale(1); }
}

/* 轉軸中心 */
.crank::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 42px;
    background: #cf6489;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 4px;
    box-shadow: inset 1px 0 2px rgba(255,255,255,.35);
}

/* 出蛋口 */
.exit-hole {
    width: 85px;
    height: 55px;
    background: linear-gradient(180deg, #59434f, #392c36);
    border: 4px solid #e8bdcd;
    border-radius: 40px 40px 10px 10px;
    position: absolute;
    bottom: -5px;
    box-shadow: inset 0 8px 12px rgba(0,0,0,.8);
    z-index: 5;
}

.machine-bottom {
    color: #fff;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: auto;
    padding-top: 12px;
    text-shadow: 0 1px 3px rgba(130, 40, 75, .3);
}

/* 滾出來的扭蛋 */
.gacha-drop-container {
    display: none;
    position: fixed;
    left: 50%;
    top: 50%;
    width: 140px;
    height: 140px;
    z-index: 9999;
    transform: translate(-50%, -50%);
}

.roll-out-anim {
    display: block !important;
    animation: rollOut .9s cubic-bezier(.2,.75,.3,1) forwards;
}

@keyframes rollOut {
    0% {
        top: 76%;
        transform: translate(-50%, -50%) scale(.15);
    }
    40% {
        top: 62%;
        transform: translate(-50%, -50%) scale(1.5);
    }
    75% {
        top: 50%;
        transform: translate(-50%, -50%) scale(2.5);
    }
    100% {
        top: 50%;
        transform: translate(-50%, -50%) scale(2.5);
    }
}

/* 扭蛋左右搖晃 */
.egg-shell {
    width: 140px;
    height: 140px;
    position: relative;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,.2));
    transform-origin: center center;
}

.egg-shell.wiggle {
    animation: eggWiggle .18s ease-in-out infinite;
}

@keyframes eggWiggle {
    0%, 100% {
        transform: translateX(0) rotate(0deg);
    }
    25% {
        transform: translateX(-9px) rotate(-7deg);
    }
    75% {
        transform: translateX(9px) rotate(7deg);
    }
}

/* 上半球 */
.shell-top {
    width: 140px;
    height: 70px;
    background: linear-gradient(135deg, #fff, #f4a9c2 40%, #ec7fa5);
    border: 5px solid #cf6489;
    border-bottom: none;
    border-radius: 70px 70px 0 0;
    position: absolute;
    top: 0;
    transition: transform .5s;
    z-index: 3;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 顏文字 */
.egg-face {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    font-size: 23px;
    font-weight: bold;
    color: #a84e72;
    line-height: 1;
    z-index: 4;
    pointer-events: none;
}

/* 下半球 */
.shell-bottom {
    width: 140px;
    height: 70px;
    background: linear-gradient(135deg, #fffdf9, #ffe9f0);
    border: 5px solid #d98aa7;
    border-top: none;
    border-radius: 0 0 70px 70px;
    position: absolute;
    bottom: 0;
    transition: transform .5s;
    z-index: 3;
}

/* 開蛋 */
.egg-shell.open .shell-top {
    transform: translateY(-60px) rotate(-15deg);
}

.egg-shell.open .shell-bottom {
    transform: translateY(60px) rotate(15deg);
}

.egg-shell.open .egg-face {
    transform: translateX(-50%) rotate(15deg);
}

/* 金色挑戰卡片 */
.lucky-card {
    display: none;
    position: fixed;
    left: 50%;
    top: 50%;
    width: min(450px, 88vw);
    height: 255px;
    transform: translate(-50%, -50%) scale(.3);
    opacity: 0;
    visibility: hidden;
    z-index: 10002;
    background:
        linear-gradient(
            135deg,
            #fff6cf,
            #f5d47b 35%,
            #d9a638 70%,
            #fff0b5
        );
    border: 5px solid #fff0b5;
    outline: 3px solid #c28b25;
    border-radius: 16px;
    box-shadow:
        0 0 0 8px rgba(220, 174, 74, .25),
        0 15px 45px rgba(93, 58, 15, .35),
        inset 0 0 25px rgba(255,255,255,.65);
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px 30px;
    transition:
        transform .5s cubic-bezier(.2,.8,.3,1),
        opacity .4s;
    pointer-events: none;
}

.lucky-card.show {
    display: flex;
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -50%) scale(1);
}

.lucky-card::before {
    content: '';
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(150, 100, 20, .5);
    border-radius: 8px;
    pointer-events: none;
}

/* 挑戰文字 */
.card-number {
    color: #815018;
    font-size: clamp(17px, 3.8vw, 50px);
    font-weight: bold;
    line-height: 1.5;
    text-align: center;
    width: 100%;
    max-width: 100%;
    max-height: 100%;
    padding: 0 12px;
    overflow-wrap: anywhere;
    word-break: break-word;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    text-shadow: 1px 2px 0 rgba(255,255,255,.6);
    position: relative;
    z-index: 1;
}

/* 點擊關閉畫面 */
.result-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10001;
    cursor: pointer;
    background: transparent;
}

.result-overlay.show {
    display: block;
}

/* 手機版 */
@media (max-width: 420px) {
    h1 {
        font-size: 23px;
    }

    .gachapon-machine {
        height: 78vh;
        width: 88vw;
    }

    .gachapon-window {
        height: 45%;
    }

    .control-panel {
        height: 35%;
    }

    .gachapon-machine.zoom-window,
    .gachapon-machine.zoom-exit {
        transform: scale(1.8);
    }

    .gacha-drop-container {
        width: 120px;
        height: 120px;
    }

    .egg-face {
        font-size: 20px;
    }

    .lucky-card {
        width: 88vw;
        height: 210px;
        padding: 22px 24px;
    }

    .card-number {
        font-size: clamp(16px, 5vw, 21px);
        line-height: 1.5;
        padding: 0 8px;
    }
}

@media (max-height: 650px) {
    h1 {
        top: 1vh;
    }

    .subtitle {
        top: calc(1vh + 35px);
    }

    .gachapon-machine {
        height: 78vh;
    }

    .lucky-card {
        max-height: 85vh;
    }
}
</style>
</head>

<body>

<div class="ambient-decorations">
    <span class="deco deco-star">✦</span>
    <span class="deco deco-heart">♥</span>
    <span class="deco deco-ball"></span>
    <span class="deco deco-star">✧</span>
    <span class="deco deco-heart">♡</span>
    <span class="deco deco-ball mint"></span>
    <span class="deco deco-star">✧</span>
    <span class="deco deco-ball yellow"></span>
</div>

<div class="gachapon-machine" id="machine">

    <div class="machine-top">
        <div class="lights">
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
        </div>
    </div>

    <div class="gachapon-window" id="window">
        <canvas id="gachaCanvas"></canvas>
    </div>

    <div class="control-panel" id="controlPanel">
        <div class="panel-ui" id="panelUi">
            <div
                class="crank"
                id="crank"
                role="button"
                tabindex="0"
                aria-label="啟動扭蛋機"
            ></div>
        </div>

        <div class="exit-hole"></div>
    </div>

    <div class="machine-bottom">
        ✧ LET'S TRY YOUR LUCK ✧
    </div>

</div>

<!-- 滾出來的扭蛋 -->
<div class="gacha-drop-container" id="eggContainer">
    <div class="egg-shell" id="eggShell">
        <div class="shell-top" id="eggTop">
            <span class="egg-face" id="eggFace">ᵔᴥᵔ</span>
        </div>
        <div class="shell-bottom"></div>
    </div>
</div>

<!-- 點擊任意位置關閉結果 -->
<div
    class="result-overlay"
    id="resultOverlay"
    onclick="closeModal()"
></div>

<!-- 中央金色挑戰卡片 -->
<div class="lucky-card" id="luckyCard">
    <div class="card-number" id="cardNumber">挑戰內容</div>
</div>

<script>

/* 25 個抽選選項 */
const destinations = [
    "選項一",
    "選項二",
    "選項三",
    "選項四",
    "選項五",
    "選項六",
    "選項七",
    "選項八",
    "選項九",
    "選項十",
    "選項十一",
    "選項十二",
    "選項十三",
    "選項十四",
    "選項十五",
    "選項十六",
    "選項十七",
    "選項十八",
    "選項十九",
    "選項二十",
    "選項二十一",
    "選項二十二",
    "選項二十三",
    "選項二十四",
    "選項二十五"
];


const BALL_COUNT = destinations.length;

const canvas = document.getElementById('gachaCanvas');
const ctx = canvas.getContext('2d');

let balls = [];
let isShaking = false;
let isDrawing = false;
let animationStarted = false;

const colors = [
    '#F4A9C2',
    '#F7C5A5',
    '#F5D98E',
    '#B9DDB8',
    '#9ED9D0',
    '#A9C9E8',
    '#C9A9E8'
];

const faces = [
    'ᵔᴥᵔ',
    '˶ᵔ ᵕ ᵔ˶'
];

/* 畫布尺寸 */
function resizeCanvas() {
    if (!canvas || !canvas.parentElement) return;

    const rect = canvas.parentElement.getBoundingClientRect();

    canvas.width = rect.width;
    canvas.height = rect.height;
}

/* 扭蛋球 */
class Ball {

    constructor() {

        // 球體大小
        this.radius = Math.min(canvas.width, canvas.height) *
            (0.065 + Math.random() * .025);

        // 初始從展示窗上方落下
        this.x = this.radius +
            Math.random() * (canvas.width - this.radius * 2);

        this.y = -Math.random() * canvas.height * 1.5;

        this.color = colors[
            Math.floor(Math.random() * colors.length)
        ];

        this.face = faces[
            Math.floor(Math.random() * faces.length)
        ];

        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = Math.random() * 1.5;

        this.gravity = 0.22;
        this.friction = 0.985;
        this.restitution = 0.35;
    }

    update() {

        // 重力：讓球體自然往下落
        this.vy += this.gravity;

        if (isShaking) {

            // 搖動時增加隨機力量
            this.vx += (Math.random() - 0.5) * 3.5;
            this.vy += (Math.random() - 0.5) * 3.5;
        }

        // 限制速度
        this.vx = Math.max(-10, Math.min(10, this.vx));
        this.vy = Math.max(-10, Math.min(10, this.vy));

        this.x += this.vx;
        this.y += this.vy;

        // 左側邊界
        if (this.x - this.radius < 0) {
            this.x = this.radius;
            this.vx = Math.abs(this.vx) * this.restitution;
        }

        // 右側邊界
        if (this.x + this.radius > canvas.width) {
            this.x = canvas.width - this.radius;
            this.vx = -Math.abs(this.vx) * this.restitution;
        }

        // 底部邊界
        if (this.y + this.radius > canvas.height) {
            this.y = canvas.height - this.radius;

            if (Math.abs(this.vy) > 0.5) {
                this.vy = -Math.abs(this.vy) * this.restitution;
            } else {
                this.vy = 0;
            }

            this.vx *= this.friction;
        }

        // 頂部邊界
        if (this.y - this.radius < 0 && this.vy < 0) {
            this.y = this.radius;
            this.vy = Math.abs(this.vy) * this.restitution;
        }
    }

    draw() {

        ctx.save();

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius,
            0,
            Math.PI * 2
        );

        ctx.clip();

        // 上半球
        ctx.fillStyle = this.color;

        ctx.fillRect(
            this.x - this.radius,
            this.y - this.radius,
            this.radius * 2,
            this.radius
        );

        // 下半球
        ctx.fillStyle = '#fff8f2';

        ctx.fillRect(
            this.x - this.radius,
            this.y,
            this.radius * 2,
            this.radius
        );

        // 表情
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#a84e72';

        ctx.font =
            `bold ${this.radius * 0.85}px "Microsoft JhengHei", sans-serif`;

        const maxWidth = this.radius * 1.75;
        const textWidth = ctx.measureText(this.face).width;
        const scaleX = Math.min(1, maxWidth / textWidth);

        ctx.save();

        ctx.translate(
            this.x,
            this.y - this.radius * 0.35
        );

        ctx.scale(scaleX, 1);

        ctx.fillText(
            this.face,
            0,
            0
        );

        ctx.restore();

        // 中間接縫
        ctx.beginPath();

        ctx.moveTo(
            this.x - this.radius,
            this.y
        );

        ctx.lineTo(
            this.x + this.radius,
            this.y
        );

        ctx.strokeStyle = '#d98aa7';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 外框
        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle = 'rgba(198, 113, 146, .65)';
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // 反光
        ctx.beginPath();

        ctx.ellipse(
            this.x - this.radius * .35,
            this.y - this.radius * .55,
            this.radius * .22,
            this.radius * .1,
            -.5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = 'rgba(255,255,255,.65)';
        ctx.fill();

        ctx.restore();
    }
}

/* 球體彼此碰撞 */
function resolveBallCollisions() {

    for (let i = 0; i < balls.length; i++) {

        for (let j = i + 1; j < balls.length; j++) {

            const a = balls[i];
            const b = balls[j];

            const dx = b.x - a.x;
            const dy = b.y - a.y;

            const distance = Math.sqrt(dx * dx + dy * dy);
            const minDistance = a.radius + b.radius;

            if (distance === 0 || distance >= minDistance) {
                continue;
            }

            const nx = dx / distance;
            const ny = dy / distance;

            // 球體重疊的距離
            const overlap = minDistance - distance;

            // 平均推開兩顆球
            const push = overlap * 0.5;

            a.x -= nx * push;
            a.y -= ny * push;

            b.x += nx * push;
            b.y += ny * push;

            // 相對速度
            const relativeVX = b.vx - a.vx;
            const relativeVY = b.vy - a.vy;

            const velocityAlongNormal =
                relativeVX * nx + relativeVY * ny;

            // 已經分離時不再施加碰撞力
            if (velocityAlongNormal > 0) {
                continue;
            }

            // 碰撞反作用力
            const restitution = 0.35;

            const impulse =
                -(1 + restitution) * velocityAlongNormal / 2;

            const impulseX = impulse * nx;
            const impulseY = impulse * ny;

            a.vx -= impulseX;
            a.vy -= impulseY;

            b.vx += impulseX;
            b.vy += impulseY;
        }
    }

    // 碰撞後再次限制邊界
    balls.forEach(ball => {

        if (ball.x - ball.radius < 0) {
            ball.x = ball.radius;
        }

        if (ball.x + ball.radius > canvas.width) {
            ball.x = canvas.width - ball.radius;
        }

        if (ball.y + ball.radius > canvas.height) {
            ball.y = canvas.height - ball.radius;
        }
    });
}

/* 動畫 */
function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    balls.forEach(ball => {
        ball.update();
    });

    // 多次碰撞檢查，讓堆疊更穩定
    for (let i = 0; i < 3; i++) {
        resolveBallCollisions();
    }

    balls.forEach(ball => {
        ball.draw();
    });

    requestAnimationFrame(animate);
}

/* 建立 25 顆球 */
function createBalls() {

    balls = [];

    for (let i = 0; i < BALL_COUNT; i++) {
        balls.push(new Ball());
    }
}

/* 初始化 */
window.addEventListener('load', () => {

    resizeCanvas();
    createBalls();

    if (!animationStarted) {
        animationStarted = true;
        animate();
    }
});

window.addEventListener('resize', () => {

    resizeCanvas();
    createBalls();
});

/* =========================
   開始扭蛋
========================= */

function drawNumber() {

    if (isDrawing) return;

    isDrawing = true;

    const machine = document.getElementById('machine');
    const crank = document.getElementById('crank');
    const windowBox = document.getElementById('window');

    const eggContainer = document.getElementById('eggContainer');
    const eggShell = document.getElementById('eggShell');
    const luckyCard = document.getElementById('luckyCard');
    const resultOverlay = document.getElementById('resultOverlay');

    // 轉軸保持顯示
    crank.classList.remove('rotate');
    void crank.offsetWidth;
    crank.classList.add('rotate');

    isShaking = true;

    machine.className = 'gachapon-machine zoom-window';

    windowBox.classList.add('shake-window');

    // 清除上一輪結果
    luckyCard.classList.remove('show');
    resultOverlay.classList.remove('show');

    eggShell.className = 'egg-shell';
    eggContainer.className = 'gacha-drop-container';

    // 1.2 秒後鏡頭移向出蛋口
    setTimeout(() => {

        machine.className = 'gachapon-machine zoom-exit';

    }, 1200);

    // 2.2 秒後扭蛋從下方滾出
    setTimeout(() => {

        isShaking = false;

        windowBox.classList.remove('shake-window');

        const chosenDestination =
            destinations[
                Math.floor(Math.random() * destinations.length)
            ];

        const chosenFace =
            faces[Math.floor(Math.random() * faces.length)];

        const chosenColor =
            colors[Math.floor(Math.random() * colors.length)];

        document.getElementById('eggFace').innerText =
            chosenFace;

        document.getElementById('cardNumber').innerText =
            chosenDestination;

        document.getElementById('eggTop').style.background =
            `linear-gradient(135deg, #fff, ${chosenColor} 40%, ${chosenColor})`;

        eggShell.className = 'egg-shell';

        eggContainer.className =
            'gacha-drop-container roll-out-anim';

        eggContainer.addEventListener('animationend', function handleRollOut(event) {

            if (event.animationName !== 'rollOut') return;

            eggContainer.removeEventListener('animationend', handleRollOut);

            eggShell.classList.add('wiggle');

            setTimeout(() => {

                eggShell.classList.remove('wiggle');

                eggShell.classList.add('open');

                setTimeout(() => {

                    luckyCard.classList.add('show');

                    resultOverlay.classList.add('show');

                }, 300);

            }, 1000);

        });

    }, 2200);
}

/* =========================
   轉軸互動功能
   點擊、拖動皆可啟動
========================= */

const crank = document.getElementById('crank');

let crankStartX = 0;
let crankStartY = 0;
let crankMoved = false;
let suppressCrankClick = false;

crank.addEventListener('pointerdown', (e) => {

    if (isDrawing) return;

    crankStartX = e.clientX;
    crankStartY = e.clientY;
    crankMoved = false;

    crank.classList.add('pressed');

    crank.setPointerCapture(e.pointerId);
});

crank.addEventListener('pointermove', (e) => {

    if (!crank.hasPointerCapture(e.pointerId)) return;

    if (
        Math.abs(e.clientX - crankStartX) > 8 ||
        Math.abs(e.clientY - crankStartY) > 8
    ) {
        crankMoved = true;
    }
});

crank.addEventListener('pointerup', () => {

    crank.classList.remove('pressed');

    if (crankMoved) {

        suppressCrankClick = true;

        drawNumber();

        setTimeout(() => {
            suppressCrankClick = false;
        }, 0);
    }

    crankMoved = false;
});

crank.addEventListener('pointercancel', () => {

    crank.classList.remove('pressed');
    crankMoved = false;
});

crank.addEventListener('click', () => {

    if (suppressCrankClick) {
        suppressCrankClick = false;
        return;
    }

    drawNumber();
});

/* 支援鍵盤 Enter 和空白鍵 */
crank.addEventListener('keydown', (e) => {

    if (e.key === 'Enter' || e.key === ' ') {

        e.preventDefault();

        if (!e.repeat) {
            drawNumber();
        }
    }
});

/* =========================
   點擊畫面，收起挑戰卡片
========================= */

function closeModal() {

    const luckyCard = document.getElementById('luckyCard');
    const resultOverlay = document.getElementById('resultOverlay');

    // 隱藏結果卡片
    luckyCard.classList.remove('show');

    // 關閉點擊層
    resultOverlay.classList.remove('show');

    // 關閉扭蛋
    document.getElementById('eggShell').className =
        'egg-shell';

    document.getElementById('eggContainer').className =
        'gacha-drop-container';

    // 機台恢復原狀
    document.getElementById('machine').className =
        'gachapon-machine';

    // 恢復轉軸
    document.getElementById('crank')
        .classList.remove('rotate', 'pressed');

    // 允許下一次抽取
    isDrawing = false;
}

</script>
