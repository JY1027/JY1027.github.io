<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滿版扭蛋機 - 完美運鏡出蛋版</title>
    <style>
        body { font-family: Arial; background-color: #2c3e50; margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        h1 { position: absolute; top: 3vh; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); transition: opacity 0.4s; margin: 0; font-size: 2rem; z-index: 5; }
        .gachapon-machine { height: 90vmin; width: calc(90vmin * 0.75); max-height: 95vh; max-width: 95vw; background-color: #ff4d4d; border: 6px solid #333; border-radius: 30px; box-shadow: 0 15px 30px rgba(0,0,0,0.4); position: relative; display: flex; flex-direction: column; align-items: center; padding: 4% 0; box-sizing: border-box; transform-origin: center 30%; transition: transform 0.6s ease-in-out, transform-origin 0.6s ease-in-out; z-index: 2; }
        .gachapon-machine.zoom-window { transform: scale(2.2); transform-origin: center 30%; }
        .gachapon-machine.zoom-exit { transform: scale(2.2); transform-origin: center 88%; }
        .hide-element { opacity: 0 !important; pointer-events: none; }
        .gachapon-window { width: 85%; height: 55%; background-color: #e0f7fa; border: 5px solid #333; border-radius: 20px; overflow: hidden; position: relative; }
        #gachaCanvas { width: 100%; height: 100%; display: block; }
        .shake-window { animation: shakeAnim 0.15s infinite; }
        @keyframes shakeAnim { 0%, 100% {transform:translate(0,0);} 25% {transform:translate(-3px,2px);} 50% {transform:translate(3px,-2px);} }
        .control-panel { width: 85%; height: 40%; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding-top: 15px; gap: 15px; position: relative; }
        .panel-ui { transition: opacity 0.3s; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .crank { width: 50px; height: 50px; background-color: #fff; border: 4px solid #333; border-radius: 50%; position: relative; transition: transform 0.5s; }
        .crank.rotate { transform: rotate(360deg); }
        .crank::after { content: ''; position: absolute; width: 12px; height: 40px; background-color: #333; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 4px; }
        .spin-btn { background-color: #ffd700; border: 4px solid #333; padding: 8px 25px; font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 0 #b8860b; }
        .exit-hole { width: 80px; height: 55px; background-color: #111; border: 4px solid #333; border-radius: 40px 40px 10px 10px; position: absolute; bottom: -5px; box-shadow: inset 0 8px 12px rgba(0,0,0,0.9); z-index: 5; }
        .gacha-drop-container { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.1); width: 140px; height: 140px; z-index: 9999; }
        .roll-out-anim { display: block !important; animation: rollOut 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes rollOut { 0% { top: 55%; transform: translate(-50%, -50%) scale(0.1) rotate(0deg); } 100% { top: 50%; transform: translate(-50%, -50%) scale(1) rotate(720deg); } }
        .egg-shell { width: 140px; height: 140px; position: relative; }
        .shell-top { width: 140px; height: 70px; background-color: #ff5252; border: 5px solid #333; border-bottom: none; border-radius: 70px 70px 0 0; box-sizing: border-box; position: absolute; top: 0; transition: transform 0.5s; z-index: 3; }
        .shell-bottom { width: 140px; height: 70px; background-color: #ffffff; border: 5px solid #333; border-top: none; border-radius: 0 0 70px 70px; box-sizing: border-box; position: absolute; bottom: 0; transition: transform 0.5s; z-index: 3; }
        .egg-number { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 90px; height: 90px; background: radial-gradient(circle, #fff, #ffd700); border: 4px solid #333; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; color: #333; box-shadow: 0 0 20px rgba(255,215,0,0.8); z-index: 2; transition: transform 0.5s; }
        .egg-shell.open .shell-top { transform: translateY(-60px) rotate(-15deg); }
        .egg-shell.open .shell-bottom { transform: translateY(60px) rotate(15deg); }
        .egg-shell.open .egg-number { transform: translate(-50%, -50%) scale(1.2); }
        .collect-btn { display: none; position: fixed; top: 75%; left: 50%; transform: translate(-50%, -50%); background-color: #2ecc71; color: white; border: 4px solid #333; padding: 12px 35px; font-size: 1.3rem; font-weight: bold; border-radius: 15px; cursor: pointer; box-shadow: 0 6px 0 #27ae60; z-index: 10000; }
    </style>
</head>
<body>
    <h1 id="mainTitle">🎉 幸運扭蛋機 🎉</h1>
    <div class="gachapon-machine" id="machine">
        <div class="gachapon-window" id="window"><canvas id="gachaCanvas"></canvas></div>
        <div class="control-panel" id="controlPanel">
            <div class="panel-ui" id="panelUi">
                <div class="crank" id="crank"></div>
                <button class="spin-btn" onclick="drawNumber()">啟動扭蛋！</button>
            </div>
            <div class="exit-hole"></div>
        </div>
    </div>
    <div class="gacha-drop-container" id="eggContainer">
        <div class="egg-shell" id="eggShell">
            <div class="shell-top" id="eggTop"></div>
            <div class="egg-number" id="ballNumber">?</div>
            <div class="shell-bottom"></div>
        </div>
    </div>
    <button class="collect-btn" id="collectBtn" onclick="closeModal()">收下號碼</button>

    <script>
        const MIN_NUM = 1, MAX_NUM = 100, BALL_COUNT = 20;
        const canvas = document.getElementById('gachaCanvas'), ctx = canvas.getContext('2d');
        let balls = [], isShaking = false;
        const colors = ['#ff5252', '#ff7043', '#ffca28', '#9ccc65', '#26a69a', '#29b6f6', '#ab47bc'];

        function resizeCanvas() { if (canvas && canvas.parentElement) { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; } }
        class Ball {
            constructor() { this.radius = Math.min(canvas.width, canvas.height) * 0.08; this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius; this.y = canvas.height - this.radius - Math.random() * 30; this.color = colors[Math.floor(Math.random() * colors.length)]; this.vx = (Math.random() - 0.5) * 2; this.vy = (Math.random() - 0.5) * 2; }
            update() {
                if (isShaking) { this.vx += (Math.random() - 0.5) * 4; this.vy += (Math.random() - 0.5) * 4; this.vx = Math.max(-12, Math.min(12, this.vx)); this.vy = Math.max(-12, Math.min(12, this.vy)); } 
                else { this.vx *= 0.95; this.vy *= 0.95; this.vy += 0.2; }
                this.x += this.vx; this.y += this.vy;
                if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -0.6; } if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx *= -0.6; }
                if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -0.6; } if (this.y + this.radius > canvas.height) { this.y = canvas.height - this.radius; this.vy *= -0.6; }
            }
            draw() {
                ctx.save(); ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.clip();
                ctx.fillStyle = '#fff'; ctx.fillRect(this.x - this.radius, this.y, this.radius * 2, this.radius);
                ctx.fillStyle = this.color; ctx.fillRect(this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius);
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.moveTo(this.x - this.radius, this.y); ctx.lineTo(this.x + this.radius, this.y); ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
            }
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            balls.forEach(b => { b.update(); b.draw(); }); requestAnimationFrame(animate);
        }
        window.addEventListener('load', () => { resizeCanvas(); for(let i=0;i<BALL_COUNT;i++) balls.push(new Ball()); animate(); });
        window.addEventListener('resize', () => { resizeCanvas(); });

        function drawNumber() {
            document.getElementById('crank').classList.add('rotate');
            document.getElementById('mainTitle').classList.add('hide-element');
            document.getElementById('panelUi').classList.add('hide-element');
            isShaking = true;
            document.getElementById('machine').className = 'gachapon-machine zoom-window';
            document.getElementById('window').classList.add('shake-window');

            setTimeout(() => { document.getElementById('machine').className = 'gachapon-machine zoom-exit'; }, 1200);

            setTimeout(() => {
                isShaking = false; document.getElementById('window').classList.remove('shake-window');
                const luckyNumber = Math.floor(Math.random() * (MAX_NUM - MIN_NUM + 1)) + MIN_NUM;
                document.getElementById('ballNumber').innerText = luckyNumber;
                document.getElementById('eggTop').style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                document.getElementById('eggContainer').className = 'gacha-drop-container roll-out-anim';
                setTimeout(() => { document.getElementById('eggShell').classList.add('open'); setTimeout(() => { document.getElementById('collectBtn').style.display = 'block'; }, 300); }, 800);
            }, 2200);
        }

        function closeModal() {
document.getElementById('collectBtn').style.display = 'none'; document.getElementById('eggShell').className = 'egg-shell'; document.getElementById('eggContainer').className = 'gacha-drop-container';
document.getElementById('machine').className = 'gachapon-machine'; document.getElementById('mainTitle').classList.remove('hide-element'); document.getElementById('panelUi').classList.remove('hide-element'); document.getElementById('crank').classList.remove('rotate');
}
    </script>
