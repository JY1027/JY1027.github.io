<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 彈珠賽跑 - 免伺服器直開版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111116;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(20, 20, 30, 0.85);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            min-width: 200px;
        }
        h3 { margin: 0 0 10px 0; color: #4dadff; }
        .info-item { margin: 8px 0; font-size: 14px; }
        #winner { color: #ffd700; font-weight: bold; font-size: 16px; display: block; margin-top: 5px; }
        #restart-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #4dadff;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            pointer-events: auto;
            font-weight: bold;
            width: 100%;
        }
        #restart-btn:hover { background: #358ee0; }
    </style>
    <!-- 1. 引入 Three.js 核心庫 -->
    <script src="https://cloudflare.com"></script>
    <!-- 2. 引入不需要 WebAssembly、不鎖 CORS 的 Cannon-es 物理引擎 -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="ui">
        <h3>彈珠賽跑控制台</h3>
        <div class="info-item">狀態：<span id="status" style="color: #4caf50; font-weight: bold;">比賽中...</span></div>
        <div class="info-item">第一名衝線：<span id="winner">⏱️ 激烈競速中...</span></div>
        <button id="restart-btn" onclick="resetRace()">重新起跑</button>
    </div>

    <script>
        // --- 全域變數定義 ---
        let scene, camera, renderer, world;
        const gameObjects = [];
        const marbles = [];
        let gameOver = false;
        const finishLineZ = 7.0; // 終點界線位置

        // 彈珠基本資訊
        const ballData = [
            { name: "🔴 小紅", color: 0xff4757 },
            { name: "🔵 小藍", color: 0x2e86de },
            { name: "🟢 小綠", color: 0x2ed573 },
            { name: "🟡 小黃", color: 0xffa502 },
            { name: "🟣 小紫", color: 0x9b59b6 }
        ];

        // --- 1. 初始化遊戲環境 ---
        function init() {
            // 初始化 Three.js 場景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111116);
            scene.fog = new THREE.FogExp2(0x111116, 0.03); // 加入一點點霧氣增加立體感

            // 初始化 Cannon-es 物理世界
            world = new CANNON.World();
            world.gravity.set(0, -9.81, 2.5); // 稍微給 Z 軸一點向下的重力，讓彈珠順著斜坡加速

            // 相機設定
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 10, 15);

            // 渲染器設定
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // 燈光設定
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // 建立賽道模型
            buildTrack();

            // 生成參賽彈珠
            spawnMarbles();

            // 監聽視窗縮放
            window.addEventListener('resize', onWindowResize);
        }

        // --- 2. 建造賽道組件功能 ---
        function createBox(w, h, d, x, y, z, rx = 0, color = 0x2f3542) {
            // 視覺外觀 (Three.js)
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.rotation.x = rx;
            mesh.receiveShadow = true;
            scene.add(mesh);

            // 物理剛體 (Cannon.js)
            const shape = new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2));
            const body = new CANNON.Body({ mass: 0 }); // mass 為 0 代表靜態、不動的物體
            body.addShape(shape);
            body.position.set(x, y, z);
            body.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), rx);
            world.addBody(body);
        }

        function createPeg(radius, height, x, y, z, color = 0xff4757) {
            // 視覺外觀 (圓柱體)
            const geo = new THREE.CylinderGeometry(radius, radius, height, 16);
            const mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.2 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            scene.add(mesh);

            // 物理剛體 (Cannon.js 的圓柱體旋轉方向與 Three.js 預設不同，通常使用多個球體或簡化成箱子/膠囊)
            // 這裡為了絕對精準且不卡住，我們用一個接近柱子寬度的「球體」當作物理碰撞體（效果很像彈力圓柱）
            const shape = new CANNON.Sphere(radius * 1.2);
            const body = new CANNON.Body({ mass: 0 });
            body.addShape(shape);
            body.position.set(x, y, z);
            world.addBody(body);
        }

        function buildTrack() {
            // 主斜坡板 (寬 7, 厚 0.2, 長 18)
            createBox(7, 0.2, 18, 0, 1, 0, 0.15, 0x1e1e24); 
            
            // 兩側護欄
            createBox(0.2, 1.5, 18, -3.6, 1.6, 0, 0.15, 0x2f3542); // 左牆
            createBox(0.2, 1.5, 18, 3.6, 1.6, 0, 0.15, 0x2f3542);  // 右牆
            
            // 底部擋牆 (終點線後方)
            createBox(74, 1.5, 0.2, 0, 0, 9.1, 0, 0x2f3542);

            // 釘子障礙陣列 (隨機交叉排列)
            for (let row = 0; row < 6; row++) {
                const zPos = -6 + (row * 2.2);
                const cols = row % 2 === 0 ? 5 : 4;
                const spacing = 1.1;
                const startX = -((cols - 1) * spacing) / 2;

                for (let col = 0; col < cols; col++) {
                    const xPos = startX + (col * spacing);
                    // 根據斜坡坡度計算 Y 高度，讓釘子剛好探出路面
                    const yPos = 1 - (zPos * Math.sin(0.15)) + 0.3;
                    
                    // 隨機決定是普通釘子還是高彈力藍色釘子
                    const isSpecial = Math.random() > 0.7;
                    createPeg(0.15, 0.8, xPos, yPos, zPos, isSpecial ? 0x00d2d3 : 0xff4757);
                }
            }
        }

        // --- 3. 生成彈珠功能 ---
        function spawnMarbles() {
            const radius = 0.25;

            // 定義物理材質，用來設定高彈力與低摩擦力
            const ballMaterial = new CANNON.Material("ballMat");
            const groundMaterial = new CANNON.Material("groundMat");
            const contactMaterial = new CANNON.ContactMaterial(ballMaterial, groundMaterial, {
                friction: 0.05,
                restitution: 0.6 // 彈力係數
            });
            world.addContactMaterial(contactMaterial);

            ballData.forEach((data, i) => {
                // 視覺外觀 (球體)
                const geo = new THREE.SphereGeometry(radius, 32, 32);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: data.color, 
                    roughness: 0.1, 
                    metalness: 0.1 
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.castShadow = true;
                scene.add(mesh);

                // 物理剛體
                const shape = new CANNON.Sphere(radius);
                const body = new CANNON.Body({
                    mass: 1, // 重量為 1
                    shape: shape,
                    material: ballMaterial
                });

                // 起點位置排排站 (微調防止重疊疊加)
                const startX = -1.2 + (i * 0.6) + (Math.random() * 0.05);
                const startY = 3.5;
                const startZ = -7.5;
                
                body.position.set(startX, startY, startZ);
                world.addBody(body);

                const marbleObj = { name: data.name, mesh: mesh, body: body };
                marbles.push(marbleObj);
                gameObjects.push(marbleObj);
            });
        }

        // --- 4. 遊戲主要渲染與更新迴圈 ---
        function animate() {
            requestAnimationFrame(animate);

            // 固定每影格前進 1/60 秒物理運算
            world.step(1 / 60);

            // 同步物理數據到 Three.js 畫面上
            gameObjects.forEach(obj => {
                obj.mesh.position.copy(obj.body.position);
                obj.mesh.quaternion.copy(obj.body.quaternion);
            });

            // 追蹤最領先的彈珠以及偵測終點
            let leadingMarble = null;
            let maxZ = -Infinity;

            marbles.forEach(marble => {
                const pos = marble.body.position;

                // 尋找目前跑得最遠（Z 軸最大）的彈珠
                if (pos.z > maxZ) {
                    maxZ = pos.z;
                    leadingMarble = marble;
                }

                // 衝線判斷
                if (!gameOver && pos.z >= finishLineZ) {
                    gameOver = true;
                    document.getElementById("status").innerText = "賽事已結束";
                    document.getElementById("status").style.color = "#ff4757";
                    document.getElementById("winner").innerText = `🎉 恭喜 【${marble.name}】 奪得冠軍！`;
                }
            });

            // 動態鏡頭特寫：跟隨最領先的彈珠移動
            if (leadingMarble) {
                const targetPos = leadingMarble.mesh.position;
                
// 平滑跟隨插值計算（Lerp 效果）
const targetCamX = targetPos.x;
const targetCamY = targetPos.y + 4.5;
const targetCamZ = targetPos.z + 6.0;
camera.position.x += (targetCamX - camera.position.x) * 0.08;
camera.position.y += (targetCamY - camera.position.y) * 0.08;
camera.position.z += (targetCamZ - camera.position.z) * 0.08;
// 鏡頭中心永遠盯著第一名的彈珠
camera.lookAt(targetPos.x, targetPos.y, targetPos.z);
}
renderer.render(scene, camera);
}
// --- 5. 重新比賽重置按鈕功能 ---
window.resetRace = function() {
gameOver = false;
document.getElementById("status").innerText = "比賽中...";
document.getElementById("status").style.color = "#4caf50";
document.getElementById("winner").innerText = "⏱️ 激烈競速中...";
marbles.forEach((marble, i) => {
// 重置速度
marble.body.velocity.set(0, 0, 0);
marble.body.angularVelocity.set(0, 0, 0);
// 重置回起點
const startX = -1.2 + (i * 0.6) + (Math.random() * 0.05);
const startY = 3.5;
const startZ = -7.5;
marble.body.position.set(startX, startY, startZ);
});
};
// 視窗大小改變修正
function onWindowResize() {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
}
// 啟動程式
init();
animate();
    </script>
