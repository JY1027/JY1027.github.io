<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豪華把手馬卡龍拉霸機</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #E8F1F5; /* 馬卡龍柔藍背景 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            color: #6B5B52; 
        }

        h1 {
            color: #FF8B94; /* 蜜桃粉 */
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.8);
            margin-bottom: 5px;
            font-size: clamp(28px, 6vw, 42px);
            text-align: center;
        }

        .subtitle {
            color: #A8E6CF; /* 薄荷綠 */
            text-shadow: 1px 1px 0px rgba(107, 91, 82, 0.2);
            margin-bottom: 20px;
            font-size: clamp(14px, 3.5vw, 18px);
            letter-spacing: 2px;
            font-weight: bold;
            text-align: center;
        }

        /* 整個拉霸機與把手的外層包裹器 */
        .wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 820px; /* 保留把手外延的空間 */
            position: relative;
            padding-right: 70px; /* 為右側把手預留空間 */
        }

        /* 拉霸機外殼 */
        .machine {
            background: linear-gradient(145deg, #FFD3B6, #FFAAA6);
            border: 12px solid #FFF;
            border-radius: 40px;
            padding: clamp(25px, 5vw, 50px);
            box-shadow: 0 20px 40px rgba(255, 139, 148, 0.3), inset 0 0 20px rgba(255,255,255,0.5);
            text-align: center;
            width: 100%;
            z-index: 2;
        }

        /* 實體把手結構系統 */
        .handle-container {
            position: absolute;
            right: 0;
            top: 35%;
            width: 70px;
            height: 180px;
            cursor: pointer;
            z-index: 1;
        }

        /* 把手基座 */
        .handle-base {
            position: absolute;
            left: 0;
            top: 70px;
            width: 25px;
            height: 40px;
            background: #D4F1F4;
            border: 3px solid #FFF;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* 把手連桿（可旋轉軸心） */
        .handle-rod {
            position: absolute;
            left: 10px;
            bottom: 85px; /* 以基座為核心向上延伸 */
            width: 12px;
            height: 80px;
            background: linear-gradient(to right, #FFF, #E0E0E0);
            border-radius: 6px;
            transform-origin: bottom center; /* 關鍵：設定旋轉起點在底部 */
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        /* 把手頂端圓球 */
        .handle-ball {
            position: absolute;
            top: -25px;
            left: -14px;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FF8B94, #FF6B6B);
            border: 3px solid #FFF;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(255, 139, 148, 0.5);
        }

        /* 【核心動畫】下壓狀態樣式 */
        .wrapper.spinning .handle-rod {
            transform: rotateX(180deg) translateY(-20px); /* 3D 下壓翻轉效果 */
        }

        /* 當被禁用（轉動中）時把手不可點擊 */
        .wrapper.spinning .handle-container {
            cursor: not-allowed;
            pointer-events: none;
        }

        /* 滾輪視窗容器 */
        .reels-container {
            display: flex;
            gap: clamp(15px, 4vw, 30px);
            background: #FFFDF9;
            padding: clamp(20px, 4vw, 35px);
            border-radius: 25px;
            border: 6px solid #D4F1F4;
            box-shadow: inset 0 8px 16px rgba(0,0,0,0.06);
            margin-bottom: 35px;
            justify-content: center;
        }

        /* 單個滾輪視窗 */
        .reel-window {
            flex: 1;
            aspect-ratio: 1 / 1; 
            max-width: 160px;  
            max-height: 160px; 
            background: #FFF;
            border-radius: 20px;
            border: 3px solid #FFE5EC;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.04);
        }

        /* 符號樣式 */
        .symbol {
            font-size: clamp(50px, 14vw, 100px); 
            user-select: none;
            filter: none !important;
            transform: none !important;
        }

        /* 按鈕樣式 */
        .spin-btn {
            background: linear-gradient(to bottom, #FF8B94, #FF6B6B);
            color: white;
            border: none;
            padding: 18px 0;
            width: 85%;
            max-width: 320px;
            font-size: clamp(22px, 5vw, 32px);
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 0 #E55B64, 0 12px 25px rgba(255, 139, 148, 0.4);
            transition: all 0.1s ease;
        }

        .spin-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #E55B64, 0 6px 15px rgba(255, 139, 148, 0.4);
        }

        .spin-btn:disabled {
            background: #E0E0E0;
            color: #A0A0A0;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* 訊息提示 */
        .message {
            margin-top: 30px;
            font-size: clamp(22px, 5vw, 28px);
            font-weight: bold;
            height: 40px;
            color: #FF6B6B;
            text-shadow: 1px 1px 0px #FFF;
        }
    </style>
</head>
<body>

    <h1>✨ 夢幻馬卡龍拉霸機 ✨</h1>
    <div class="subtitle">5-SECONDS SWEET FLASHING</div>

    <!-- 包裹器：包含拉霸機本身與外掛把手 -->
    <div class="wrapper" id="gameWrapper">
        <div class="machine">
            <div class="reels-container">
                <div class="reel-window"><div class="symbol" id="reel1">🌸</div></div>
                <div class="reel-window"><div class="symbol" id="reel2">🌸</div></div>
                <div class="reel-window"><div class="symbol" id="reel3">🌸</div></div>
            </div>

            <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN!</button>
            <div class="message" id="msg">READY!</div>
        </div>

        <!-- 實體拉霸把手結構，點擊把手也能啟動 -->
        <div class="handle-container" onclick="spin()">
            <div class="handle-base"></div>
            <div class="handle-rod">
                <div class="handle-ball"></div>
            </div>
        </div>
    </div>

    <script>
        const symbols = ['🍒', '🍓', '🍋', '🍇', '🍊', '🍉', '🍍', '🔔', '💎', '👑', '🍀', '🎀', '🌟'];

        function spin() {
            const btn = document.getElementById('spinBtn');
            const msg = document.getElementById('msg');
            const wrapper = document.getElementById('gameWrapper');
            
            // 啟用轉動狀態（觸發把手下壓動畫、禁用重複點擊）
            btn.disabled = true;
            wrapper.classList.add('spinning');
            
            msg.innerText = '💖 甜蜜狂閃中... 💖';
            msg.style.color = '#FF8B94';

            const reels = [
                document.getElementById('reel1'),
                document.getElementById('reel2'),
                document.getElementById('reel3')
            ];

            // 啟動高頻率輪播計時器（30毫秒）
            const intervals = [];
            reels.forEach((reel) => {
                const intervalId = setInterval(() => {
                    const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                    reel.innerText = randomSymbol;
                }, 30);
                intervals.push(intervalId);
            });

            const results = [];

            // 5秒時長：4.0秒、4.5秒、5.0秒 依序急停
            reels.forEach((reel, index) => {
                const stopTime = 4000 + index * 500; 

                setTimeout(() => {
                    clearInterval(intervals[index]);

                    const finalSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                    reel.innerText = finalSymbol;
                    results.push(finalSymbol);

                    if (results.length === 3) {
                        // 移除下壓狀態，讓把手彈回原位
                        wrapper.classList.remove('spinning');
                        checkResult(results, btn, msg);
                    }
                }, stopTime);
            });
        }

        function checkResult(results, btn, msg) {
            btn.disabled = false;

            if (results === results && results === results) {
                const winSymbol = results;
                if (winSymbol === '🌟') {
                    msg.innerHTML = '👑 ✨ JACKPOT 超級幸運大獎 !!! ✨ 👑';
                    msg.style.color = '#FFAAA6';
                } else if (['💎', '👑', '🎀'].includes(winSymbol)) {
                    msg.innerText = `🎁 哇！連線奢華寶物 ${winSymbol}！ 🎁`;
                    msg.style.color = '#FF8B94';
                } else {
                    msg.innerText = `🥳 恭喜成功連線 ${winSymbol}！ 🥳`;
                    msg.style.color = '#6B5B52';
                }
            } else {
                msg.innerText = '🌸 好可惜，再試一次吧！';
                msg.style.color = '#BAA193';
            }
        }
    </script>
</body>
</html>
