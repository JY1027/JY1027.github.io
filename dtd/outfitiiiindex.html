
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夢幻穿搭風格抽卡</title>

<style>
:root {
    --pink: #f47fa6;
    --deep-pink: #cf527e;
    --light-pink: #ffe5ed;
    --cream: #fff8f2;
    --dark: #573b4b;
    --mint: #b9e6d8;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 12px;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background:
        radial-gradient(circle at 15% 20%, #ffffff 0 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, #ffffff 0 2px, transparent 3px),
        linear-gradient(135deg, #fff0f4, #fce0e9 55%, #fff4e9);
    background-size: 55px 55px, 75px 75px, auto;
    color: var(--dark);
}

/* 機台主體 */
.machine {
    position: relative;
    width: min(100%, 490px);
    padding: 15px;
    border: 5px solid #fff;
    border-radius: 34px;
    background: linear-gradient(145deg, #ffb4cb, #f47fa6 55%, #e96c98);
    box-shadow:
        0 12px 0 #cf6489,
        0 22px 35px rgba(164, 83, 116, .25),
        inset 0 3px 8px rgba(255,255,255,.8);
}

/* 機台頂部 */
.machine-top {
    position: relative;
    padding: 17px 10px 15px;
    margin-bottom: 15px;
    text-align: center;
    border: 3px solid #fff;
    border-radius: 22px;
    background: linear-gradient(180deg, #fff9fb, #ffe9f0);
    box-shadow: inset 0 -4px 0 #f3c4d3;
}

.lights {
    display: flex;
    justify-content: space-around;
    margin: 0 5px 12px;
}

.light {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff5bd;
    box-shadow: 0 0 8px #fff5bd, 0 0 14px #fff;
    animation: blink 1.5s infinite alternate;
}

.light:nth-child(2n) { animation-delay: .5s; }

.light:nth-child(3n) {
    background: #d9fff0;
    box-shadow: 0 0 8px #d9fff0, 0 0 14px #fff;
    animation-delay: .9s;
}

@keyframes blink {
    from { opacity: .55; transform: scale(.85); }
    to { opacity: 1; transform: scale(1.15); }
}

/* T恤、裙子、鞋子插畫 */
.art-illustrations {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 5px auto 8px;
}

.art-illustrations svg {
    width: 230px;
    height: 145px;
    overflow: visible;
    filter: drop-shadow(0 4px 3px rgba(180, 100, 130, .15));
    animation: outfitFloat 2s ease-in-out infinite alternate;
}

@keyframes outfitFloat {
    from { transform: translateY(3px); }
    to { transform: translateY(-5px); }
}

/* 展示窗 */
.showcase {
    position: relative;
    padding: 17px;
    border: 5px solid #d98aa7;
    border-radius: 22px;
    background: linear-gradient(145deg, #fffdfb, #ffeef3);
    box-shadow:
        inset 0 0 0 3px #fff,
        inset 0 0 18px rgba(201, 116, 149, .18),
        0 5px 0 #c96d91;
}

.showcase-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
}

.showcase-header span {
    color: #b75b7d;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

.status-light {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #75ad9c;
    font-size: 11px;
    font-weight: bold;
}

.status-light::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #8ed9b8;
    box-shadow: 0 0 7px #8ed9b8;
}

/* 稀有度機率 */
.rates {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-bottom: 15px;
}

.rate-item {
    padding: 9px 3px;
    border-radius: 10px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    background: #fff;
    border: 1px solid #f1d3df;
    color: #8b7180;
}

.rate-item strong {
    display: block;
    margin-bottom: 3px;
    font-size: 17px;
}

.rate-item.ssr strong { color: #d69a28; }
.rate-item.sr strong { color: #a477d5; }
.rate-item.r strong { color: #8296a5; }

/* 出卡口 */
.dispenser {
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border: 5px solid #e8bdcd;
    border-radius: 16px;
    background: linear-gradient(180deg, #59434f, #392c36);
    box-shadow:
        inset 0 8px 15px rgba(0,0,0,.5),
        0 2px 0 #fff;
}

.dispenser::before,
.dispenser::after {
    content: "✦";
    position: absolute;
    color: rgba(255,255,255,.2);
    font-size: 30px;
    pointer-events: none;
}

.dispenser::before { top: 12px; left: 15px; }
.dispenser::after { bottom: 12px; right: 15px; }

.empty-message {
    color: #d9b9c8;
    font-size: 14px;
    letter-spacing: 2px;
}

/* 抽選文字 */
.drawing-message {
    position: absolute;
    z-index: 3;
    color: #fff0f6;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow:
        0 0 5px #ffb4d0,
        0 0 12px #f47fa6,
        0 0 20px #f47fa6;
    display: none;
    pointer-events: none;
}

.drawing-message.show {
    display: block;
    animation: drawingBlink .55s infinite alternate;
}

@keyframes drawingBlink {
    from { opacity: .3; transform: scale(.96); }
    to { opacity: 1; transform: scale(1.04); }
}

/* 卡片 */
.card {
    position: fixed;
    z-index: 1000;
    left: 50%;
    top: 50%;
    width: min(78vw, 300px);
    height: min(115vw, 430px);
    max-height: 75vh;
    perspective: 1200px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(.65);

    transition:
        left .8s cubic-bezier(.2, .8, .2, 1),
        top .8s cubic-bezier(.2, .8, .2, 1),
        transform .8s cubic-bezier(.2, .8, .2, 1),
        opacity .3s ease;

    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.card.drop {
    left: 50%;
    top: 50%;
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -50%) scale(1);
}

.card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .9s cubic-bezier(.2, .75, .25, 1);
}

.card.flipped .card-inner {
    transform: rotateY(180deg);
}

.card-front,
.card-back {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 19px;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

/* 正面：預設底色 */
.card-front {
    display: flex;
    align-items: center;
    justify-content: center;
    border: 5px solid #fff5df;

    background:
        radial-gradient(circle at center, #fff2d0 0 3%, transparent 3.5%),
        repeating-radial-gradient(
            circle at center,
            transparent 0 17px,
            rgba(255,255,255,.65) 18px 20px,
            transparent 21px 34px
        ),
        linear-gradient(145deg, #f7b4ca, #d96f9c 50%, #a94e7d);

    box-shadow:
        inset 0 0 0 7px rgba(255,255,255,.3),
        inset 0 0 30px rgba(90,30,70,.2),
        0 15px 35px rgba(0,0,0,.3);
}

/* SSR 金色卡片 */
.card.SSR .card-front {
    background:
        radial-gradient(circle at center, #fff3c4 0 3%, transparent 3.5%),
        repeating-radial-gradient(
            circle at center,
            transparent 0 17px,
            rgba(255,255,255,.55) 18px 20px,
            transparent 21px 34px
        ),
        linear-gradient(145deg, #f5d77c, #d69a28 50%, #a8751e);
}

/* SR 紫色卡片 */
.card.SR .card-front {
    background:
        radial-gradient(circle at center, #f0e2ff 0 3%, transparent 3.5%),
        repeating-radial-gradient(
            circle at center,
            transparent 0 17px,
            rgba(255,255,255,.55) 18px 20px,
            transparent 21px 34px
        ),
        linear-gradient(145deg, #d9c0f5, #a477d5 50%, #7853a9);
}

/* R 銀灰色卡片 */
.card.R .card-front {
    background:
        radial-gradient(circle at center, #edf3f5 0 3%, transparent 3.5%),
        repeating-radial-gradient(
            circle at center,
            transparent 0 17px,
            rgba(255,255,255,.55) 18px 20px,
            transparent 21px 34px
        ),
        linear-gradient(145deg, #cbd8df, #8296a5 50%, #5e7180);
}

.totem-frame {
    position: absolute;
    inset: 15px;
    border: 2px solid rgba(255,245,220,.9);
    border-radius: 12px;
    box-shadow:
        0 0 0 5px rgba(255,255,255,.12),
        inset 0 0 20px rgba(255,255,255,.15);
}

.totem-symbol {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 145px;
    height: 145px;
    border: 3px solid #fff0d0;
    border-radius: 50%;
    color: #fff2d6;
    font-size: 82px;
    text-shadow:
        0 0 10px rgba(255,255,255,.8),
        0 0 25px rgba(255,225,170,.8);
    box-shadow:
        0 0 0 9px rgba(255,255,255,.12),
        0 0 0 13px rgba(255,238,205,.45),
        0 0 35px rgba(255,230,190,.6);
}

.totem-symbol::before,
.totem-symbol::after {
    content: "✦";
    position: absolute;
    color: #fff1d1;
    font-size: 25px;
}

.totem-symbol::before {
    top: -35px;
    left: 50%;
    transform: translateX(-50%);
}

.totem-symbol::after {
    bottom: -35px;
    left: 50%;
    transform: translateX(-50%);
}

.corner {
    position: absolute;
    color: #fff1d1;
    font-size: 27px;
}

.corner.tl { top: 25px; left: 25px; }
.corner.tr { top: 25px; right: 25px; }
.corner.bl { bottom: 25px; left: 25px; }
.corner.br { bottom: 25px; right: 25px; }

/* 背面圖片 */
.card-back {
    transform: rotateY(180deg);
    background: #fff;
    border: 5px solid #fff5df;
    box-shadow: 0 15px 35px rgba(0,0,0,.3);
}

.card-back img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* 圖片載入失敗 */
.card-back img.image-error {
    opacity: 0;
}

/* 稀有度外框：正面與背面同色 */
.card.SSR .card-front,
.card.SSR .card-back {
    border-color: #d69a28;
    box-shadow:
        0 0 15px rgba(214,154,40,.8),
        0 0 35px rgba(255,190,64,.55),
        0 15px 35px rgba(0,0,0,.3);
}

.card.SR .card-front,
.card.SR .card-back {
    border-color: #a477d5;
    box-shadow:
        0 0 18px rgba(164,119,213,.8),
        0 0 35px rgba(164,119,213,.45),
        0 15px 35px rgba(0,0,0,.3);
}

.card.R .card-front,
.card.R .card-back {
    border-color: #8296a5;
    box-shadow:
        0 0 15px rgba(130,150,165,.7),
        0 0 30px rgba(130,150,165,.35),
        0 15px 35px rgba(0,0,0,.3);
}

.card.ready {
    pointer-events: auto;
}

/* 控制區 */
.control-panel {
    margin-top: 18px;
    padding: 15px;
    border: 3px solid #fff;
    border-radius: 20px;
    background: linear-gradient(145deg, #ffeaf1, #f8c8d9);
    box-shadow: inset 0 -4px 0 rgba(190, 92, 130, .15);
}

.draw-button {
    width: 100%;
    padding: 16px 12px;
    border: 3px solid #fff;
    border-radius: 15px;
    background: linear-gradient(180deg, #a8e8d5, #6cc9ae);
    color: #315f54;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow:
        0 6px 0 #4da88f,
        0 8px 12px rgba(100,155,135,.2);
    transition: .15s;
}

.draw-button:hover {
    filter: brightness(1.06);
    transform: translateY(-2px);
}

.draw-button:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #4da88f;
}

.draw-button:disabled {
    filter: grayscale(.5);
    cursor: not-allowed;
    transform: none;
}

/* 機台底部 */
.machine-bottom {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    padding-top: 17px;
    color: #fff;
    font-size: 11px;
    letter-spacing: 3px;
    text-shadow: 0 1px 3px rgba(130,40,75,.3);
}

@media (max-width: 420px) {
    .machine {
        padding: 11px;
        border-radius: 27px;
    }

    .showcase { padding: 12px; }
    .dispenser { height: 175px; }
    .control-panel { padding: 12px; }

    .art-illustrations svg {
        width: 210px;
        height: 135px;
    }

    .card {
        width: min(78vw, 280px);
        height: min(112vw, 400px);
    }

    .totem-symbol {
        width: 125px;
        height: 125px;
        font-size: 70px;
    }
}
</style>
</head>

<script>

/* =================================
   13 種風格專屬圖片
================================= */

const cardImages = {
    "奶蛙裝": "../images/cards/奶蛙裝.jpg",
    "哥德風": "../images/cards/哥德風.jpg",

    "泰系": "../images/cards/泰系.jpg",
    "新中式": "../images/cards/新中式.jpg",
    "英倫風": "../images/cards/英倫風.jpg",
    "八九風": "../images/cards/八九風.jpg",

    "韓系": "../images/cards/韓系.jpg",
    "日系": "../images/cards/日系.jpg",
    "臺系": "../images/cards/臺系.jpg",
    "美式": "../images/cards/美式.jpg",
    "港風": "../images/cards/港風.jpg",
    "老錢風": "../images/cards/老錢風.jpg",
    "監獄風": "../images/cards/監獄風.jpg"
};


/* =================================
   穿搭風格卡池
================================= */

const cardPool = {

    // SSR：5%
    SSR: [
        "奶蛙裝",
        "哥德風"
    ],

    // SR：20%
    SR: [
        "泰系",
        "新中式",
        "英倫風",
        "八九風"
    ],

    // R：75%
    R: [
        "韓系",
        "日系",
        "臺系",
        "美式",
        "港風",
        "老錢風",
        "監獄風"
    ]
};


let isDrawing = false;
let audioContext = null;


/* =================================
   音效
================================= */

function playBeep(freq, type, duration) {
    try {
        if (!audioContext) {
            audioContext = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(
            0.09,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + duration
        );

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();
        osc.stop(audioContext.currentTime + duration);

    } catch (error) {
        console.log("音效無法播放：", error);
    }
}


function playStartSound() {
    playBeep(587.33, "sine", 0.15);

    setTimeout(() => {
        playBeep(880, "sine", 0.2);
    }, 100);
}


function playRaritySound(rarity) {

    if (rarity === "SSR") {

        playBeep(1046, "sine", 0.2);

        setTimeout(() => {
            playBeep(1318, "sine", 0.25);
        }, 120);

    } else if (rarity === "SR") {

        playBeep(784, "triangle", 0.25);

    } else {

        playBeep(523, "triangle", 0.2);
    }
}


/* =================================
   抽卡邏輯
================================= */

// SSR 5%、SR 20%、R 75%
function getRarity() {

    const roll = Math.random();

    if (roll < 0.05) {
        return "SSR";
    }

    if (roll < 0.25) {
        return "SR";
    }

    return "R";
}


// 從該稀有度的卡池抽出一種風格
function getRandomStyle(rarity) {

    const list = cardPool[rarity];

    const index = Math.floor(
        Math.random() * list.length
    );

    return list[index];
}


function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}


/* =================================
   將卡片放到出卡口位置
================================= */

function positionCardAtDispenser() {

    const dispenser =
        document.getElementById("dispenser");

    const cardOutput =
        document.getElementById("card-output");

    const rect = dispenser.getBoundingClientRect();

    cardOutput.style.left =
        (rect.left + rect.width / 2) + "px";

    cardOutput.style.top =
        (rect.top + rect.height / 2) + "px";
}


/* =================================
   抽卡主程式
================================= */

async function draw() {

    if (isDrawing) return;

    isDrawing = true;

    const cardOutput =
        document.getElementById("card-output");

    const cardImage =
        document.getElementById("card-image");

    const emptyMessage =
        document.getElementById("empty-message");

    const drawingMessage =
        document.getElementById("drawing-message");

    const drawButton =
        document.getElementById("draw-button");

    // 鎖定按鈕
    drawButton.disabled = true;

    // 重設卡片
    cardOutput.classList.remove(
        "ready",
        "flipped",
        "drop"
    );

    cardOutput.style.visibility = "hidden";
    cardOutput.style.opacity = "0";
    cardOutput.style.pointerEvents = "none";

    emptyMessage.style.display = "none";

    // 顯示抽選文字
    drawingMessage.classList.add("show");

    playStartSound();

    await wait(1200);

    drawingMessage.classList.remove("show");

    // 抽稀有度
    const rarity = getRarity();

    // 抽具體風格
    const styleName = getRandomStyle(rarity);

    // 取得該風格專屬圖片
    const imagePath = cardImages[styleName];

    console.log("抽中稀有度：", rarity);
    console.log("抽中風格：", styleName);

    // 設定卡片圖片
    cardImage.classList.remove("image-error");
    cardImage.alt = styleName;

    cardImage.onerror = function() {
        console.warn(
            "圖片載入失敗，請檢查路徑：",
            imagePath
        );
        this.classList.add("image-error");
    };

    cardImage.onload = function() {
        this.classList.remove("image-error");
    };

    cardImage.src = imagePath;

    // 設定稀有度外框及正面底色
    cardOutput.className = `card ${rarity}`;

    // 先放到出卡口
    positionCardAtDispenser();

    cardOutput.style.visibility = "visible";
    cardOutput.style.opacity = "1";

    // 強制瀏覽器套用初始位置
    void cardOutput.offsetWidth;

    // 卡片掉到螢幕中央
    requestAnimationFrame(() => {
        cardOutput.classList.add("drop");
    });

    playRaritySound(rarity);

    // 等待掉落完成
    await wait(850);

    // 正面停留
    await wait(550);

    // 翻轉卡片
    cardOutput.classList.add("flipped");

    // 等待翻轉完成
    await wait(950);

    // 開放點擊卡片
    cardOutput.classList.add("ready");

    drawButton.disabled = false;
    drawButton.innerText = "點擊卡片抽下一張";

    isDrawing = false;
}


/* =================================
   點擊卡片：抽下一張
================================= */

function handleCardClick() {

    const cardOutput =
        document.getElementById("card-output");

    if (!cardOutput.classList.contains("ready")) {
        return;
    }

    if (isDrawing) return;

    draw();
}


/* =================================
   按鈕事件
================================= */

document.getElementById("draw-button").addEventListener(
    "click",
    function() {

        if (isDrawing) return;

        const cardOutput =
            document.getElementById("card-output");

        // 卡片已出現時，改由點擊卡片抽下一張
        if (cardOutput.classList.contains("ready")) {
            return;
        }

        draw();
    }
);


/* =================================
   卡片點擊事件
================================= */

document.getElementById("card-output").addEventListener(
    "click",
    handleCardClick
);

</script>
