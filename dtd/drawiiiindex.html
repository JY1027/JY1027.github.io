
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夢幻職業抽卡機</title>

<style>
:root {
    --pink: #f47fa6;
    --deep-pink: #cf527e;
    --light-pink: #ffe5ed;
    --cream: #fff8f2;
    --dark: #573b4b;
    --mint: #b9e6d8;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 12px;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background:
        radial-gradient(circle at 15% 20%, #ffffff 0 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, #ffffff 0 2px, transparent 3px),
        linear-gradient(135deg, #fff0f4, #fce0e9 55%, #fff4e9);
    background-size: 55px 55px, 75px 75px, auto;
    color: var(--dark);
}

/* 機台主體 */
.machine {
    position: relative;
    width: min(100%, 490px);
    padding: 15px;
    border: 5px solid #fff;
    border-radius: 34px;
    background: linear-gradient(145deg, #ffb4cb, #f47fa6 55%, #e96c98);
    box-shadow:
        0 12px 0 #cf6489,
        0 22px 35px rgba(164, 83, 116, .25),
        inset 0 3px 8px rgba(255,255,255,.8);
}

/* 機台頂部 */
.machine-top {
    position: relative;
    padding: 17px 10px 15px;
    margin-bottom: 15px;
    text-align: center;
    border: 3px solid #fff;
    border-radius: 22px;
    background: linear-gradient(180deg, #fff9fb, #ffe9f0);
    box-shadow: inset 0 -4px 0 #f3c4d3;
}

.machine-top h1 {
    margin: 10px 0 0;
    font-size: clamp(23px, 6vw, 30px);
    letter-spacing: 3px;
    color: #bd557b;
    text-shadow: 1px 2px 0 #fff;
}

.subtitle {
    margin-top: 7px;
    color: #bd8298;
    font-size: 12px;
    letter-spacing: 3px;
}

/* 頂部燈泡 */
.lights {
    display: flex;
    justify-content: space-around;
    margin: 0 5px 12px;
}

.light {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff5bd;
    box-shadow: 0 0 8px #fff5bd, 0 0 14px #fff;
    animation: blink 1.5s infinite alternate;
}

.light:nth-child(2n) { animation-delay: .5s; }

.light:nth-child(3n) {
    background: #d9fff0;
    box-shadow: 0 0 8px #d9fff0, 0 0 14px #fff;
    animation-delay: .9s;
}

@keyframes blink {
    from { opacity: .55; transform: scale(.85); }
    to { opacity: 1; transform: scale(1.15); }
}

/* 繪畫插畫 */
.art-illustrations {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    margin: 5px auto 8px;
}

.art-illustrations svg {
    width: 75px;
    height: 75px;
    overflow: visible;
    filter: drop-shadow(0 4px 3px rgba(180, 100, 130, .15));
}

.art-illustrations svg:nth-child(2) {
    width: 88px;
    height: 88px;
}

/* 展示窗 */
.showcase {
    position: relative;
    padding: 17px;
    border: 5px solid #d98aa7;
    border-radius: 22px;
    background: linear-gradient(145deg, #fffdfb, #ffeef3);
    box-shadow:
        inset 0 0 0 3px #fff,
        inset 0 0 18px rgba(201, 116, 149, .18),
        0 5px 0 #c96d91;
}

.showcase-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
}

.showcase-header span {
    color: #b75b7d;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

.status-light {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #75ad9c;
    font-size: 11px;
    font-weight: bold;
}

.status-light::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #8ed9b8;
    box-shadow: 0 0 7px #8ed9b8;
}

/* 稀有度機率 */
.rates {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-bottom: 15px;
}

.rate-item {
    padding: 9px 3px;
    border-radius: 10px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    background: #fff;
    border: 1px solid #f1d3df;
    color: #8b7180;
}

.rate-item strong {
    display: block;
    margin-bottom: 3px;
    font-size: 17px;
}

.rate-item.ssr strong { color: #d69a28; }
.rate-item.sr strong { color: #a477d5; }
.rate-item.r strong { color: #8296a5; }

/* 卡片出卡口 */
.dispenser {
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border: 5px solid #e8bdcd;
    border-radius: 16px;
    background: linear-gradient(180deg, #59434f, #392c36);
    box-shadow:
        inset 0 8px 15px rgba(0,0,0,.5),
        0 2px 0 #fff;
}

.dispenser::before,
.dispenser::after {
    content: "✦";
    position: absolute;
    color: rgba(255,255,255,.2);
    font-size: 30px;
    pointer-events: none;
}

.dispenser::before { top: 12px; left: 15px; }
.dispenser::after { bottom: 12px; right: 15px; }

.empty-message {
    color: #d9b9c8;
    font-size: 14px;
    letter-spacing: 2px;
}

/* 抽選文字 */
.drawing-message {
    position: absolute;
    z-index: 3;
    color: #fff0f6;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow:
        0 0 5px #ffb4d0,
        0 0 12px #f47fa6,
        0 0 20px #f47fa6;
    display: none;
    pointer-events: none;
}

.drawing-message.show {
    display: block;
    animation: drawingBlink .55s infinite alternate;
}

@keyframes drawingBlink {
    from {
        opacity: .3;
        transform: scale(.96);
    }
    to {
        opacity: 1;
        transform: scale(1.04);
    }
}

/* 卡片 */
.card {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(78%, 300px);
    height: 135px;
    padding: 12px;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(145deg, #fff, #fff1f5);
    color: #775365;
    border: 3px solid #f2cada;
    box-shadow: 0 8px 18px rgba(0,0,0,.3);

    transform: translate(-50%, -230px) scale(.85);
    opacity: 0;
    visibility: hidden;

    transition:
        transform .65s cubic-bezier(.2, 1.35, .4, 1),
        opacity .3s ease;

    z-index: 2;
}

.card.drop {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    visibility: visible;
}

.card-rarity {
    margin-bottom: 9px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 3px;
}

.card-name {
    font-size: clamp(18px, 5vw, 24px);
    font-weight: bold;
    line-height: 1.4;
}

/* SSR 卡片 */
.card.SSR {
    background: linear-gradient(135deg, #fff3b8, #ffc95f, #f4a63d);
    border: 4px solid #fff6d6;
    color: #8d541b;
    box-shadow:
        0 0 12px #ffdb70,
        0 0 30px rgba(255, 190, 64, .8),
        0 8px 18px rgba(0,0,0,.3);
}

/* SR 卡片 */
.card.SR {
    background: linear-gradient(135deg, #f2e5ff, #d6b8fa, #b991e7);
    border: 4px solid #fff;
    color: #63458d;
    box-shadow:
        0 0 18px rgba(199, 158, 255, .7),
        0 8px 18px rgba(0,0,0,.3);
}

/* R 卡片 */
.card.R {
    background: linear-gradient(135deg, #fff, #eaf5f4);
    border: 3px solid #d5e8e3;
    color: #557a73;
}

/* 控制區 */
.control-panel {
    margin-top: 18px;
    padding: 15px;
    border: 3px solid #fff;
    border-radius: 20px;
    background: linear-gradient(145deg, #ffeaf1, #f8c8d9);
    box-shadow: inset 0 -4px 0 rgba(190, 92, 130, .15);
}

/* 抽卡按鈕 */
.draw-button {
    width: 100%;
    padding: 16px 12px;
    border: 3px solid #fff;
    border-radius: 15px;
    background: linear-gradient(180deg, #a8e8d5, #6cc9ae);
    color: #315f54;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow:
        0 6px 0 #4da88f,
        0 8px 12px rgba(100, 155, 135, .2);
    transition: .15s;
}

.draw-button:hover {
    filter: brightness(1.06);
    transform: translateY(-2px);
}

.draw-button:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #4da88f;
}

.draw-button:disabled {
    filter: grayscale(.5);
    cursor: not-allowed;
    transform: none;
}

/* 機台底部 */
.machine-bottom {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    padding-top: 17px;
    color: #fff;
    font-size: 11px;
    letter-spacing: 3px;
    text-shadow: 0 1px 3px rgba(130, 40, 75, .3);
}

@media (max-width: 420px) {
    .machine {
        padding: 11px;
        border-radius: 27px;
    }

    .showcase { padding: 12px; }
    .dispenser { height: 175px; }
    .control-panel { padding: 12px; }

    .art-illustrations { gap: 12px; }

    .art-illustrations svg {
        width: 65px;
        height: 65px;
    }
}
</style>
</head>

<body>

<div class="machine">

    <!-- 機台頂部 -->
    <div class="machine-top">

        <div class="lights">
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
        </div>

        <!-- 繪畫主題 SVG 插畫 -->
        <div class="art-illustrations">

            <!-- 調色盤 -->
            <svg viewBox="0 0 100 100" aria-label="調色盤">
                <path d="M50 12 C26 12 10 29 10 51 C10 73 28 88 49 88
                         C60 88 66 81 66 73 C66 67 61 63 61 57
                         C61 50 70 48 78 48 C88 48 92 42 89 33
                         C84 20 68 12 50 12Z"
                      fill="#F4B4CB" stroke="#D77D9F" stroke-width="3"/>
                <circle cx="30" cy="38" r="7" fill="#F5D66E"/>
                <circle cx="49" cy="27" r="7" fill="#91CDB8"/>
                <circle cx="68" cy="34" r="7" fill="#A9B8E8"/>
                <circle cx="31" cy="61" r="7" fill="#E88B9E"/>
                <circle cx="49" cy="69" r="7" fill="#D4A5E8"/>
                <circle cx="72" cy="72" r="5" fill="#FFF5E8"/>
            </svg>

            <!-- 畫筆 -->
            <svg viewBox="0 0 100 100" aria-label="畫筆">
                <path d="M29 68 L65 20 Q70 13 77 19 L82 24
                         Q87 30 81 36 L45 81 L29 68Z"
                      fill="#E9A0B9" stroke="#BD6687" stroke-width="3"/>
                <path d="M29 68 L45 81 L33 91 Q26 95 20 89
                         Q15 83 21 76Z"
                      fill="#F3D5A8" stroke="#BD6687" stroke-width="3"/>
                <path d="M65 20 L81 36" stroke="#FFF3F6" stroke-width="4"/>
                <path d="M35 65 L48 75" stroke="#FFF3F6" stroke-width="3"/>
            </svg>

            <!-- 鉛筆 -->
            <svg viewBox="0 0 100 100" aria-label="鉛筆">
                <g transform="rotate(42 50 50)">
                    <rect x="37" y="15" width="26" height="65"
                          rx="5" fill="#F5CE83"
                          stroke="#D6A85F" stroke-width="3"/>
                    <path d="M37 15 Q50 3 63 15 L63 25 L37 25Z"
                          fill="#E98EA9" stroke="#D77D9F" stroke-width="3"/>
                    <path d="M37 80 L50 96 L63 80Z"
                          fill="#E8D5B7" stroke="#D6A85F" stroke-width="3"/>
                    <path d="M45 87 L50 96 L55 87Z" fill="#6E5960"/>
                    <path d="M40 31 L60 31 M40 68 L60 68"
                          stroke="#FFF3D6" stroke-width="3"/>
                </g>
            </svg>

        </div>
    </div>

    <!-- 展示櫥窗 -->
    <div class="showcase">

        <div class="showcase-header">
            <span>CHARACTER COLLECTION</span>
            <span class="status-light">機台運作中</span>
        </div>

        <div class="rates">
            <div class="rate-item ssr">
                <strong>SSR</strong>
                5%
            </div>

            <div class="rate-item sr">
                <strong>SR</strong>
                20%
            </div>

            <div class="rate-item r">
                <strong>R</strong>
                75%
            </div>
        </div>

        <!-- 出卡口 -->
        <div class="dispenser">

            <div class="empty-message" id="empty-message">
                等待卡片掉落
            </div>

            <!-- 抽選文字 -->
            <div class="drawing-message" id="drawing-message">
                正在抽選……
            </div>

            <!-- 卡片 -->
            <div id="card-output" class="card">
                <div id="card-rarity" class="card-rarity"></div>
                <div id="card-name" class="card-name"></div>
            </div>

        </div>
    </div>

    <!-- 控制面板 -->
    <div class="control-panel">

        <button
            id="draw-button"
            class="draw-button"
            onclick="draw()"
        >
            就決定是你了
        </button>

    </div>

    <div class="machine-bottom">
        <span>✧</span>
        <span>LET'S CREATE YOUR CHARACTER</span>
        <span>✧</span>
    </div>

</div>

<script>

/* 職業卡池 */
const cardPool = {

    SSR: [
        "祭司", "傀儡師", "怪盜", "死神",
        "國王", "魔法師", "反派", "將軍",
        "間諜", "刺客", "特務", "傭兵",
        "超能力者", "精靈"
    ],

    SR: [
        "法醫", "保鏢", "機長", "賽車手",
        "調香師", "軍醫", "航海士", "藥劑師",
        "馴獸師", "修女", "騎士", "駭客",
        "拳擊手", "律師", "偵探", "獸醫",
        "芭蕾舞者", "獵人", "向導"
    ],

    R: [
        "廚師", "理髮師", "木匠", "保全",
        "記者", "清潔工", "園藝師", "咖啡師",
        "水電工", "保姆", "老師", "泳將",
        "烘焙師", "快遞員", "裁縫師", "調酒師",
        "外送員"
    ]

};

let isDrawing = false;

/* 共用音效環境 */
let audioContext = null;

function playBeep(freq, type, duration) {
    try {
        if (!audioContext) {
            audioContext = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(
            0.09,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + duration
        );

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();
        osc.stop(audioContext.currentTime + duration);

    } catch (error) {
        console.log("音效無法播放：", error);
    }
}

/* 抽卡音效 */
function playStartSound() {
    playBeep(587.33, "sine", 0.15);

    setTimeout(() => {
        playBeep(880, "sine", 0.2);
    }, 100);
}

/* 稀有度抽選 */
function getRarity() {
    const roll = Math.random();

    if (roll < 0.05) {
        return "SSR";
    } else if (roll < 0.25) {
        return "SR";
    } else {
        return "R";
    }
}

/* 隨機取得職業 */
function getRandomArtItem(rarity) {
    const list = cardPool[rarity];
    const index = Math.floor(Math.random() * list.length);
    return list[index];
}

/* 等待指定時間 */
function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

/* 抽卡主程式 */
async function draw() {

    if (isDrawing) return;

    isDrawing = true;

    const cardOutput =
        document.getElementById("card-output");

    const cardRarity =
        document.getElementById("card-rarity");

    const cardName =
        document.getElementById("card-name");

    const emptyMessage =
        document.getElementById("empty-message");

    const drawingMessage =
        document.getElementById("drawing-message");

    const drawButton =
        document.getElementById("draw-button");

    /* 1. 收回上一張卡片 */
    cardOutput.className = "card";
    emptyMessage.style.display = "none";

    /* 隱藏舊抽選文字 */
    drawingMessage.classList.remove("show");

    /* 2. 鎖定按鈕 */
    drawButton.disabled = true;

    /* 3. 顯示抽選文字 */
    drawingMessage.classList.add("show");

    /* 播放啟動音效 */
    playStartSound();

    /* 4. 等待 1.2 秒 */
    await wait(1200);

    /* 5. 抽選文字消失 */
    drawingMessage.classList.remove("show");

    /* 決定稀有度與職業 */
    const rarity = getRarity();
    const name = getRandomArtItem(rarity);

    /* 設定卡片內容 */
    cardRarity.innerText = `${rarity} CHARACTER`;
    cardName.innerText = name;

    /* 6. 設定卡片稀有度 */
    cardOutput.className = `card ${rarity}`;

    /* 確保瀏覽器先套用初始位置 */
    void cardOutput.offsetWidth;

    /* 開始掉落動畫 */
    requestAnimationFrame(() => {
        cardOutput.classList.add("drop");
    });

    /* 7. 根據稀有度播放音效 */
    if (rarity === "SSR") {

        playBeep(1046, "sine", 0.2);

        setTimeout(() => {
            playBeep(1318, "sine", 0.25);
        }, 120);

    } else if (rarity === "SR") {

        playBeep(784, "triangle", 0.25);

    } else {

        playBeep(523, "triangle", 0.2);
    }

    /* 8. 等待卡片掉落動畫完成 */
    await wait(750);

    /* 9. 恢復抽卡功能，卡片留在出卡口 */
    drawButton.disabled = false;
    isDrawing = false;
}

</script>

</body>
</html>
