<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickMe｜拉霸機教學</title>
<link rel="stylesheet" href="../tool-transition.css">
<script src="../tool-transition.js"></script>

<link rel="stylesheet" href="slot.css">
</head>

<body>

<div class="wrapper" id="gameWrapper">

    <div class="machine">
        <div class="machine-inner">

            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>

            <div class="top-decoration">
                <span class="line"></span>
                <span class="top-star">✦</span>
                <span class="top-star">✧</span>
                <span class="top-star">✦</span>
                <span class="line"></span>
            </div>

            <div class="light-row">
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
            </div>

            <div class="reels-container" id="reelsContainer">
                <div class="reel-window">
                    <div class="symbol" id="reel1"></div>
                </div>
                <div class="reel-window">
                    <div class="symbol" id="reel2"></div>
                </div>
                <div class="reel-window">
                    <div class="symbol" id="reel3"></div>
                </div>
            </div>

            <div class="divider">GOOD LUCK</div>

            <div class="message" id="msg">READY TO PLAY</div>

        </div>
    </div>

    <div class="handle-container" id="handle">
        <div class="handle-base"></div>
        <div class="handle-rod">
            <div class="handle-ball"></div>
        </div>
    </div>

</div>

<!-- ===== 新手教學面板 ===== -->

<div class="tutorial-card" id="tutorialCard">

    <div class="tutorial-step" id="tutorialStep">
        新手教學
    </div>

    <div class="tutorial-title" id="tutorialTitle">
        歡迎來到拉霸機！
    </div>

    <div class="tutorial-description" id="tutorialDescription">
        初次體驗嗎？快來認識拉霸機的玩法。
    </div>

    <!-- 提示文字 -->
    <div class="tutorial-hint" id="tutorialHint"></div>

    <!-- 進度條：提示文字下方、按鈕上方 -->
    <div class="tutorial-progress" id="tutorialProgress">
        <span class="progress-dot"></span>
        <span class="progress-dot"></span>
        <span class="progress-dot"></span>
        <span class="progress-dot"></span>
    </div>

    <div class="tutorial-actions">
        <button class="tutorial-button" id="tutorialButton">
            開始教學
        </button>
        <button class="tutorial-skip-button" id="tutorialSkip">
            跳過教學
        </button>
    </div>

</div>

<!-- ===== SVG 插畫素材庫 ===== -->

<svg xmlns="http://www.w3.org/2000/svg"
     class="svg-sprite"
     aria-hidden="true">

<defs>

<linearGradient id="redFruit" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#ff9b9e"/>
<stop offset="1" stop-color="#e84f70"/>
</linearGradient>

<linearGradient id="pinkFruit" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#ffc5d4"/>
<stop offset="1" stop-color="#f27eaa"/>
</linearGradient>

<linearGradient id="yellowFruit" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#fff1a8"/>
<stop offset="1" stop-color="#f3bc50"/>
</linearGradient>

<linearGradient id="purpleFruit" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#d9b6ed"/>
<stop offset="1" stop-color="#9870c5"/>
</linearGradient>

<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#fff0b0"/>
<stop offset="1" stop-color="#d9a64e"/>
</linearGradient>

<linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#d9ffff"/>
<stop offset=".5" stop-color="#8ed9e8"/>
<stop offset="1" stop-color="#75a6d5"/>
</linearGradient>

</svg>

<script src="slot.js"></script>

</body>
</html>
