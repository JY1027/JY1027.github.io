<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickMe｜假日去哪逛抽卡</title>
<link rel="stylesheet" href="../tool-transition.css">
<script src="../tool-transition.js"></script>

<link rel="stylesheet" href="travel-card.css">
</head>

<body>

<div class="machine">

    <div class="machine-top">

        <div class="lights">
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
        </div>

        <!-- 旅行主題插畫 -->
        <div class="art-illustrations">

            <!-- 後背包 -->
            <svg viewBox="0 0 100 100" aria-label="後背包">
                <path d="M29 35 Q15 42 19 72"
                      fill="none" stroke="#BD6687"
                      stroke-width="7" stroke-linecap="round"/>
                <path d="M71 35 Q85 42 81 72"
                      fill="none" stroke="#BD6687"
                      stroke-width="7" stroke-linecap="round"/>
                <rect x="24" y="30" width="52" height="59"
                      rx="15" fill="#F4A9C2"
                      stroke="#C96F91" stroke-width="3"/>
                <path d="M39 31 Q39 13 50 13 Q61 13 61 31"
                      fill="none" stroke="#C96F91"
                      stroke-width="6" stroke-linecap="round"/>
                <rect x="33" y="55" width="34" height="24"
                      rx="8" fill="#FFDCE8"
                      stroke="#D77D9F" stroke-width="2.5"/>
                <path d="M42 57 L58 57"
                      stroke="#C96F91" stroke-width="2.5"/>
                <path d="M50 65 L52 70 L57 72 L52 74 L50 79 L48 74 L43 72 L48 70Z"
                      fill="#E6B84F"/>
            </svg>

            <!-- 行李箱 -->
            <svg viewBox="0 0 100 100" aria-label="行李箱">
                <path d="M39 25 V12 H61 V25"
                      fill="none" stroke="#BD6687"
                      stroke-width="5" stroke-linecap="round"/>
                <rect x="19" y="25" width="62" height="62"
                      rx="12" fill="#B9E6D8"
                      stroke="#70B9A2" stroke-width="3"/>
                <path d="M50 27 V85"
                      stroke="#70B9A2" stroke-width="3"
                      stroke-dasharray="4 4"/>
                <path d="M29 37 V75 M71 37 V75"
                      stroke="#E7FFF6" stroke-width="4"
                      stroke-linecap="round"/>
                <rect x="43" y="48" width="14" height="9"
                      rx="3" fill="#FFF5E8"/>
                <circle cx="32" cy="91" r="5" fill="#BD6687"/>
                <circle cx="68" cy="91" r="5" fill="#BD6687"/>
                <path d="M62 60 L64 64 L68 66 L64 68 L62 72 L60 68 L56 66 L60 64Z"
                      fill="#F4C66B"/>
            </svg>

            <!-- 旅遊地圖 -->
            <svg viewBox="0 0 100 100" aria-label="旅遊地圖">
                <path d="M12 25 L38 15 L63 25 L88 15
                         L88 75 L63 85 L38 75 L12 85Z"
                      fill="#FFF0C9" stroke="#D6A85F"
                      stroke-width="3" stroke-linejoin="round"/>
                <path d="M38 15 V75 M63 25 V85"
                      stroke="#D6A85F" stroke-width="2.5"
                      stroke-dasharray="3 3"/>
                <path d="M21 62 Q34 43 48 55 T76 38"
                      fill="none" stroke="#E98EA9"
                      stroke-width="4" stroke-linecap="round"
                      stroke-dasharray="5 4"/>
                <path d="M67 27 C67 19 73 15 79 19
                         C86 24 82 32 67 46
                         C52 32 48 24 55 19
                         C61 15 67 19 67 27Z"
                      fill="#F47FA6" stroke="#BD6687"
                      stroke-width="2"/>
                <circle cx="67" cy="26" r="4" fill="#FFF8F2"/>
                <path d="M26 35 L28 40 L33 42 L28 44 L26 49 L24 44 L19 42 L24 40Z"
                      fill="#E6B84F"/>
            </svg>

        </div>
    </div>

    <!-- 展示櫥窗 -->
    <div class="showcase">

        <div class="showcase-header">
            <span>ATTRACTION COLLECTION</span>
            <span class="status-light">機臺運作中</span>
        </div>

        <div class="rates">
            <div class="rate-item ssr">
                <strong>SSR</strong>
                5%
            </div>
            <div class="rate-item sr">
                <strong>SR</strong>
                20%
            </div>
            <div class="rate-item r">
                <strong>R</strong>
                75%
            </div>
        </div>

        <!-- 出卡口 -->
        <div class="dispenser" id="dispenser">

            <div class="empty-message" id="empty-message">
                等待卡片掉落
            </div>

            <div class="drawing-message" id="drawing-message">
                正在抽選……
            </div>

        </div>
    </div>

    <!-- 控制面板 -->
    <div class="control-panel">
        <button id="draw-button" class="draw-button">
            就決定是你了
        </button>
    </div>

    <div class="machine-bottom">
        <span>✧</span>
        <span>LET'S CHOOSE YOUR ATTRACTION</span>
        <span>✧</span>
    </div>

</div>

<!-- 卡片 -->
<div id="card-output" class="card">

    <div class="card-inner">

        <!-- 正面 -->
        <div class="card-front">
            <div class="totem-frame"></div>
            <span class="corner tl">✦</span>
            <span class="corner tr">✧</span>
            <span class="corner bl">✧</span>
            <span class="corner br">✦</span>
            <div class="totem-symbol">✧</div>
        </div>

        <!-- 背面 -->
        <div class="card-back">
            <div class="back-decoration"></div>
            <div class="back-star">✦ ✧ ✦</div>
            <div id="card-rarity" class="card-back-rarity">
                SSR COLLECTION
            </div>
            <div id="card-name" class="card-back-name">
                臺北101
            </div>
        </div>

    </div>
</div>

<script src="travel-card.js"></script>

</body>
</html>
