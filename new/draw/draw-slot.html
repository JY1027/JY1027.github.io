
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickMe｜畫畫沒靈感拉霸機</title>
<link rel="stylesheet" href="../tool-transition.css">
<script src="../tool-transition.js"></script>

<link rel="stylesheet" href="draw-slot.css">
</head>

<body>

<div class="wrapper" id="gameWrapper">

    <div class="machine">

        <div class="machine-inner">

            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>

            <div class="top-decoration">
                <span class="line"></span>
                <span class="top-star">✦</span>
                <span class="top-star">✧</span>
                <span class="top-star">✦</span>
                <span class="line"></span>
            </div>

            <div class="light-row">
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
            </div>

            <div class="reels-container">
                <div class="reel-window">
                    <div class="symbol" id="reel1"></div>
                </div>

                <div class="reel-window">
                    <div class="symbol" id="reel2"></div>
                </div>

                <div class="reel-window">
                    <div class="symbol" id="reel3"></div>
                </div>
            </div>

            <div class="divider"> CHOOSE YOUR CHARACTER </div>

            <div class="message" id="msg">
                READY TO PLAY
            </div>

        </div>
    </div>

    <div class="handle-container" id="handle">
        <div class="handle-base"></div>
        <div class="handle-rod">
            <div class="handle-ball"></div>
        </div>
    </div>

</div>

<script src="draw-slot.js"></script>

</body>
</html>
