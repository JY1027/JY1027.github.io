
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickMe｜畫畫沒靈感抽卡</title>
<link rel="stylesheet" href="../tool-transition.css">
<script src="../tool-transition.js"></script>

<style>
:root {
    --pink: #f47fa6;
    --deep-pink: #cf527e;
    --light-pink: #ffe5ed;
    --cream: #fff8f2;
    --dark: #573b4b;
    --mint: #b9e6d8;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 12px;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background:
        radial-gradient(circle at 15% 20%, #ffffff 0 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, #ffffff 0 2px, transparent 3px),
        linear-gradient(135deg, #fff0f4, #fce0e9 55%, #fff4e9);
    background-size: 55px 55px, 75px 75px, auto;
    color: var(--dark);
}

/* 機臺主體 */
.machine {
    position: relative;
    width: min(100%, 490px);
    padding: 15px;
    border: 5px solid #fff;
    border-radius: 34px;
    background: linear-gradient(145deg, #ffb4cb, #f47fa6 55%, #e96c98);
    box-shadow:
        0 12px 0 #cf6489,
        0 22px 35px rgba(164, 83, 116, .25),
        inset 0 3px 8px rgba(255,255,255,.8);
}

/* 機臺頂部 */
.machine-top {
    position: relative;
    padding: 17px 10px 15px;
    margin-bottom: 15px;
    text-align: center;
    border: 3px solid #fff;
    border-radius: 22px;
    background: linear-gradient(180deg, #fff9fb, #ffe9f0);
    box-shadow: inset 0 -4px 0 #f3c4d3;
}

/* 燈泡 */
.lights {
    display: flex;
    justify-content: space-around;
    margin: 0 5px 12px;
}

.light {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff5bd;
    box-shadow: 0 0 8px #fff5bd, 0 0 14px #fff;
    animation: blink 1.5s infinite alternate;
}

.light:nth-child(2n) {
    animation-delay: .5s;
}

.light:nth-child(3n) {
    background: #d9fff0;
    box-shadow: 0 0 8px #d9fff0, 0 0 14px #fff;
    animation-delay: .9s;
}

@keyframes blink {
    from {
        opacity: .55;
        transform: scale(.85);
    }
    to {
        opacity: 1;
        transform: scale(1.15);
    }
}

/* 繪畫插畫 */
.art-illustrations {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    margin: 5px auto 8px;
}

.art-illustrations svg {
    width: 75px;
    height: 75px;
    overflow: visible;
    filter: drop-shadow(0 4px 3px rgba(180,100,130,.15));
}

.art-illustrations svg:nth-child(2) {
    width: 88px;
    height: 88px;
}

/* 展示窗 */
.showcase {
    position: relative;
    padding: 17px;
    border: 5px solid #d98aa7;
    border-radius: 22px;
    background: linear-gradient(145deg, #fffdfb, #ffeef3);
    box-shadow:
        inset 0 0 0 3px #fff,
        inset 0 0 18px rgba(201,116,149,.18),
        0 5px 0 #c96d91;
}

.showcase-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
}

.showcase-header span {
    color: #b75b7d;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

.status-light {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #75ad9c;
    font-size: 11px;
    font-weight: bold;
}

.status-light::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #8ed9b8;
    box-shadow: 0 0 7px #8ed9b8;
}

/* 稀有度機率 */
.rates {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 7px;
    margin-bottom: 15px;
}

.rate-item {
    padding: 9px 3px;
    border-radius: 10px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    background: #fff;
    border: 1px solid #f1d3df;
    color: #8b7180;
}

.rate-item strong {
    display: block;
    margin-bottom: 3px;
    font-size: 17px;
}

.rate-item.ssr strong {
    color: #d69a28;
}

.rate-item.sr strong {
    color: #a477d5;
}

.rate-item.r strong {
    color: #8296a5;
}

/* 出卡口 */
.dispenser {
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border: 5px solid #e8bdcd;
    border-radius: 16px;
    background: linear-gradient(180deg, #59434f, #392c36);
    box-shadow:
        inset 0 8px 15px rgba(0,0,0,.5),
        0 2px 0 #fff;
}

.dispenser::before,
.dispenser::after {
    content: "✦";
    position: absolute;
    color: rgba(255,255,255,.2);
    font-size: 30px;
    pointer-events: none;
}

.dispenser::before {
    top: 12px;
    left: 15px;
}

.dispenser::after {
    bottom: 12px;
    right: 15px;
}

.empty-message {
    color: #d9b9c8;
    font-size: 14px;
    letter-spacing: 2px;
}

/* 抽選文字 */
.drawing-message {
    position: absolute;
    z-index: 3;
    color: #fff0f6;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow:
        0 0 5px #ffb4d0,
        0 0 12px #f47fa6,
        0 0 20px #f47fa6;
    display: none;
    pointer-events: none;
}

.drawing-message.show {
    display: block;
    animation: drawingBlink .55s infinite alternate;
}

@keyframes drawingBlink {
    from {
        opacity: .3;
        transform: scale(.96);
    }
    to {
        opacity: 1;
        transform: scale(1.04);
    }
}

/* 卡片本體 */
.card {
    position: fixed;
    z-index: 1000;
    left: 50%;
    top: 50%;
    width: min(88vw, 380px);
    aspect-ratio: 1.55 / 1;
    perspective: 1200px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(.55);
    transition:
        left .8s cubic-bezier(.2,.8,.2,1),
        top .8s cubic-bezier(.2,.8,.2,1),
        transform .8s cubic-bezier(.2,.8,.2,1),
        opacity .3s ease;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

/* 卡片掉落至中央 */
.card.drop {
    left: 50%;
    top: 50%;
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -50%) scale(1);
}

/* 卡片消失 */
.card.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(.4);
}

/* 卡片內部翻轉 */
.card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .9s cubic-bezier(.2,.75,.25,1);
}

.card.flipped .card-inner {
    transform: rotateY(180deg);
}

/* 正反面共同設定 */
.card-front,
.card-back {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 19px;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

/* 卡片正面 */
.card-front {
    display: flex;
    align-items: center;
    justify-content: center;
    border: 5px solid #fff5df;
    background:
        radial-gradient(circle at center, #fff2d0 0 3%, transparent 3.5%),
        repeating-radial-gradient(
            circle at center,
            transparent 0 17px,
            rgba(255,255,255,.65) 18px 20px,
            transparent 21px 34px
        ),
        linear-gradient(145deg, #f7b4ca, #d96f9c 50%, #a94e7d);
    box-shadow:
        inset 0 0 0 7px rgba(255,255,255,.3),
        inset 0 0 30px rgba(90,30,70,.2),
        0 15px 35px rgba(0,0,0,.3);
}

/* SSR 金色 */
.card.SSR .card-front {
    background:
        radial-gradient(circle at center, #fff3c4 0 3%, transparent 3.5%),
        repeating-radial-gradient(
            circle at center,
            transparent 0 17px,
            rgba(255,255,255,.55) 18px 20px,
            transparent 21px 34px
        ),
        linear-gradient(145deg, #f5d77c, #d69a28 50%, #a8751e);
}

/* SR 紫色 */
.card.SR .card-front {
    background:
        radial-gradient(circle at center, #f0e2ff 0 3%, transparent 3.5%),
        repeating-radial-gradient(
            circle at center,
            transparent 0 17px,
            rgba(255,255,255,.55) 18px 20px,
            transparent 21px 34px
        ),
        linear-gradient(145deg, #d9c0f5, #a477d5 50%, #7853a9);
}

/* R 銀灰色 */
.card.R .card-front {
    background:
        radial-gradient(circle at center, #edf3f5 0 3%, transparent 3.5%),
        repeating-radial-gradient(
            circle at center,
            transparent 0 17px,
            rgba(255,255,255,.55) 18px 20px,
            transparent 21px 34px
        ),
        linear-gradient(145deg, #cbd8df, #8296a5 50%, #5e7180);
}

/* 正面裝飾框 */
.totem-frame {
    position: absolute;
    inset: 13px;
    border: 2px solid rgba(255,245,220,.9);
    border-radius: 12px;
    box-shadow:
        0 0 0 5px rgba(255,255,255,.12),
        inset 0 0 20px rgba(255,255,255,.15);
}

/* 正面中央圖騰 */
.totem-symbol {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 105px;
    height: 105px;
    border: 3px solid #fff0d0;
    border-radius: 50%;
    color: #fff2d6;
    font-size: 65px;
    text-shadow:
        0 0 10px rgba(255,255,255,.8),
        0 0 25px rgba(255,225,170,.8);
    box-shadow:
        0 0 0 8px rgba(255,255,255,.12),
        0 0 0 12px rgba(255,238,205,.45),
        0 0 35px rgba(255,230,190,.6);
}

.totem-symbol::before,
.totem-symbol::after {
    content: "✦";
    position: absolute;
    color: #fff1d1;
    font-size: 23px;
}

.totem-symbol::before {
    top: -31px;
}

.totem-symbol::after {
    bottom: -31px;
}

/* 四角裝飾 */
.corner {
    position: absolute;
    color: #fff1d1;
    font-size: 24px;
}

.corner.tl {
    top: 19px;
    left: 20px;
}

.corner.tr {
    top: 19px;
    right: 20px;
}

.corner.bl {
    bottom: 19px;
    left: 20px;
}

.corner.br {
    bottom: 19px;
    right: 20px;
}

/* 卡片背面 */
.card-back {
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
    background: linear-gradient(145deg, #fffdfb, #fff0f5);
    border: 5px solid #fff5df;
    box-shadow: 0 15px 35px rgba(0,0,0,.3);
}

.back-decoration {
    position: absolute;
    inset: 12px;
    border: 2px solid #edcfda;
    border-radius: 12px;
    pointer-events: none;
}

.back-star {
    color: #dba9bb;
    font-size: 18px;
    letter-spacing: 12px;
    margin-bottom: 10px;
}

.card-back-rarity {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 12px;
    color: #b87991;
}

.card-back-name {
    position: relative;
    z-index: 2;
    width: 100%;
    font-size: clamp(19px, 5vw, 27px);
    font-weight: bold;
    line-height: 1.4;
    text-align: center;
    color: #775365;
    overflow-wrap: anywhere;
}

.card-back-hint {
    margin-top: 15px;
    font-size: 10px;
    letter-spacing: 3px;
    color: #c39aa9;
}

/* SSR 卡片背面 */
.card.SSR .card-front,
.card.SSR .card-back {
    border-color: #d69a28;
    box-shadow:
        0 0 15px rgba(214,154,40,.8),
        0 0 35px rgba(255,190,64,.55),
        0 15px 35px rgba(0,0,0,.3);
}

.card.SSR .card-back {
    background: linear-gradient(145deg, #fff9e7, #fff0c7);
}

.card.SSR .card-back-rarity {
    color: #c18b27;
}

.card.SSR .card-back-name {
    color: #94631e;
}

/* SR 卡片背面 */
.card.SR .card-front,
.card.SR .card-back {
    border-color: #a477d5;
    box-shadow:
        0 0 18px rgba(164,119,213,.8),
        0 0 35px rgba(164,119,213,.45),
        0 15px 35px rgba(0,0,0,.3);
}

.card.SR .card-back {
    background: linear-gradient(145deg, #fcf8ff, #eee1ff);
}

.card.SR .card-back-rarity {
    color: #9570be;
}

.card.SR .card-back-name {
    color: #76549c;
}

/* R 卡片背面 */
.card.R .card-front,
.card.R .card-back {
    border-color: #8296a5;
    box-shadow:
        0 0 15px rgba(130,150,165,.7),
        0 0 30px rgba(130,150,165,.35),
        0 15px 35px rgba(0,0,0,.3);
}

.card.R .card-back {
    background: linear-gradient(145deg, #ffffff, #edf3f6);
}

.card.R .card-back-rarity {
    color: #8296a5;
}

.card.R .card-back-name {
    color: #5e7180;
}

/* 卡片翻開後 */
.card.ready {
    pointer-events: auto;
}

/* 控制面板 */
.control-panel {
    margin-top: 18px;
    padding: 15px;
    border: 3px solid #fff;
    border-radius: 20px;
    background: linear-gradient(145deg, #ffeaf1, #f8c8d9);
    box-shadow: inset 0 -4px 0 rgba(190,92,130,.15);
}

/* 抽卡按鈕 */
.draw-button {
    width: 100%;
    padding: 16px 12px;
    border: 3px solid #fff;
    border-radius: 15px;
    background: linear-gradient(180deg, #a8e8d5, #6cc9ae);
    color: #315f54;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow:
        0 6px 0 #4da88f,
        0 8px 12px rgba(100,155,135,.2);
    transition: .15s;
}

.draw-button:hover {
    filter: brightness(1.06);
    transform: translateY(-2px);
}

.draw-button:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #4da88f;
}

.draw-button:disabled {
    filter: grayscale(.5);
    cursor: not-allowed;
    transform: none;
}

/* 機臺底部 */
.machine-bottom {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    padding-top: 17px;
    color: #fff;
    font-size: 11px;
    letter-spacing: 3px;
    text-shadow: 0 1px 3px rgba(130,40,75,.3);
}

/* 手機版 */
@media (max-width: 420px) {
    .machine {
        padding: 11px;
        border-radius: 27px;
    }

    .showcase {
        padding: 12px;
    }

    .dispenser {
        height: 175px;
    }

    .control-panel {
        padding: 12px;
    }

    .art-illustrations {
        gap: 12px;
    }

    .art-illustrations svg {
        width: 65px;
        height: 65px;
    }

    .art-illustrations svg:nth-child(2) {
        width: 75px;
        height: 75px;
    }

    .card {
        width: 88vw;
        max-width: 360px;
    }

    .totem-symbol {
        width: 85px;
        height: 85px;
        font-size: 53px;
    }
}

@media (max-width: 350px) {
    .card {
        width: 90vw;
    }

    .card-back {
        padding: 18px;
    }

    .totem-symbol {
        width: 75px;
        height: 75px;
        font-size: 45px;
    }
}
</style>
</head>

<body>

<div class="machine">

    <!-- 機臺頂部 -->
    <div class="machine-top">

        <div class="lights">
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
        </div>

        <!-- 繪畫主題插畫 -->
        <div class="art-illustrations">

            <!-- 調色盤 -->
            <svg viewBox="0 0 100 100" aria-label="調色盤">
                <path d="M50 12 C26 12 10 29 10 51 C10 73 28 88 49 88
                         C60 88 66 81 66 73 C66 67 61 63 61 57
                         C61 50 70 48 78 48 C88 48 92 42 89 33
                         C84 20 68 12 50 12Z"
                      fill="#F4B4CB" stroke="#D77D9F" stroke-width="3"/>
                <circle cx="30" cy="38" r="7" fill="#F5D66E"/>
                <circle cx="49" cy="27" r="7" fill="#91CDB8"/>
                <circle cx="68" cy="34" r="7" fill="#A9B8E8"/>
                <circle cx="31" cy="61" r="7" fill="#E88B9E"/>
                <circle cx="49" cy="69" r="7" fill="#D4A5E8"/>
                <circle cx="72" cy="72" r="5" fill="#FFF5E8"/>
            </svg>

            <!-- 畫筆 -->
            <svg viewBox="0 0 100 100" aria-label="畫筆">
                <path d="M29 68 L65 20 Q70 13 77 19 L82 24
                         Q87 30 81 36 L45 81 L29 68Z"
                      fill="#E9A0B9" stroke="#BD6687" stroke-width="3"/>
                <path d="M29 68 L45 81 L33 91 Q26 95 20 89
                         Q15 83 21 76Z"
                      fill="#F3D5A8" stroke="#BD6687" stroke-width="3"/>
                <path d="M65 20 L81 36" stroke="#FFF3F6" stroke-width="4"/>
                <path d="M35 65 L48 75" stroke="#FFF3F6" stroke-width="3"/>
            </svg>

            <!-- 鉛筆 -->
            <svg viewBox="0 0 100 100" aria-label="鉛筆">
                <g transform="rotate(42 50 50)">
                    <rect x="37" y="15" width="26" height="65"
                          rx="5" fill="#F5CE83"
                          stroke="#D6A85F" stroke-width="3"/>
                    <path d="M37 15 Q50 3 63 15 L63 25 L37 25Z"
                          fill="#E98EA9" stroke="#D77D9F" stroke-width="3"/>
                    <path d="M37 80 L50 96 L63 80Z"
                          fill="#E8D5B7" stroke="#D6A85F" stroke-width="3"/>
                    <path d="M45 87 L50 96 L55 87Z" fill="#6E5960"/>
                    <path d="M40 31 L60 31 M40 68 L60 68"
                          stroke="#FFF3D6" stroke-width="3"/>
                </g>
            </svg>

        </div>
    </div>

    <!-- 展示櫥窗 -->
    <div class="showcase">

        <div class="showcase-header">
            <span>CHARACTER COLLECTION</span>
            <span class="status-light">機臺運作中</span>
        </div>

        <!-- 稀有度機率 -->
        <div class="rates">
            <div class="rate-item ssr">
                <strong>SSR</strong>
                5%
            </div>

            <div class="rate-item sr">
                <strong>SR</strong>
                20%
            </div>

            <div class="rate-item r">
                <strong>R</strong>
                75%
            </div>
        </div>

        <!-- 出卡口 -->
        <div class="dispenser" id="dispenser">

            <div class="empty-message" id="empty-message">
                等待卡片掉落
            </div>

            <div class="drawing-message" id="drawing-message">
                正在抽選……
            </div>

        </div>
    </div>

    <!-- 控制面板 -->
    <div class="control-panel">

        <button id="draw-button" class="draw-button">
            就決定是你了
        </button>

    </div>

    <div class="machine-bottom">
        <span>✧</span>
        <span>LET'S CREATE YOUR CHARACTER</span>
        <span>✧</span>
    </div>

</div>

<!-- 卡片：獨立於機臺，顯示在螢幕中央 -->
<div id="card-output" class="card">

    <div class="card-inner">

        <!-- 卡片正面 -->
        <div class="card-front">
            <div class="totem-frame"></div>

            <span class="corner tl">✦</span>
            <span class="corner tr">✧</span>
            <span class="corner bl">✧</span>
            <span class="corner br">✦</span>

            <div class="totem-symbol">✧</div>
        </div>

        <!-- 卡片背面 -->
        <div class="card-back">
            <div class="back-decoration"></div>

            <div class="back-star">✦ ✧ ✦</div>

            <div id="card-rarity" class="card-back-rarity">
                SSR CHARACTER
            </div>

            <div id="card-name" class="card-back-name">
                祭司
            </div>

        </div>

    </div>
</div>

<script>

/* =========================
   職業卡池
========================= */

const cardPool = {

    SSR: [
        "祭司", "傀儡師", "怪盜", "死神",
        "國王", "魔法師", "反派", "將軍",
        "間諜", "刺客", "特務", "傭兵",
        "超能力者", "精靈"
    ],

    SR: [
        "法醫", "保鏢", "機長", "賽車手",
        "調香師", "軍醫", "航海士", "藥劑師",
        "馴獸師", "修女", "騎士", "駭客",
        "拳擊手", "律師", "偵探", "獸醫",
        "芭蕾舞者", "獵人", "向導"
    ],

    R: [
        "廚師", "理髮師", "木匠", "保全",
        "記者", "清潔工", "園藝師", "咖啡師",
        "水電工", "保姆", "老師", "泳將",
        "烘焙師", "快遞員", "裁縫師", "調酒師",
        "外送員"
    ]

};

let isDrawing = false;
let audioContext = null;
let hideTimer = null;


/* =========================
   音效系統
========================= */

function playBeep(freq, type, duration) {

    try {

        if (!audioContext) {
            audioContext = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(
            0.09,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + duration
        );

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();
        osc.stop(audioContext.currentTime + duration);

    } catch (error) {

        console.log("音效無法播放：", error);

    }

}


/* 抽卡啟動音效 */

function playStartSound() {

    playBeep(587.33, "sine", 0.15);

    setTimeout(() => {
        playBeep(880, "sine", 0.2);
    }, 100);

}


/* 稀有度音效 */

function playRaritySound(rarity) {

    if (rarity === "SSR") {

        playBeep(1046, "sine", 0.2);

        setTimeout(() => {
            playBeep(1318, "sine", 0.25);
        }, 120);

    } else if (rarity === "SR") {

        playBeep(784, "triangle", 0.25);

    } else {

        playBeep(523, "triangle", 0.2);

    }

}


/* =========================
   抽卡系統
========================= */

/* SSR 5%、SR 20%、R 75% */

function getRarity() {

    const roll = Math.random();

    if (roll < 0.05) return "SSR";

    if (roll < 0.25) return "SR";

    return "R";

}


/* 隨機取得職業 */

function getRandomArtItem(rarity) {

    const list = cardPool[rarity];

    const index = Math.floor(
        Math.random() * list.length
    );

    return list[index];

}


/* 等待指定時間 */

function wait(ms) {

    return new Promise(resolve => setTimeout(resolve, ms));

}


/* =========================
   卡片位置與顯示
========================= */

/* 設定卡片從出卡口開始 */

function positionCardAtDispenser() {

    const dispenser = document.getElementById("dispenser");

    const cardOutput = document.getElementById("card-output");

    const rect = dispenser.getBoundingClientRect();

    cardOutput.style.left =
        (rect.left + rect.width / 2) + "px";

    cardOutput.style.top =
        (rect.top + rect.height / 2) + "px";

}


/* 清除上一張卡片 */

function removePreviousCard() {

    const cardOutput = document.getElementById("card-output");

    if (hideTimer) {

        clearTimeout(hideTimer);

        hideTimer = null;

    }

    cardOutput.classList.remove(
        "ready",
        "flipped",
        "drop",
        "hide",
        "SSR",
        "SR",
        "R"
    );

    cardOutput.style.visibility = "hidden";

    cardOutput.style.opacity = "0";

    cardOutput.style.pointerEvents = "none";

    const inner = cardOutput.querySelector(".card-inner");

    inner.style.transition = "none";

    inner.style.transform = "rotateY(0deg)";

    void cardOutput.offsetWidth;

    inner.style.transition = "";

    inner.style.transform = "";

}


/* =========================
   收起卡片
========================= */

function hideCard() {

    const cardOutput = document.getElementById("card-output");

    const emptyMessage = document.getElementById("empty-message");

    const drawButton = document.getElementById("draw-button");

    if (isDrawing) return;

    if (!cardOutput.classList.contains("ready")) return;

    /* 移除翻牌狀態 */

    cardOutput.classList.remove("ready", "flipped");

    /* 執行消失動畫 */

    cardOutput.classList.add("hide");

    cardOutput.style.pointerEvents = "none";

    /* 恢復出卡口文字 */

    emptyMessage.style.display = "block";

    /* 恢復按鈕 */

    drawButton.disabled = false;

    drawButton.innerText = "就決定是你了";

    /* 動畫結束後完全隱藏 */

    hideTimer = setTimeout(() => {

        cardOutput.classList.remove(
            "drop",
            "hide",
            "SSR",
            "SR",
            "R"
        );

        cardOutput.style.visibility = "hidden";

        cardOutput.style.opacity = "0";

        cardOutput.style.left = "50%";

        cardOutput.style.top = "50%";

        hideTimer = null;

    }, 350);

}


/* =========================
   抽卡主程式
========================= */

async function draw() {

    if (isDrawing) return;

    isDrawing = true;

    const cardOutput = document.getElementById("card-output");

    const cardRarity = document.getElementById("card-rarity");

    const cardName = document.getElementById("card-name");

    const emptyMessage = document.getElementById("empty-message");

    const drawingMessage = document.getElementById("drawing-message");

    const drawButton = document.getElementById("draw-button");


    /* 1. 清除上一張卡片 */

    removePreviousCard();


    /* 2. 隱藏出卡口文字 */

    emptyMessage.style.display = "none";


    /* 3. 鎖定按鈕 */

    drawButton.disabled = true;


    /* 4. 顯示抽選文字 */

    drawingMessage.classList.add("show");


    /* 5. 播放啟動音效 */

    playStartSound();


    /* 6. 等待抽選 */

    await wait(1200);


    /* 7. 抽選文字消失 */

    drawingMessage.classList.remove("show");


    /* 8. 決定稀有度 */

    const rarity = getRarity();


    /* 9. 隨機抽出職業 */

    const name = getRandomArtItem(rarity);


    console.log("抽中稀有度：", rarity);

    console.log("抽中職業：", name);


    /* 10. 設定卡片內容 */

    cardRarity.innerText = `${rarity} CHARACTER`;

    cardName.innerText = name;


    /* 11. 設定稀有度顏色 */

    cardOutput.className = `card ${rarity}`;


    /* 12. 設定卡片初始位置 */

    positionCardAtDispenser();


    /* 13. 顯示卡片 */

    cardOutput.style.visibility = "visible";

    cardOutput.style.opacity = "1";


    /* 確保瀏覽器先套用初始位置 */

    void cardOutput.offsetWidth;


    /* 14. 卡片從出卡口掉落至畫面中央 */

    requestAnimationFrame(() => {

        cardOutput.classList.add("drop");

    });


    /* 15. 播放稀有度音效 */

    playRaritySound(rarity);


    /* 16. 等待掉落動畫完成 */

    await wait(850);


    /* 17. 正面停留 */

    await wait(550);


    /* 18. 自動翻轉卡片 */

    cardOutput.classList.add("flipped");


    /* 19. 等待翻轉動畫完成 */

    await wait(950);


    /* 20. 開放點擊收卡 */

    cardOutput.classList.add("ready");

    cardOutput.style.pointerEvents = "auto";


    /* 21. 恢復抽卡按鈕 */

    drawButton.disabled = false;

    drawButton.innerText = "就決定是你了";


    isDrawing = false;

}


/* =========================
   按鈕事件
========================= */

document.getElementById("draw-button").addEventListener(
    "click",
    function() {

        if (isDrawing) return;

        const cardOutput = document.getElementById("card-output");

        /* 卡片已翻開，點按鈕即可收卡 */

        if (cardOutput.classList.contains("ready")) {

            hideCard();

            return;

        }

        draw();

    }
);


/* =========================
   全畫面點擊收卡
========================= */

document.addEventListener("click", function() {

    const cardOutput = document.getElementById("card-output");

    if (!cardOutput.classList.contains("ready")) return;

    if (isDrawing) return;

    hideCard();

});


/* =========================
   手機觸控收卡
========================= */

document.addEventListener("touchstart", function() {

    const cardOutput = document.getElementById("card-output");

    if (!cardOutput.classList.contains("ready")) return;

    if (isDrawing) return;

    hideCard();

}, { passive: true });


/* =========================
   視窗尺寸改變
========================= */

window.addEventListener("resize", function() {

    const cardOutput = document.getElementById("card-output");

    if (
        cardOutput.classList.contains("drop") &&
        !cardOutput.classList.contains("hide")
    ) {

        /* 已經掉落的卡片維持在螢幕中央 */

        cardOutput.style.left = "50%";

        cardOutput.style.top = "50%";

    }

});

</script>
