<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickMe｜穿什麼抽卡</title>
<link rel="stylesheet" href="../tool-transition.css">
<script src="../tool-transition.js"></script>

<link rel="stylesheet" href="outfit-card.css">
</head>

<body>

<div class="machine">

    <!-- 機臺頂部 -->
    <div class="machine-top">

        <div class="lights">
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
        </div>

        <!-- T恤、裙子、鞋子插畫 -->
        <div class="art-illustrations">
            <svg viewBox="0 0 240 145" aria-label="T恤、裙子與鞋子">

                <path d="M18 34 L22 24 L26 34 L36 38 L26 42 L22 52 L18 42 L8 38Z"
                      fill="#F5C85E"/>
                <path d="M211 28 L215 19 L219 28 L228 32 L219 36 L215 45 L211 36 L202 32Z"
                      fill="#F5C85E"/>
                <circle cx="120" cy="13" r="3" fill="#F5A6B8"/>
                <circle cx="43" cy="105" r="3" fill="#F5A6B8"/>
                <circle cx="194" cy="105" r="3" fill="#F5A6B8"/>

                <!-- T恤 -->
                <g transform="translate(20 25)">
                    <path d="M28 13 L45 4 Q54 17 65 4 L82 13
                             L98 34 L83 45 L74 34
                             L74 88 L36 88 L36 34
                             L27 45 L12 34Z"
                          fill="#F47FA6"
                          stroke="#CF527E"
                          stroke-width="3"
                          stroke-linejoin="round"/>

                    <path d="M45 4 Q54 22 65 4"
                          fill="none"
                          stroke="#FFF0F4"
                          stroke-width="4"
                          stroke-linecap="round"/>

                    <path d="M36 88 L74 88"
                          stroke="#CF527E"
                          stroke-width="3"
                          stroke-linecap="round"/>

                    <path d="M47 49 L54 40 L61 49 L54 58Z"
                          fill="#FFF0F4"/>

                    <circle cx="54" cy="49" r="2" fill="#CF527E"/>
                </g>

                <!-- 裙子 -->
                <g transform="translate(100 27)">
                    <path d="M15 10 Q37 17 59 10
                             L70 83 Q37 98 4 83Z"
                          fill="#A9DCCF"
                          stroke="#65B69D"
                          stroke-width="3"
                          stroke-linejoin="round"/>

                    <path d="M15 10 Q37 17 59 10"
                          fill="none"
                          stroke="#65B69D"
                          stroke-width="5"
                          stroke-linecap="round"/>

                    <path d="M10 72 Q37 82 64 72"
                          fill="none"
                          stroke="#E9FFF6"
                          stroke-width="3"/>

                    <path d="M23 32 L37 42 L51 32"
                          fill="none"
                          stroke="#E9FFF6"
                          stroke-width="3"
                          stroke-linecap="round"/>

                    <circle cx="37" cy="25" r="4" fill="#FFF4D9"/>
                </g>

                <!-- 鞋子 -->
                <g transform="translate(178 56)">
                    <path d="M2 40 Q10 34 17 15
                             Q22 12 27 22
                             L37 36 Q43 40 43 47
                             Q40 53 5 51
                             Q-3 49 2 40Z"
                          fill="#E7B7D1"
                          stroke="#B875A0"
                          stroke-width="3"
                          stroke-linejoin="round"/>

                    <path d="M3 44 Q22 50 42 44"
                          fill="none"
                          stroke="#FFF5FA"
                          stroke-width="3"/>

                    <path d="M16 28 L25 35"
                          stroke="#FFF5FA"
                          stroke-width="3"
                          stroke-linecap="round"/>

                    <path d="M25 58 Q33 51 40 34
                             Q45 31 50 41
                             L61 54 Q68 58 68 65
                             Q65 71 30 69
                             Q22 67 25 58Z"
                          fill="#F5C85E"
                          stroke="#D7A43E"
                          stroke-width="3"
                          stroke-linejoin="round"/>

                    <path d="M26 62 Q48 68 67 62"
                          fill="none"
                          stroke="#FFF8DF"
                          stroke-width="3"/>

                    <path d="M40 47 L50 54"
                          stroke="#FFF8DF"
                          stroke-width="3"
                          stroke-linecap="round"/>
                </g>

                <text x="15" y="125" font-size="17" fill="#CF527E">✦</text>
                <text x="215" y="125" font-size="17" fill="#CF527E">✧</text>

            </svg>
        </div>
    </div>

    <!-- 展示櫥窗 -->
    <div class="showcase">

        <div class="showcase-header">
            <span>FASHION COLLECTION</span>
            <span class="status-light">機臺運作中</span>
        </div>

        <div class="rates">
            <div class="rate-item ssr">
                <strong>SSR</strong>
                5%
            </div>

            <div class="rate-item sr">
                <strong>SR</strong>
                20%
            </div>

            <div class="rate-item r">
                <strong>R</strong>
                75%
            </div>
        </div>

        <!-- 出卡口 -->
        <div class="dispenser" id="dispenser">

            <div class="empty-message" id="empty-message">
                等待卡片掉落
            </div>

            <div class="drawing-message" id="drawing-message">
                正在抽選……
            </div>

        </div>
    </div>

    <!-- 控制面板 -->
    <div class="control-panel">
        <button id="draw-button" class="draw-button">
            就決定是你了
        </button>
    </div>

    <div class="machine-bottom">
        <span>✧</span>
        <span>LET'S CHOOSE YOUR STYLE</span>
        <span>✧</span>
    </div>

</div>

<!-- 全螢幕卡片 -->
<div id="card-output" class="card">

    <div class="card-inner">

        <!-- 卡片正面 -->
        <div class="card-front">

            <div class="totem-frame"></div>

            <span class="corner tl">✦</span>
            <span class="corner tr">✧</span>
            <span class="corner bl">✧</span>
            <span class="corner br">✦</span>

            <div class="totem-symbol">✧</div>

        </div>

        <!-- 卡片背面 -->
        <div class="card-back">
            <img id="card-image" src="" alt="穿搭風格圖片">
        </div>

    </div>
</div>

<script src="outfit-card.js"></script>

</body>
</html>
