
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickMe｜抽卡機教學</title>
<link rel="stylesheet" href="../tool-transition.css">
<script src="../tool-transition.js"></script>

<style>
:root {
    --pink: #f47fa6;
    --deep-pink: #cf527e;
    --light-pink: #ffe5ed;
    --cream: #fff8f2;
    --dark: #573b4b;
    --mint: #b9e6d8;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 12px;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background:
        radial-gradient(circle at 15% 20%, #ffffff 0 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, #ffffff 0 2px, transparent 3px),
        linear-gradient(135deg, #fff0f4, #fce0e9 55%, #fff4e9);
    background-size: 55px 55px, 75px 75px, auto;
    color: var(--dark);
}

/* 機臺主體 */

.machine {
    position: relative;
    width: min(100%, 490px);
    padding: 15px;
    border: 5px solid #fff;
    border-radius: 34px;
    background: linear-gradient(145deg, #ffb4cb, #f47fa6 55%, #e96c98);
    box-shadow:
        0 12px 0 #cf6489,
        0 22px 35px rgba(164, 83, 116, .25),
        inset 0 3px 8px rgba(255,255,255,.8);
}

.machine-top {
    position: relative;
    padding: 17px 10px 15px;
    margin-bottom: 15px;
    text-align: center;
    border: 3px solid #fff;
    border-radius: 22px;
    background: linear-gradient(180deg, #fff9fb, #ffe9f0);
    box-shadow: inset 0 -4px 0 #f3c4d3;
}

.lights {
    display: flex;
    justify-content: space-around;
    margin: 0 5px 12px;
}

.light {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff5bd;
    box-shadow: 0 0 8px #fff5bd, 0 0 14px #fff;
    animation: blink 1.5s infinite alternate;
}

.light:nth-child(2n) { animation-delay: .5s; }

.light:nth-child(3n) {
    background: #d9fff0;
    box-shadow: 0 0 8px #d9fff0, 0 0 14px #fff;
    animation-delay: .9s;
}

@keyframes blink {
    from { opacity: .55; transform: scale(.85); }
    to { opacity: 1; transform: scale(1.15); }
}

/* 男孩與女孩插畫 */

.art-illustrations {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    margin: 5px auto 8px;
}

.art-illustrations svg {
    width: 82px;
    height: 82px;
    overflow: visible;
    filter: drop-shadow(0 4px 4px rgba(180,100,130,.18));
}

.art-illustrations svg:nth-child(2) {
    width: 90px;
    height: 90px;
}

/* 展示窗 */

.showcase {
    position: relative;
    padding: 17px;
    border: 5px solid #d98aa7;
    border-radius: 22px;
    background: linear-gradient(145deg, #fffdfb, #ffeef3);
    box-shadow:
        inset 0 0 0 3px #fff,
        inset 0 0 18px rgba(201,116,149,.18),
        0 5px 0 #c96d91;
}

.showcase-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
}

.showcase-header span {
    color: #b75b7d;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

.status-light {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #75ad9c;
    font-size: 11px;
    font-weight: bold;
}

.status-light::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #8ed9b8;
    box-shadow: 0 0 7px #8ed9b8;
}

/* 稀有度機率 */

.rates {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 7px;
    margin-bottom: 15px;
}

.rate-item {
    padding: 9px 3px;
    border-radius: 10px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    background: #fff;
    border: 1px solid #f1d3df;
    color: #8b7180;
}

.rate-item strong {
    display: block;
    margin-bottom: 3px;
    font-size: 17px;
}

.rate-item.ssr strong { color: #d69a28; }
.rate-item.sr strong { color: #a477d5; }
.rate-item.r strong { color: #8296a5; }

/* 出卡口 */

.dispenser {
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border: 5px solid #e8bdcd;
    border-radius: 16px;
    background: linear-gradient(180deg, #59434f, #392c36);
    box-shadow:
        inset 0 8px 15px rgba(0,0,0,.5),
        0 2px 0 #fff;
}

.dispenser::before,
.dispenser::after {
    content: "✦";
    position: absolute;
    color: rgba(255,255,255,.2);
    font-size: 30px;
    pointer-events: none;
}

.dispenser::before { top: 12px; left: 15px; }
.dispenser::after { bottom: 12px; right: 15px; }

.empty-message {
    color: #d9b9c8;
    font-size: 14px;
    letter-spacing: 2px;
}

/* 抽選文字 */

.drawing-message {
    position: absolute;
    z-index: 3;
    color: #fff0f6;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow:
        0 0 5px #ffb4d0,
        0 0 12px #f47fa6,
        0 0 20px #f47fa6;
    display: none;
    pointer-events: none;
}

.drawing-message.show {
    display: block;
    animation: drawingBlink .55s infinite alternate;
}

@keyframes drawingBlink {
    from { opacity: .3; transform: scale(.96); }
    to { opacity: 1; transform: scale(1.04); }
}

/* 卡片本體 */

.card {
    position: fixed;
    z-index: 1000;
    left: 50%;
    top: 50%;
    width: min(88vw, 380px);
    aspect-ratio: 1.55 / 1;
    perspective: 1200px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(.55);
    transition:
        left .8s cubic-bezier(.2,.8,.2,1),
        top .8s cubic-bezier(.2,.8,.2,1),
        transform .8s cubic-bezier(.2,.8,.2,1),
        opacity .3s ease;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.card.drop {
    left: 50%;
    top: 50%;
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -50%) scale(1);
}

.card.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(.4);
}

.card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .9s cubic-bezier(.2,.75,.25,1);
}

.card.flipped .card-inner {
    transform: rotateY(180deg);
}

.card-front,
.card-back {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 19px;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

/* 卡片正面 */

.card-front {
    display: flex;
    align-items: center;
    justify-content: center;
    border: 5px solid #fff5df;
    background:
        radial-gradient(circle at center, #fff2d0 0 3%, transparent 3.5%),
        repeating-radial-gradient(
            circle at center,
            transparent 0 17px,
            rgba(255,255,255,.65) 18px 20px,
            transparent 21px 34px
        ),
        linear-gradient(145deg, #f7b4ca, #d96f9c 50%, #a94e7d);
    box-shadow:
        inset 0 0 0 7px rgba(255,255,255,.3),
        inset 0 0 30px rgba(90,30,70,.2),
        0 15px 35px rgba(0,0,0,.3);
}

.card.SSR .card-front {
    background:
        radial-gradient(circle at center, #fff3c4 0 3%, transparent 3.5%),
        repeating-radial-gradient(circle at center, transparent 0 17px, rgba(255,255,255,.55) 18px 20px, transparent 21px 34px),
        linear-gradient(145deg, #f5d77c, #d69a28 50%, #a8751e);
}

.card.SR .card-front {
    background:
        radial-gradient(circle at center, #f0e2ff 0 3%, transparent 3.5%),
        repeating-radial-gradient(circle at center, transparent 0 17px, rgba(255,255,255,.55) 18px 20px, transparent 21px 34px),
        linear-gradient(145deg, #d9c0f5, #a477d5 50%, #7853a9);
}

.card.R .card-front {
    background:
        radial-gradient(circle at center, #edf3f5 0 3%, transparent 3.5%),
        repeating-radial-gradient(circle at center, transparent 0 17px, rgba(255,255,255,.55) 18px 20px, transparent 21px 34px),
        linear-gradient(145deg, #cbd8df, #8296a5 50%, #5e7180);
}

.totem-frame {
    position: absolute;
    inset: 13px;
    border: 2px solid rgba(255,245,220,.9);
    border-radius: 12px;
    box-shadow:
        0 0 0 5px rgba(255,255,255,.12),
        inset 0 0 20px rgba(255,255,255,.15);
}

.totem-symbol {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 105px;
    height: 105px;
    border: 3px solid #fff0d0;
    border-radius: 50%;
    color: #fff2d6;
    font-size: 65px;
    text-shadow: 0 0 10px rgba(255,255,255,.8), 0 0 25px rgba(255,225,170,.8);
    box-shadow:
        0 0 0 8px rgba(255,255,255,.12),
        0 0 0 12px rgba(255,238,205,.45),
        0 0 35px rgba(255,230,190,.6);
}

.totem-symbol::before,
.totem-symbol::after {
    content: "✦";
    position: absolute;
    color: #fff1d1;
    font-size: 23px;
}

.totem-symbol::before { top: -31px; }
.totem-symbol::after { bottom: -31px; }

.corner {
    position: absolute;
    color: #fff1d1;
    font-size: 24px;
}

.corner.tl { top: 19px; left: 20px; }
.corner.tr { top: 19px; right: 20px; }
.corner.bl { bottom: 19px; left: 20px; }
.corner.br { bottom: 19px; right: 20px; }

/* 卡片背面 */

.card-back {
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
    background: linear-gradient(145deg, #fffdfb, #fff0f5);
    border: 5px solid #fff5df;
    box-shadow: 0 15px 35px rgba(0,0,0,.3);
}

.back-decoration {
    position: absolute;
    inset: 12px;
    border: 2px solid #edcfda;
    border-radius: 12px;
    pointer-events: none;
}

.back-star {
    color: #dba9bb;
    font-size: 18px;
    letter-spacing: 12px;
    margin-bottom: 10px;
}

.card-back-rarity {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 12px;
    color: #b87991;
}

.card-back-name {
    position: relative;
    z-index: 2;
    width: 100%;
    font-size: clamp(19px, 5vw, 27px);
    font-weight: bold;
    line-height: 1.4;
    text-align: center;
    color: #775365;
    overflow-wrap: anywhere;
}

.card-back-hint {
    margin-top: 15px;
    font-size: 10px;
    letter-spacing: 3px;
    color: #c39aa9;
}

/* SSR */

.card.SSR .card-front,
.card.SSR .card-back {
    border-color: #d69a28;
    box-shadow: 0 0 15px rgba(214,154,40,.8), 0 0 35px rgba(255,190,64,.55), 0 15px 35px rgba(0,0,0,.3);
}

.card.SSR .card-back { background: linear-gradient(145deg, #fff9e7, #fff0c7); }
.card.SSR .card-back-rarity { color: #c18b27; }
.card.SSR .card-back-name { color: #94631e; }

/* SR */

.card.SR .card-front,
.card.SR .card-back {
    border-color: #a477d5;
    box-shadow: 0 0 18px rgba(164,119,213,.8), 0 0 35px rgba(164,119,213,.45), 0 15px 35px rgba(0,0,0,.3);
}

.card.SR .card-back { background: linear-gradient(145deg, #fcf8ff, #eee1ff); }
.card.SR .card-back-rarity { color: #9570be; }
.card.SR .card-back-name { color: #76549c; }

/* R */

.card.R .card-front,
.card.R .card-back {
    border-color: #8296a5;
    box-shadow: 0 0 15px rgba(130,150,165,.7), 0 0 30px rgba(130,150,165,.35), 0 15px 35px rgba(0,0,0,.3);
}

.card.R .card-back { background: linear-gradient(145deg, #ffffff, #edf3f6); }
.card.R .card-back-rarity { color: #8296a5; }
.card.R .card-back-name { color: #5e7180; }

.card.ready { pointer-events: auto; }

/* 控制面板 */

.control-panel {
    margin-top: 18px;
    padding: 15px;
    border: 3px solid #fff;
    border-radius: 20px;
    background: linear-gradient(145deg, #ffeaf1, #f8c8d9);
    box-shadow: inset 0 -4px 0 rgba(190,92,130,.15);
}

.draw-button {
    width: 100%;
    padding: 16px 12px;
    border: 3px solid #fff;
    border-radius: 15px;
    background: linear-gradient(180deg, #a8e8d5, #6cc9ae);
    color: #315f54;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 6px 0 #4da88f, 0 8px 12px rgba(100,155,135,.2);
    transition: .15s;
}

.draw-button:hover {
    filter: brightness(1.06);
    transform: translateY(-2px);
}

.draw-button:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #4da88f;
}

.draw-button:disabled {
    filter: grayscale(.5);
    cursor: not-allowed;
    transform: none;
}

.machine-bottom {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    padding-top: 17px;
    color: #fff;
    font-size: 11px;
    letter-spacing: 3px;
    text-shadow: 0 1px 3px rgba(130,40,75,.3);
}

/* 新手教學系統 */

.tutorial-card {
    position: fixed;
    z-index: 3000;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: min(92%, 450px);
    padding: 22px 22px;
    background: linear-gradient(145deg, #fff, #fff0f5);
    border: 3px solid #f3b5c8;
    border-radius: 23px;
    box-shadow: 0 8px 25px rgba(166,91,119,.25);
    text-align: center;
    color: #896174;
}

.tutorial-card.hidden { display: none; }

.tutorial-step {
    color: #d77b9c;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 9px;
}

.tutorial-title {
    color: #bd6688;
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 10px;
}

.tutorial-description {
    color: #896174;
    font-size: 14px;
    line-height: 1.8;
    white-space: pre-line;
}

.tutorial-progress {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    margin: 17px 0;
}

.progress-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #efd2dc;
}

.progress-dot.active {
    background: #df7e9f;
    transform: scale(1.3);
}

/* 教學按鈕排列 */

.tutorial-actions {
    display: flex;
    gap: 9px;
    margin-top: 15px;
    width: 100%;
}

/* 開始教學按鈕 */

.tutorial-button {
    flex: 1;
    min-width: 0;
    border: none;
    border-radius: 30px;
    padding: 12px 10px;
    color: white;
    background: linear-gradient(135deg, #f58eae, #e56d94);
    font-size: 14px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 3px 7px rgba(217,78,121,.2);
    transition: .2s;
}

.tutorial-button:hover {
    filter: brightness(1.05);
}

.tutorial-button:active {
    transform: scale(.97);
}

.tutorial-button:disabled {
    opacity: .55;
    cursor: default;
}

/* 跳過教學按鈕 */

.tutorial-skip-button {
    flex: 1;
    min-width: 0;
    border: none;
    border-radius: 30px;
    padding: 12px 10px;
    color: white;
    background: linear-gradient(135deg, #91d6a1, #5caf73);
    font-size: 14px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 3px 7px rgba(76,160,100,.25);
    transition: .2s;
}

.tutorial-skip-button:hover {
    filter: brightness(1.05);
}

.tutorial-skip-button:active {
    transform: scale(.97);
}

.tutorial-hint {
    margin-top: 12px;
    color: #c18b9e;
    font-size: 12px;
}

/* 教學高亮 */

.machine.tutorial-highlight {
    filter: drop-shadow(0 0 12px #ed83a8);
}

.draw-button.tutorial-highlight {
    position: relative;
    z-index: 2001;
    outline: 4px solid #f3a3bd;
    outline-offset: 7px;
    animation: tutorialPulse 1.2s infinite;
}

.card.tutorial-highlight {
    filter: drop-shadow(0 0 14px #ffb5d0);
    animation: cardTutorialPulse 1.2s infinite alternate;
}

@keyframes tutorialPulse {
    0%,100% { outline-color: rgba(243,163,189,.45); }
    50% { outline-color: rgba(243,163,189,1); }
}

@keyframes cardTutorialPulse {
    from { filter: drop-shadow(0 0 7px #ed83a8); }
    to { filter: drop-shadow(0 0 20px #ff8db6); }
}

/* 手機版 */

@media (max-width: 420px) {
    .machine {
        padding: 11px;
        border-radius: 27px;
    }

    .showcase { padding: 12px; }
    .dispenser { height: 175px; }
    .control-panel { padding: 12px; }
    .art-illustrations { gap: 15px; }

    .art-illustrations svg {
        width: 72px;
        height: 72px;
    }

    .art-illustrations svg:nth-child(2) {
        width: 78px;
        height: 78px;
    }

    .card {
        width: 88vw;
        max-width: 360px;
    }

    .totem-symbol {
        width: 85px;
        height: 85px;
        font-size: 53px;
    }

    .tutorial-card {
        top: 12px;
        padding: 18px 16px;
    }
}

@media (max-width: 350px) {
    .card { width: 90vw; }
    .card-back { padding: 18px; }

    .totem-symbol {
        width: 75px;
        height: 75px;
        font-size: 45px;
    }

    .art-illustrations {
        gap: 10px;
    }

    .art-illustrations svg,
    .art-illustrations svg:nth-child(2) {
        width: 68px;
        height: 68px;
    }
}
</style>
</head>

<body>

<div class="machine" id="machine">

    <div class="machine-top">

        <div class="lights">
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
        </div>

        <!-- 男孩與女孩插畫 -->

        <div class="art-illustrations">

            <!-- 男孩 -->
            <svg viewBox="0 0 120 120" aria-label="可愛男孩">

                <!-- 身體 -->
                <path d="M25 112 Q27 78 60 77 Q93 78 95 112Z"
                      fill="#9CCFC5"
                      stroke="#6BAE9F"
                      stroke-width="3"/>

                <!-- 脖子 -->
                <path d="M49 73 L49 88 Q60 98 71 88 L71 73Z"
                      fill="#FFD7BD"/>

                <!-- 耳朵 -->
                <ellipse cx="30" cy="55" rx="9" ry="12"
                         fill="#FFD7BD"/>
                <ellipse cx="90" cy="55" rx="9" ry="12"
                         fill="#FFD7BD"/>

                <!-- 頭部 -->
                <ellipse cx="60" cy="54" rx="34" ry="39"
                         fill="#FFE0C9"
                         stroke="#D99A83"
                         stroke-width="2.5"/>

                <!-- 頭髮 -->
                <path d="M27 49
                         Q20 14 54 15
                         Q83 5 94 34
                         Q99 46 91 55
                         Q86 43 78 38
                         Q67 45 52 39
                         Q39 36 30 49Z"
                      fill="#59434B"
                      stroke="#49343D"
                      stroke-width="2.5"/>

                <!-- 瀏海 -->
                <path d="M29 43
                         Q39 22 51 29
                         Q62 16 72 29
                         Q83 22 92 42
                         Q79 38 72 43
                         Q61 35 51 43
                         Q39 36 29 49Z"
                      fill="#59434B"/>

                <!-- 眼睛 -->
                <ellipse cx="46" cy="56" rx="3.2" ry="4.5"
                         fill="#49343D"/>
                <ellipse cx="74" cy="56" rx="3.2" ry="4.5"
                         fill="#49343D"/>

                <!-- 眼睛高光 -->
                <circle cx="47" cy="54" r="1.2" fill="#fff"/>
                <circle cx="75" cy="54" r="1.2" fill="#fff"/>

                <!-- 腮紅 -->
                <ellipse cx="38" cy="68" rx="6" ry="3"
                         fill="#F4A0A9" opacity=".65"/>
                <ellipse cx="82" cy="68" rx="6" ry="3"
                         fill="#F4A0A9" opacity=".65"/>

                <!-- 嘴巴 -->
                <path d="M55 72 Q60 77 65 72"
                      fill="none"
                      stroke="#C7797C"
                      stroke-width="2"
                      stroke-linecap="round"/>

                <!-- 衣領 -->
                <path d="M48 85 L60 96 L72 85"
                      fill="#FFF5E9"
                      stroke="#6BAE9F"
                      stroke-width="2"/>

                <!-- 衣服裝飾 -->
                <circle cx="60" cy="104" r="3"
                        fill="#FFF5E9"/>

            </svg>

            <!-- 女孩 -->
            <svg viewBox="0 0 120 120" aria-label="可愛女孩">

                <!-- 長頭髮後側 -->
                <path d="M26 46
                         Q19 15 53 13
                         Q89 8 96 43

    <!-- 展示櫥窗 -->

    <div class="showcase">

<!-- 卡片 -->

<div id="card-output" class="card">

    <div class="card-inner">

        <div class="card-front">

            <span class="corner tl">✦</span>

<!-- 新手教學視窗 -->

<div class="tutorial-card" id="tutorial-card">

    <div class="tutorial-step" id="tutorial-step">
        新手教學
    </div>

    <div class="tutorial-title" id="tutorial-title">
        歡迎來到 PickMe抽卡機！
    </div>

    <div class="tutorial-description" id="tutorial-description">
        想體驗抽卡樂趣嗎？
        透過抽卡機隨機獲得吧！
    </div>

    <div class="tutorial-hint" id="tutorial-hint"></div>

    <div class="tutorial-progress">
        <span class="progress-dot"></span>
        <span class="progress-dot"></span>
        <span class="progress-dot"></span>
        <span class="progress-dot"></span>
    </div>

    <div class="tutorial-actions">
        <button class="tutorial-button" id="tutorial-button">
            開始教學
        </button>

        <button class="tutorial-skip-button" id="tutorial-skip">
            跳過教學
        </button>
    </div>

</div>

<script>

/* DOM 元素 */

const machine = document.getElementById("machine");
const cardOutput = document.getElementById("card-output");
const cardRarity = document.getElementById("card-rarity");
const cardName = document.getElementById("card-name");
const emptyMessage = document.getElementById("empty-message");
const drawingMessage = document.getElementById("drawing-message");
const drawButton = document.getElementById("draw-button");

/* 新手教學系統 */

const tutorialCard = document.getElementById("tutorial-card");
const tutorialStep = document.getElementById("tutorial-step");
const tutorialTitle = document.getElementById("tutorial-title");
const tutorialDescription = document.getElementById("tutorial-description");
const tutorialButton = document.getElementById("tutorial-button");
const tutorialSkip = document.getElementById("tutorial-skip");
const tutorialHint = document.getElementById("tutorial-hint");
const tutorialDots = document.querySelectorAll(".progress-dot");

let tutorialActive = true;
let tutorialStage = 0;

/* 更新教學畫面 */

function showTutorial(stage) {

    tutorialStage = stage;

    tutorialCard.classList.remove("hidden");

    machine.classList.remove("tutorial-highlight");
    drawButton.classList.remove("tutorial-highlight");
    cardOutput.classList.remove("tutorial-highlight");

    tutorialDots.forEach((dot, index) => {
        dot.classList.toggle("active", index === stage - 1);
    });

    /* 歡迎畫面 */

    if (stage === 0) {

        tutorialSkip.style.display = "block";

        tutorialStep.textContent = "新手教學";
        tutorialTitle.textContent = "歡迎來到 PickMe抽卡機！";

        tutorialDescription.innerText =
            "想體驗抽卡的樂趣嗎？透過抽卡機隨機獲得吧！";

        tutorialButton.textContent = "開始教學";
        tutorialButton.style.display = "block";

    }

    /* STEP 1：認識抽卡機 */

    if (stage === 1) {

        tutorialSkip.style.display = "none";

        tutorialStep.textContent = "STEP 1 / 4";
        tutorialTitle.textContent = "認識抽卡機";

        tutorialDescription.innerText =
            "這是一臺抽卡機！\n每張卡片都有不同的稀有度，分為 SSR、SR 和 R 三種等級。\n可以先看看上方的機率分布。";

        tutorialButton.textContent = "下一步";
        tutorialButton.style.display = "block";

        machine.classList.add("tutorial-highlight");

    }

    /* STEP 2：開始抽卡 */

    if (stage === 2) {

        tutorialSkip.style.display = "none";

        tutorialStep.textContent = "STEP 2 / 4";
        tutorialTitle.textContent = "抽出你的選項";

        tutorialDescription.innerText =
            "準備好了嗎？\n點擊下方的「就決定是你了」，抽出你的第一張卡片！";

        tutorialButton.style.display = "none";

        drawButton.classList.add("tutorial-highlight");

    }

    /* STEP 3：查看結果 */

    if (stage === 3) {

        tutorialSkip.style.display = "none";

        tutorialStep.textContent = "STEP 3 / 4";
        tutorialTitle.textContent = "看看你抽到了什麼！";

        tutorialDescription.innerText =
            "卡片已經翻開囉！\n看看抽到的選項與稀有度，畫面任意處點擊即可收回卡片。";

        tutorialButton.style.display = "none";

        cardOutput.classList.add("tutorial-highlight");

    }

    /* STEP 4：教學完成 */

    if (stage === 4) {

        tutorialSkip.style.display = "none";

        tutorialStep.textContent = "STEP 4 / 4";
        tutorialTitle.textContent = "教學完成！";

        tutorialDescription.innerText =
            "你已經學會如何使用抽卡機了！\n接下來實現抽卡自由吧！";

        tutorialButton.textContent = "開始自由遊玩";
        tutorialButton.style.display = "block";

    }

}

/* 教學按鈕 */

tutorialButton.addEventListener("click", function() {

    if (!tutorialActive) return;

    if (tutorialStage === 0) {

        showTutorial(1);

    } else if (tutorialStage === 1) {

        showTutorial(2);

    } else if (tutorialStage === 4) {

        tutorialActive = false;

        tutorialCard.classList.add("hidden");

        machine.classList.remove("tutorial-highlight");
        drawButton.classList.remove("tutorial-highlight");
        cardOutput.classList.remove("tutorial-highlight");

    }

});

/* 跳過教學 */

tutorialSkip.addEventListener("click", function() {

    tutorialActive = false;

    tutorialCard.classList.add("hidden");

    machine.classList.remove("tutorial-highlight");
    drawButton.classList.remove("tutorial-highlight");
    cardOutput.classList.remove("tutorial-highlight");

});

/* 選項卡池 */

const cardPool = {

    SSR: [
        "選項一",
        "選項二",
        "選項三",
        "選項四",
        "選項五",
        "選項六",
        "選項七",
        "選項八",
        "選項九",
        "選項十",
        "選項十一",
        "選項十二",
        "選項十三",
        "選項十四"
    ],

    SR: [
        "選項十五",
        "選項十六",
        "選項十七",
        "選項十八",
        "選項十九",
        "選項二十",
        "選項二十一",
        "選項二十二",
        "選項二十三",
        "選項二十四",
        "選項二十五",
        "選項二十六",
        "選項二十七",
        "選項二十八",
        "選項二十九",
        "選項三十",
        "選項三十一",
        "選項三十二",
        "選項三十三"
    ],

    R: [
        "選項三十四",
        "選項三十五",
        "選項三十六",
        "選項三十七",
        "選項三十八",
        "選項三十九",
        "選項四十",
        "選項四十一",
        "選項四十二",
        "選項四十三",
        "選項四十四",
        "選項四十五",
        "選項四十六",
        "選項四十七",
        "選項四十八",
        "選項四十九",
        "選項五十"
    ]

};

let isDrawing = false;
let audioContext = null;
let hideTimer = null;

/* 音效系統 */

function playBeep(freq, type, duration) {

    try {

        if (!audioContext) {

            audioContext = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(
            0.09,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + duration
        );

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();
        osc.stop(audioContext.currentTime + duration);

    } catch (error) {

        console.log("音效無法播放：", error);

    }

}

/* 抽卡啟動音效 */

function playStartSound() {

    playBeep(587.33, "sine", 0.15);

    setTimeout(() => {
        playBeep(880, "sine", 0.2);
    }, 100);

}

/* 稀有度音效 */

function playRaritySound(rarity) {

    if (rarity === "SSR") {

        playBeep(1046, "sine", 0.2);

        setTimeout(() => {
            playBeep(1318, "sine", 0.25);
        }, 120);

    } else if (rarity === "SR") {

        playBeep(784, "triangle", 0.25);

    } else {

        playBeep(523, "triangle", 0.2);

    }

}

/* 抽卡系統 */

function getRarity() {

    const roll = Math.random();

    if (roll < 0.05) return "SSR";
    if (roll < 0.25) return "SR";

    return "R";

}

/* 隨機取得選項 */

function getRandomArtItem(rarity) {

    const list = cardPool[rarity];

    const index = Math.floor(
        Math.random() * list.length
    );

    return list[index];

}

/* 等待指定時間 */

function wait(ms) {

    return new Promise(resolve => setTimeout(resolve, ms));

}

/* 卡片位置與顯示 */

function positionCardAtDispenser() {

    const rect = document
        .getElementById("dispenser")
        .getBoundingClientRect();

    cardOutput.style.left =
        (rect.left + rect.width / 2) + "px";

    cardOutput.style.top =
        (rect.top + rect.height / 2) + "px";

}

/* 清除上一張卡片 */

function removePreviousCard() {

    if (hideTimer) {

        clearTimeout(hideTimer);
        hideTimer = null;

    }

    cardOutput.classList.remove(
        "ready",
        "flipped",
        "drop",
        "hide",
        "SSR",
        "SR",
        "R",
        "tutorial-highlight"
    );

    cardOutput.style.visibility = "hidden";
    cardOutput.style.opacity = "0";
    cardOutput.style.pointerEvents = "none";

    const inner = cardOutput.querySelector(".card-inner");

    inner.style.transition = "none";
    inner.style.transform = "rotateY(0deg)";

    void cardOutput.offsetWidth;

    inner.style.transition = "";
    inner.style.transform = "";

}

/* 收起卡片 */

function hideCard() {

    if (isDrawing) return;

    if (!cardOutput.classList.contains("ready")) return;

    cardOutput.classList.remove(
        "ready",
        "flipped",
        "tutorial-highlight"
    );

    cardOutput.classList.add("hide");

    cardOutput.style.pointerEvents = "none";

    emptyMessage.style.display = "block";

    drawButton.disabled = false;
    drawButton.innerText = "就決定是你了";

    /* 教學期間，收卡後進入最後一步 */

    if (tutorialActive && tutorialStage === 3) {

        showTutorial(4);

    }

    hideTimer = setTimeout(() => {

        cardOutput.classList.remove(
            "drop",
            "hide",
            "SSR",
            "SR",
            "R"
        );

        cardOutput.style.visibility = "hidden";
        cardOutput.style.opacity = "0";
        cardOutput.style.left = "50%";
        cardOutput.style.top = "50%";

        hideTimer = null;

    }, 350);

}

/* 抽卡主程式 */

async function draw() {

    if (isDrawing) return;

    /* 教學期間只能在 STEP 2 抽卡 */

    if (tutorialActive && tutorialStage !== 2) return;

    isDrawing = true;

    /* 清除上一張卡片 */

    removePreviousCard();

    /* 隱藏出卡口文字 */

    emptyMessage.style.display = "none";

    /* 鎖定按鈕 */

    drawButton.disabled = true;

    /* 顯示抽選文字 */

    drawingMessage.classList.add("show");

    /* 播放啟動音效 */

    playStartSound();

    /* 等待抽選 */

    await wait(1200);

    /* 抽選文字消失 */

    drawingMessage.classList.remove("show");

    /* 決定稀有度 */

    const rarity = getRarity();

    /* 隨機抽出選項 */

    const name = getRandomArtItem(rarity);

    console.log("抽中稀有度：", rarity);
    console.log("抽中選項：", name);

    /* 設定卡片內容 */

    cardRarity.innerText = `${rarity} CHARACTER`;
    cardName.innerText = name;

    /* 設定稀有度顏色 */

    cardOutput.className = `card ${rarity}`;

    /* 設定卡片初始位置 */

    positionCardAtDispenser();

    /* 顯示卡片 */

    cardOutput.style.visibility = "visible";
    cardOutput.style.opacity = "1";

    void cardOutput.offsetWidth;

    /* 卡片從出卡口掉落至畫面中央 */

    requestAnimationFrame(() => {

        cardOutput.classList.add("drop");

    });

    /* 播放稀有度音效 */

    playRaritySound(rarity);

    /* 等待掉落動畫完成 */

    await wait(850);

    /* 正面停留 */

    await wait(550);

    /* 自動翻轉卡片 */

    cardOutput.classList.add("flipped");

    /* 等待翻轉動畫完成 */

    await wait(950);

    /* 開放點擊收卡 */

    cardOutput.classList.add("ready");
    cardOutput.style.pointerEvents = "auto";

    /* 恢復抽卡按鈕 */

    drawButton.disabled = false;
    drawButton.innerText = "就決定是你了";

    isDrawing = false;

    /* 教學進入結果確認階段 */

    if (tutorialActive && tutorialStage === 2) {

        showTutorial(3);

    }

}

/* 抽卡按鈕事件 */

drawButton.addEventListener("click", function() {

    if (isDrawing) return;

    /* 教學期間只允許 STEP 2 操作 */

    if (tutorialActive && tutorialStage !== 2) return;

    /* 卡片已翻開，點擊按鈕即可收卡 */

    if (cardOutput.classList.contains("ready")) {

        hideCard();
        return;

    }

    draw();

});

/* 卡片點擊收回 */

cardOutput.addEventListener("click", function(event) {

    event.stopPropagation();

    if (!cardOutput.classList.contains("ready")) return;
    if (isDrawing) return;

    hideCard();

});

/* 全畫面點擊收卡 */

document.addEventListener("click", function(event) {

    if (event.target.closest("#draw-button")) return;
    if (event.target.closest("#tutorial-card")) return;

    if (!cardOutput.classList.contains("ready")) return;
    if (isDrawing) return;

    hideCard();

});

/* 手機觸控收卡 */

document.addEventListener("touchstart", function(event) {

    if (event.target.closest("#draw-button")) return;
    if (event.target.closest("#tutorial-card")) return;

    if (!cardOutput.classList.contains("ready")) return;
    if (isDrawing) return;

    hideCard();

}, { passive: true });

/* 視窗尺寸改變 */

window.addEventListener("resize", function() {

    if (
        cardOutput.classList.contains("drop") &&
        !cardOutput.classList.contains("hide")
    ) {

        cardOutput.style.left = "50%";
        cardOutput.style.top = "50%";

    }

});

/* 初始化 */

showTutorial(0);

</script>
