
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickMe｜社牛大挑戰抽卡</title>
<link rel="stylesheet" href="../tool-transition.css">
<script src="../tool-transition.js"></script>

<link rel="stylesheet" href="challenge-card.css">
</head>

<body>

<div class="machine">

    <!-- 機臺頂部 -->
    <div class="machine-top">

        <div class="lights">
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
        </div>

        <!-- 跳舞乳牛 -->
        <div class="art-illustrations cow-dance">

            <svg viewBox="0 0 180 150" aria-label="跳舞的可愛乳牛">

                <path d="M22 35 L26 25 L30 35 L40 39 L30 43 L26 53 L22 43 L12 39Z"
                      fill="#F5C85E"/>
                <path d="M145 25 L149 17 L153 25 L161 29 L153 33 L149 41 L145 33 L137 29Z"
                      fill="#F5C85E"/>

                <path d="M65 77 Q43 70 34 47"
                      fill="none" stroke="#44353B" stroke-width="9"
                      stroke-linecap="round"/>
                <path d="M34 47 L23 37"
                      fill="none" stroke="#44353B" stroke-width="8"
                      stroke-linecap="round"/>

                <path d="M113 77 Q137 63 145 43"
                      fill="none" stroke="#44353B" stroke-width="9"
                      stroke-linecap="round"/>
                <path d="M145 43 L155 34"
                      fill="none" stroke="#44353B" stroke-width="8"
                      stroke-linecap="round"/>

                <path d="M76 108 Q61 121 49 134"
                      fill="none" stroke="#44353B" stroke-width="10"
                      stroke-linecap="round"/>
                <path d="M49 134 L37 132"
                      fill="none" stroke="#44353B" stroke-width="9"
                      stroke-linecap="round"/>

                <path d="M105 108 Q119 119 130 130"
                      fill="none" stroke="#44353B" stroke-width="10"
                      stroke-linecap="round"/>
                <path d="M130 130 L143 124"
                      fill="none" stroke="#44353B" stroke-width="9"
                      stroke-linecap="round"/>

                <ellipse cx="91" cy="91" rx="38" ry="30"
                         fill="#FFFDF9" stroke="#44353B" stroke-width="3"/>

                <path d="M64 77 Q72 65 85 73 Q89 85 77 91 Q64 91 64 77Z"
                      fill="#44353B"/>
                <path d="M103 91 Q119 80 128 96 Q124 111 108 111Z"
                      fill="#44353B"/>

                <ellipse cx="90" cy="49" rx="34" ry="29"
                         fill="#FFFDF9" stroke="#44353B" stroke-width="3"/>

                <ellipse cx="57" cy="43" rx="12" ry="8"
                         transform="rotate(-25 57 43)"
                         fill="#FFFDF9" stroke="#44353B" stroke-width="3"/>
                <ellipse cx="123" cy="43" rx="12" ry="8"
                         transform="rotate(25 123 43)"
                         fill="#FFFDF9" stroke="#44353B" stroke-width="3"/>

                <path d="M72 27 Q65 11 78 15 L84 27Z"
                      fill="#F2D6A9" stroke="#44353B" stroke-width="2"/>
                <path d="M99 27 Q106 11 113 18 L108 30Z"
                      fill="#F2D6A9" stroke="#44353B" stroke-width="2"/>

                <path d="M83 22 Q94 13 103 25 Q99 34 88 32Z"
                      fill="#44353B"/>

                <circle cx="78" cy="47" r="3.5" fill="#44353B"/>
                <circle cx="102" cy="47" r="3.5" fill="#44353B"/>

                <ellipse cx="69" cy="57" rx="7" ry="4"
                         fill="#F5A6B8" opacity=".8"/>
                <ellipse cx="111" cy="57" rx="7" ry="4"
                         fill="#F5A6B8" opacity=".8"/>

                <ellipse cx="90" cy="62" rx="17" ry="11"
                         fill="#F3B6C2" stroke="#44353B" stroke-width="2"/>
                <circle cx="84" cy="61" r="2" fill="#44353B"/>
                <circle cx="96" cy="61" r="2" fill="#44353B"/>
                <path d="M87 68 Q90 72 94 68"
                      fill="none" stroke="#44353B" stroke-width="2"
                      stroke-linecap="round"/>

                <path d="M81 79 Q69 69 68 81 Q69 90 84 84Z"
                      fill="#F47FA6" stroke="#CF527E" stroke-width="2"/>
                <path d="M97 79 Q109 69 110 81 Q109 90 94 84Z"
                      fill="#F47FA6" stroke="#CF527E" stroke-width="2"/>
                <circle cx="90" cy="82" r="5" fill="#CF527E"/>

                <text x="14" y="83" font-size="19" fill="#CF527E">♪</text>
                <text x="151" y="82" font-size="22" fill="#CF527E">♫</text>

            </svg>
        </div>
    </div>

    <!-- 展示櫥窗 -->
    <div class="showcase">

        <div class="showcase-header">
            <span>CHALLENGE COLLECTION</span>
            <span class="status-light">機臺運作中</span>
        </div>

        <div class="rates">
            <div class="rate-item ssr">
                <strong>SSR</strong>
                5%
            </div>

            <div class="rate-item sr">
                <strong>SR</strong>
                20%
            </div>

            <div class="rate-item r">
                <strong>R</strong>
                75%
            </div>
        </div>

        <!-- 出卡口 -->
        <div class="dispenser">

            <div class="empty-message" id="empty-message">
                等待卡片掉落
            </div>

            <div class="drawing-message" id="drawing-message">
                正在抽選……
            </div>

        </div>
    </div>

    <!-- 控制面板 -->
    <div class="control-panel">
        <button
            id="draw-button"
            class="draw-button"
        >
            就決定是你了
        </button>
    </div>

    <div class="machine-bottom">
        <span>✧</span>
        <span>LET'S START THE CHALLENGE</span>
        <span>✧</span>
    </div>

</div>

<!-- 全螢幕卡片 -->
<div id="card-output" class="card">

    <div class="card-inner">

        <!-- 卡片正面：只有星象裝飾，沒有文字 -->
        <div class="card-front">

            <svg class="front-ornament"
                 viewBox="0 0 340 190"
                 preserveAspectRatio="none"
                 aria-hidden="true">

                <defs>
                    <linearGradient id="ornamentLine"
                                    x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="white" stop-opacity=".95"/>
                        <stop offset="50%" stop-color="currentColor" stop-opacity=".9"/>
                        <stop offset="100%" stop-color="white" stop-opacity=".75"/>
                    </linearGradient>
                </defs>

                <!-- 內框 -->
                <rect x="13" y="10" width="314" height="170"
                      rx="12" fill="none"
                      stroke="url(#ornamentLine)" stroke-width="1.5"/>

                <rect x="19" y="16" width="302" height="158"
                      rx="9" fill="none"
                      stroke="currentColor" stroke-width=".7"
                      opacity=".7"/>

                <!-- 中央軌道 -->
                <circle cx="170" cy="95" r="49"
                        fill="none" stroke="currentColor"
                        stroke-width="1.5" opacity=".9"/>

                <circle cx="170" cy="95" r="43"
                        fill="none" stroke="currentColor"
                        stroke-width=".8" stroke-dasharray="2 4"
                        opacity=".8"/>

                <!-- 行星軌道 -->
                <ellipse cx="170" cy="95" rx="91" ry="28"
                         transform="rotate(-23 170 95)"
                         fill="none" stroke="currentColor"
                         stroke-width="1.5"/>

                <ellipse cx="170" cy="95" rx="78" ry="22"
                         transform="rotate(23 170 95)"
                         fill="none" stroke="currentColor"
                         stroke-width=".7" opacity=".6"/>

                <!-- 中央指南星 -->
                <path d="M170 45 L180 85 L220 95 L180 105
                         L170 145 L160 105 L120 95 L160 85Z"
                      fill="currentColor" opacity=".18"
                      stroke="currentColor" stroke-width="1.6"/>

                <path d="M170 58 L175 90 L207 95 L175 100
                         L170 132 L165 100 L133 95 L165 90Z"
                      fill="none" stroke="currentColor"
                      stroke-width="1.2"/>

                <path d="M170 45 L170 145 M120 95 L220 95"
                      stroke="currentColor" stroke-width=".8"
                      opacity=".7"/>

                <!-- 上下菱形 -->
                <path d="M170 7 L178 16 L170 25 L162 16Z"
                      fill="none" stroke="currentColor"
                      stroke-width="1.5"/>

                <path d="M170 165 L178 174 L170 183 L162 174Z"
                      fill="none" stroke="currentColor"
                      stroke-width="1.5"/>

                <!-- 四角裝飾 -->
                <path d="M22 37 Q35 20 54 19
                         M22 37 Q39 34 45 50
                         M318 37 Q305 20 286 19
                         M318 37 Q301 34 295 50
                         M22 153 Q35 170 54 171
                         M22 153 Q39 156 45 140
                         M318 153 Q305 170 286 171
                         M318 153 Q301 156 295 140"
                      fill="none" stroke="currentColor"
                      stroke-width="1.4" stroke-linecap="round"/>

                <!-- 星星 -->
                <g fill="currentColor">
                    <path d="M65 48 L69 60 L81 64 L69 68 L65 80 L61 68 L49 64 L61 60Z"/>
                    <path d="M275 48 L279 60 L291 64 L279 68 L275 80 L271 68 L259 64Z"/>
                    <path d="M65 110 L68 119 L77 122 L68 125 L65 134 L62 125 L53 122 L62 119Z"/>
                    <path d="M275 110 L278 119 L287 122 L278 125 L275 134 L272 125 L263 122 L272 119Z"/>
                    <circle cx="94" cy="31" r="2"/>
                    <circle cx="246" cy="31" r="2"/>
                    <circle cx="94" cy="159" r="2"/>
                    <circle cx="246" cy="159" r="2"/>
                    <circle cx="170" cy="31" r="2"/>
                    <circle cx="170" cy="159" r="2"/>
                </g>

                <!-- 小型月亮 -->
                <path d="M112 29 A8 8 0 1 0 123 39
                         A7 7 0 0 1 112 29Z"
                      fill="currentColor" opacity=".9"/>

                <path d="M217 151 A8 8 0 1 0 228 161
                         A7 7 0 0 1 217 151Z"
                      fill="currentColor" opacity=".9"/>

            </svg>

        </div>

        <!-- 卡片背面：挑戰結果 -->
        <div class="card-back">

            <div id="card-rarity" class="card-rarity"></div>

            <div id="card-name" class="card-name"></div>

        </div>

    </div>
</div>

<script src="challenge-card.js"></script>

</body>
</html>
