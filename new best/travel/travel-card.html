<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickMe｜假日去哪逛抽卡</title>
<link rel="stylesheet" href="../tool-transition.css">
<script src="../tool-transition.js"></script>

<style>
:root {
    --pink: #f47fa6;
    --deep-pink: #cf527e;
    --dark: #573b4b;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 12px;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background:
        radial-gradient(circle at 15% 20%, #ffffff 0 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, #ffffff 0 2px, transparent 3px),
        linear-gradient(135deg, #fff0f4, #fce0e9 55%, #fff4e9);
    background-size: 55px 55px, 75px 75px, auto;
    color: var(--dark);
}

/* 機臺主體 */
.machine {
    position: relative;
    width: min(100%, 490px);
    padding: 15px;
    border: 5px solid #fff;
    border-radius: 34px;
    background: linear-gradient(145deg, #ffb4cb, #f47fa6 55%, #e96c98);
    box-shadow:
        0 12px 0 #cf6489,
        0 22px 35px rgba(164, 83, 116, .25),
        inset 0 3px 8px rgba(255,255,255,.8);
}

/* 機臺頂部 */
.machine-top {
    position: relative;
    padding: 17px 10px 15px;
    margin-bottom: 15px;
    text-align: center;
    border: 3px solid #fff;
    border-radius: 22px;
    background: linear-gradient(180deg, #fff9fb, #ffe9f0);
    box-shadow: inset 0 -4px 0 #f3c4d3;
}

/* 燈泡 */
.lights {
    display: flex;
    justify-content: space-around;
    margin: 0 5px 12px;
}

.light {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff5bd;
    box-shadow: 0 0 8px #fff5bd, 0 0 14px #fff;
    animation: blink 1.5s infinite alternate;
}

.light:nth-child(2n) {
    animation-delay: .5s;
}

.light:nth-child(3n) {
    background: #d9fff0;
    box-shadow: 0 0 8px #d9fff0, 0 0 14px #fff;
    animation-delay: .9s;
}

@keyframes blink {
    from {
        opacity: .55;
        transform: scale(.85);
    }
    to {
        opacity: 1;
        transform: scale(1.15);
    }
}

/* 旅行插畫 */
.art-illustrations {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    margin: 5px auto 8px;
}

.art-illustrations svg {
    width: 75px;
    height: 75px;
    overflow: visible;
    filter: drop-shadow(0 4px 3px rgba(180,100,130,.15));
}

.art-illustrations svg:nth-child(2) {
    width: 88px;
    height: 88px;
}

/* 展示窗 */
.showcase {
    position: relative;
    padding: 17px;
    border: 5px solid #d98aa7;
    border-radius: 22px;
    background: linear-gradient(145deg, #fffdfb, #ffeef3);
    box-shadow:
        inset 0 0 0 3px #fff,
        inset 0 0 18px rgba(201,116,149,.18),
        0 5px 0 #c96d91;
}

.showcase-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
}

.showcase-header span {
    color: #b75b7d;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

.status-light {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #75ad9c;
    font-size: 11px;
    font-weight: bold;
}

.status-light::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #8ed9b8;
    box-shadow: 0 0 7px #8ed9b8;
}

/* 稀有度機率 */
.rates {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 7px;
    margin-bottom: 15px;
}

.rate-item {
    padding: 9px 3px;
    border-radius: 10px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    background: #fff;
    border: 1px solid #f1d3df;
    color: #8b7180;
}

.rate-item strong {
    display: block;
    margin-bottom: 3px;
    font-size: 17px;
}

.rate-item.ssr strong {
    color: #d69a28;
}

.rate-item.sr strong {
    color: #a477d5;
}

.rate-item.r strong {
    color: #8296a5;
}

/* 出卡口 */
.dispenser {
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border: 5px solid #e8bdcd;
    border-radius: 16px;
    background: linear-gradient(180deg, #59434f, #392c36);
    box-shadow:
        inset 0 8px 15px rgba(0,0,0,.5),
        0 2px 0 #fff;
}

.dispenser::before,
.dispenser::after {
    content: "✦";
    position: absolute;
    color: rgba(255,255,255,.2);
    font-size: 30px;
    pointer-events: none;
}

.dispenser::before {
    top: 12px;
    left: 15px;
}

.dispenser::after {
    bottom: 12px;
    right: 15px;
}

.empty-message {
    color: #d9b9c8;
    font-size: 14px;
    letter-spacing: 2px;
}

/* 抽選文字 */
.drawing-message {
    position: absolute;
    z-index: 3;
    color: #fff0f6;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow:
        0 0 5px #ffb4d0,
        0 0 12px #f47fa6,
        0 0 20px #f47fa6;
    display: none;
    pointer-events: none;
}

.drawing-message.show {
    display: block;
    animation: drawingBlink .55s infinite alternate;
}

@keyframes drawingBlink {
    from {
        opacity: .3;
        transform: scale(.96);
    }
    to {
        opacity: 1;
        transform: scale(1.04);
    }
}

/* 橫式卡牌 */
.card {
    position: fixed;
    z-index: 1000;
    left: 50%;
    top: 50%;
    width: min(88vw, 380px);
    aspect-ratio: 1.55 / 1;
    perspective: 1200px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(.55);
    transition:
        transform .8s cubic-bezier(.2,.8,.2,1),
        opacity .3s ease;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

/* 卡片掉落 */
.card.drop {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -50%) scale(1);
}

/* 卡片消失 */
.card.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(.4);
}

/* 卡片內部翻轉 */
.card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .9s cubic-bezier(.2,.75,.25,1);
}

.card.flipped .card-inner {
    transform: rotateY(180deg);
}

/* 正反面共同設定 */
.card-front,
.card-back {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 19px;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

/* 卡片正面 */
.card-front {
    display: flex;
    align-items: center;
    justify-content: center;
    border: 5px solid #fff5df;
    background:
        radial-gradient(circle at center, #fff2d0 0 3%, transparent 3.5%),
        repeating-radial-gradient(
            circle at center,
            transparent 0 17px,
            rgba(255,255,255,.65) 18px 20px,
            transparent 21px 34px
        ),
        linear-gradient(145deg, #f7b4ca, #d96f9c 50%, #a94e7d);
    box-shadow:
        inset 0 0 0 7px rgba(255,255,255,.3),
        inset 0 0 30px rgba(90,30,70,.2),
        0 15px 35px rgba(0,0,0,.3);
}

/* SSR 金色正面 */
.card.SSR .card-front {
    background:
        radial-gradient(circle at center, #fff3c4 0 3%, transparent 3.5%),
        repeating-radial-gradient(
            circle at center,
            transparent 0 17px,
            rgba(255,255,255,.55) 18px 20px,
            transparent 21px 34px
        ),
        linear-gradient(145deg, #f5d77c, #d69a28 50%, #a8751e);
}

/* SR 紫色正面 */
.card.SR .card-front {
    background:
        radial-gradient(circle at center, #f0e2ff 0 3%, transparent 3.5%),
        repeating-radial-gradient(
            circle at center,
            transparent 0 17px,
            rgba(255,255,255,.55) 18px 20px,
            transparent 21px 34px
        ),
        linear-gradient(145deg, #d9c0f5, #a477d5 50%, #7853a9);
}

/* R 銀灰色正面 */
.card.R .card-front {
    background:
        radial-gradient(circle at center, #edf3f5 0 3%, transparent 3.5%),
        repeating-radial-gradient(
            circle at center,
            transparent 0 17px,
            rgba(255,255,255,.55) 18px 20px,
            transparent 21px 34px
        ),
        linear-gradient(145deg, #cbd8df, #8296a5 50%, #5e7180);
}

/* 正面裝飾框 */
.totem-frame {
    position: absolute;
    inset: 13px;
    border: 2px solid rgba(255,245,220,.9);
    border-radius: 12px;
    box-shadow:
        0 0 0 5px rgba(255,255,255,.12),
        inset 0 0 20px rgba(255,255,255,.15);
}

/* 正面中央圖騰 */
.totem-symbol {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 105px;
    height: 105px;
    border: 3px solid #fff0d0;
    border-radius: 50%;
    color: #fff2d6;
    font-size: 65px;
    text-shadow:
        0 0 10px rgba(255,255,255,.8),
        0 0 25px rgba(255,225,170,.8);
    box-shadow:
        0 0 0 8px rgba(255,255,255,.12),
        0 0 0 12px rgba(255,238,205,.45),
        0 0 35px rgba(255,230,190,.6);
}

.totem-symbol::before,
.totem-symbol::after {
    content: "✦";
    position: absolute;
    color: #fff1d1;
    font-size: 23px;
}

.totem-symbol::before {
    top: -31px;
}

.totem-symbol::after {
    bottom: -31px;
}

/* 四角裝飾 */
.corner {
    position: absolute;
    color: #fff1d1;
    font-size: 24px;
}

.corner.tl {
    top: 19px;
    left: 20px;
}

.corner.tr {
    top: 19px;
    right: 20px;
}

.corner.bl {
    bottom: 19px;
    left: 20px;
}

.corner.br {
    bottom: 19px;
    right: 20px;
}

/* 卡片背面 */
.card-back {
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
    background: linear-gradient(145deg, #fffdfb, #fff0f5);
    border: 5px solid #fff5df;
    box-shadow: 0 15px 35px rgba(0,0,0,.3);
}

.back-decoration {
    position: absolute;
    inset: 12px;
    border: 2px solid #edcfda;
    border-radius: 12px;
    pointer-events: none;
}

.back-star {
    color: #dba9bb;
    font-size: 18px;
    letter-spacing: 12px;
    margin-bottom: 10px;
}

.card-back-rarity {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 12px;
    color: #b87991;
}

.card-back-name {
    position: relative;
    z-index: 2;
    width: 100%;
    font-size: clamp(19px, 5vw, 27px);
    font-weight: bold;
    line-height: 1.4;
    text-align: center;
    color: #775365;
    overflow-wrap: anywhere;
}

.card-back-hint {
    margin-top: 15px;
    font-size: 10px;
    letter-spacing: 3px;
    color: #c39aa9;
}

/* SSR 金色 */
.card.SSR .card-front,
.card.SSR .card-back {
    border-color: #d69a28;
    box-shadow:
        0 0 15px rgba(214,154,40,.8),
        0 0 35px rgba(255,190,64,.55),
        0 15px 35px rgba(0,0,0,.3);
}

.card.SSR .card-back {
    background: linear-gradient(145deg, #fff9e7, #fff0c7);
}

.card.SSR .card-back-rarity {
    color: #c18b27;
}

.card.SSR .card-back-name {
    color: #94631e;
}

/* SR 紫色 */
.card.SR .card-front,
.card.SR .card-back {
    border-color: #a477d5;
    box-shadow:
        0 0 18px rgba(164,119,213,.8),
        0 0 35px rgba(164,119,213,.45),
        0 15px 35px rgba(0,0,0,.3);
}

.card.SR .card-back {
    background: linear-gradient(145deg, #fcf8ff, #eee1ff);
}

.card.SR .card-back-rarity {
    color: #9570be;
}

.card.SR .card-back-name {
    color: #76549c;
}

/* R 銀灰色 */
.card.R .card-front,
.card.R .card-back {
    border-color: #8296a5;
    box-shadow:
        0 0 15px rgba(130,150,165,.7),
        0 0 30px rgba(130,150,165,.35),
        0 15px 35px rgba(0,0,0,.3);
}

.card.R .card-back {
    background: linear-gradient(145deg, #ffffff, #edf3f6);
}

.card.R .card-back-rarity {
    color: #8296a5;
}

.card.R .card-back-name {
    color: #5e7180;
}

/* 卡片翻開後 */
.card.ready {
    pointer-events: auto;
}

/* 控制面板 */
.control-panel {
    margin-top: 18px;
    padding: 15px;
    border: 3px solid #fff;
    border-radius: 20px;
    background: linear-gradient(145deg, #ffeaf1, #f8c8d9);
    box-shadow: inset 0 -4px 0 rgba(190,92,130,.15);
}

/* 抽卡按鈕 */
.draw-button {
    width: 100%;
    padding: 16px 12px;
    border: 3px solid #fff;
    border-radius: 15px;
    background: linear-gradient(180deg, #a8e8d5, #6cc9ae);
    color: #315f54;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow:
        0 6px 0 #4da88f,
        0 8px 12px rgba(100,155,135,.2);
    transition: .15s;
}

.draw-button:hover {
    filter: brightness(1.06);
    transform: translateY(-2px);
}

.draw-button:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #4da88f;
}

.draw-button:disabled {
    filter: grayscale(.5);
    cursor: not-allowed;
    transform: none;
}

/* 機臺底部 */
.machine-bottom {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    padding-top: 17px;
    color: #fff;
    font-size: 11px;
    letter-spacing: 3px;
    text-shadow: 0 1px 3px rgba(130,40,75,.3);
}

/* 手機版 */
@media (max-width: 420px) {
    .machine {
        padding: 11px;
        border-radius: 27px;
    }

    .showcase {
        padding: 12px;
    }

    .dispenser {
        height: 175px;
    }

    .control-panel {
        padding: 12px;
    }

    .art-illustrations {
        gap: 12px;
    }

    .art-illustrations svg {
        width: 65px;
        height: 65px;
    }

    .art-illustrations svg:nth-child(2) {
        width: 75px;
        height: 75px;
    }

    .card {
        width: 88vw;
        max-width: 360px;
    }

    .totem-symbol {
        width: 85px;
        height: 85px;
        font-size: 53px;
    }
}

@media (max-width: 350px) {
    .card {
        width: 90vw;
    }

    .card-back {
        padding: 18px;
    }

    .totem-symbol {
        width: 75px;
        height: 75px;
        font-size: 45px;
    }
}
</style>
</head>

<body>

<div class="machine">

    <div class="machine-top">

        <div class="lights">
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
        </div>

        <!-- 旅行主題插畫 -->
        <div class="art-illustrations">

            <!-- 後背包 -->
            <svg viewBox="0 0 100 100" aria-label="後背包">
                <path d="M29 35 Q15 42 19 72"
                      fill="none" stroke="#BD6687"
                      stroke-width="7" stroke-linecap="round"/>
                <path d="M71 35 Q85 42 81 72"
                      fill="none" stroke="#BD6687"
                      stroke-width="7" stroke-linecap="round"/>
                <rect x="24" y="30" width="52" height="59"
                      rx="15" fill="#F4A9C2"
                      stroke="#C96F91" stroke-width="3"/>
                <path d="M39 31 Q39 13 50 13 Q61 13 61 31"
                      fill="none" stroke="#C96F91"
                      stroke-width="6" stroke-linecap="round"/>
                <rect x="33" y="55" width="34" height="24"
                      rx="8" fill="#FFDCE8"
                      stroke="#D77D9F" stroke-width="2.5"/>
                <path d="M42 57 L58 57"
                      stroke="#C96F91" stroke-width="2.5"/>
                <path d="M50 65 L52 70 L57 72 L52 74 L50 79 L48 74 L43 72 L48 70Z"
                      fill="#E6B84F"/>
            </svg>

            <!-- 行李箱 -->
            <svg viewBox="0 0 100 100" aria-label="行李箱">
                <path d="M39 25 V12 H61 V25"
                      fill="none" stroke="#BD6687"
                      stroke-width="5" stroke-linecap="round"/>
                <rect x="19" y="25" width="62" height="62"
                      rx="12" fill="#B9E6D8"
                      stroke="#70B9A2" stroke-width="3"/>
                <path d="M50 27 V85"
                      stroke="#70B9A2" stroke-width="3"
                      stroke-dasharray="4 4"/>
                <path d="M29 37 V75 M71 37 V75"
                      stroke="#E7FFF6" stroke-width="4"

                <rect x="43" y="48" width="14" height="9"

                <circle cx="32" cy="91" r="5" fill="#BD6687"/>
                <circle cx="68" cy="91" r="5" fill="#BD6687"/>
                <path d="M62 60 L64 64 L68 66 L64 68 L62 72 L60 68 L56 66 L60 64Z"
                      fill="#F4C66B"/>
            </svg>

            <!-- 旅遊地圖 -->
            <svg viewBox="0 0 100 100" aria-label="旅遊地圖">
                <path d="M12 25 L38 15 L63 25 L88 15

        </div>

    <!-- 展示櫥窗 -->

        <div class="rates">

</div>

<!-- 卡片 -->

    <div class="card-inner">

        <!-- 正面 -->

            <div class="back-decoration"></div>

                SSR COLLECTION
            </div>
            <div id="card-name" class="card-back-name">
                臺北101
            </div>

<script>

/* 景點卡池 */
const cardPool = {
    SSR: [
        "臺北101"
    ],

    SR: [
        "國立故宮博物院",
        "西門町",
        "中正紀念堂",
        "陽明山國家公園",
        "象山步道"
    ],

    R: [
        "國父紀念館",
        "大稻埕碼頭",
        "松山文創園區",
        "華山1914文創園區",
        "迪化街",
        "剝皮寮歷史街區",
        "榕錦時光生活園區",
        "赤峰街",
        "擎天崗草原",
        "大安森林公園",
        "北投地熱谷",
        "貓空",
        "臺北市立美術館",
        "臺北植物園",
        "國家兩廳院",
        "臺北市立動物園",
        "兒童新樂園",
        "士林夜市",
        "寧夏夜市"
    ]
};

let isDrawing = false;
let audioContext = null;
let hideTimer = null;

/* 音效 */
function playBeep(freq, type, duration) {
    try {
        if (!audioContext) {
            audioContext = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(
            0.09,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + duration
        );

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();
        osc.stop(audioContext.currentTime + duration);

    } catch (error) {
        console.log("音效無法播放：", error);
    }
}

/* 抽卡啟動音效 */
function playStartSound() {
    playBeep(587.33, "sine", 0.15);

    setTimeout(() => {
        playBeep(880, "sine", 0.2);
    }, 100);
}

/* 稀有度音效 */
function playRaritySound(rarity) {
    if (rarity === "SSR") {
        playBeep(1046, "sine", 0.2);

        setTimeout(() => {
            playBeep(1318, "sine", 0.25);
        }, 120);

    } else if (rarity === "SR") {
        playBeep(784, "triangle", 0.25);

    } else {
        playBeep(523, "triangle", 0.2);
    }
}

/* 抽卡機率：SSR 5%、SR 20%、R 75% */
function getRarity() {
    const roll = Math.random();

    if (roll < 0.05) return "SSR";
    if (roll < 0.25) return "SR";

    return "R";
}

/* 隨機取得景點 */
function getRandomArtItem(rarity) {
    const list = cardPool[rarity];
    const index = Math.floor(Math.random() * list.length);

    return list[index];
}

/* 等待 */
function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

/* 卡片初始位置：對準機臺出卡口 */
function positionCardAtDispenser() {
    const dispenser = document.getElementById("dispenser");
    const cardOutput = document.getElementById("card-output");

    const rect = dispenser.getBoundingClientRect();

    cardOutput.style.left =
        (rect.left + rect.width / 2) + "px";

    cardOutput.style.top =
        (rect.top + rect.height / 2) + "px";
}

/* 隱藏上一張卡片 */
function removePreviousCard() {
    const cardOutput = document.getElementById("card-output");

    if (hideTimer) {
        clearTimeout(hideTimer);
        hideTimer = null;
    }

    cardOutput.classList.remove(
        "ready",
        "flipped",
        "drop",
        "hide",
        "SSR",
        "SR",
        "R"
    );

    cardOutput.style.visibility = "hidden";
    cardOutput.style.opacity = "0";
    cardOutput.style.pointerEvents = "none";

    const inner = cardOutput.querySelector(".card-inner");

    inner.style.transition = "none";
    inner.style.transform = "rotateY(0deg)";

    void cardOutput.offsetWidth;

    inner.style.transition = "";
    inner.style.transform = "";
}

/* 點擊螢幕任意位置，讓卡片消失 */
function hideCard() {
    const cardOutput = document.getElementById("card-output");
    const emptyMessage = document.getElementById("empty-message");
    const drawButton = document.getElementById("draw-button");

    if (isDrawing) return;
    if (!cardOutput.classList.contains("ready")) return;

    /* 防止重複執行 */
    cardOutput.classList.remove("ready", "flipped");
    cardOutput.classList.add("hide");

    cardOutput.style.pointerEvents = "none";

    /* 恢復出卡口文字 */
    emptyMessage.style.display = "block";

    /* 恢復抽卡按鈕 */
    drawButton.disabled = false;
    drawButton.innerText = "就決定是你了";

    /* 等待淡出動畫結束後完全隱藏 */
    hideTimer = setTimeout(() => {
        cardOutput.classList.remove(
            "drop",
            "hide",
            "SSR",
            "SR",
            "R"
        );

        cardOutput.style.visibility = "hidden";
        cardOutput.style.opacity = "0";

        hideTimer = null;
    }, 350);
}

/* 抽卡主程式 */
async function draw() {
    if (isDrawing) return;

    isDrawing = true;

    const cardOutput = document.getElementById("card-output");
    const cardRarity = document.getElementById("card-rarity");
    const cardName = document.getElementById("card-name");
    const emptyMessage = document.getElementById("empty-message");
    const drawingMessage = document.getElementById("drawing-message");
    const drawButton = document.getElementById("draw-button");

    /* 1. 上一張卡片消失 */
    removePreviousCard();

    /* 2. 隱藏出卡口文字 */
    emptyMessage.style.display = "none";

    /* 3. 鎖定按鈕 */
    drawButton.disabled = true;

    /* 4. 顯示抽選文字 */
    drawingMessage.classList.add("show");

    playStartSound();

    /* 5. 等待抽選 */
    await wait(1200);

    /* 6. 抽選文字消失 */
    drawingMessage.classList.remove("show");

    /* 7. 決定稀有度 */
    const rarity = getRarity();

    /* 8. 隨機抽出景點 */
    const name = getRandomArtItem(rarity);

    console.log("抽中稀有度：", rarity);
    console.log("抽中景點：", name);

    /* 9. 設定卡片內容 */
    cardRarity.innerText = `${rarity} COLLECTION`;
    cardName.innerText = name;

    /* 10. 設定稀有度顏色 */
    cardOutput.className = `card ${rarity}`;

    /* 11. 設定出卡口位置 */
    positionCardAtDispenser();

    /* 12. 顯示卡片 */
    cardOutput.style.visibility = "visible";
    cardOutput.style.opacity = "1";

    void cardOutput.offsetWidth;

    /* 13. 卡片掉落至螢幕中央 */
    requestAnimationFrame(() => {
        cardOutput.classList.add("drop");
    });

    /* 14. 播放稀有度音效 */
    playRaritySound(rarity);

    /* 15. 等待掉落完成 */
    await wait(850);

    /* 16. 正面停留 */
    await wait(550);

    /* 17. 自動翻轉卡片 */
    cardOutput.classList.add("flipped");

    /* 18. 等待翻轉完成 */
    await wait(950);

    /* 19. 開放任意位置點擊 */
    cardOutput.classList.add("ready");

    cardOutput.style.pointerEvents = "auto";

    drawButton.disabled = false;
    drawButton.innerText = "就決定是你了";

    isDrawing = false;
}

/* 抽卡按鈕事件 */
document.getElementById("draw-button").addEventListener(
    "click",
    function() {
        if (isDrawing) return;

        const cardOutput = document.getElementById("card-output");

        /* 卡片已翻開時，點按按鈕也可以收起卡片 */
        if (cardOutput.classList.contains("ready")) {
            hideCard();
            return;
        }

        draw();
    }
);

/* 全畫面點擊事件 */
document.addEventListener("click", function() {
    const cardOutput = document.getElementById("card-output");

    if (!cardOutput.classList.contains("ready")) return;
    if (isDrawing) return;

    hideCard();
});

/* 手機觸控事件 */
document.addEventListener("touchstart", function() {
    const cardOutput = document.getElementById("card-output");

    if (!cardOutput.classList.contains("ready")) return;
    if (isDrawing) return;

    hideCard();
}, { passive: true });

/* 視窗尺寸改變時重新定位 */
window.addEventListener("resize", function() {
    const cardOutput = document.getElementById("card-output");

    if (
        cardOutput.classList.contains("drop") &&
        !cardOutput.classList.contains("hide")
    ) {
        positionCardAtDispenser();
    }
});

</script>
