
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickMe｜社牛大挑戰抽卡</title>
<link rel="stylesheet" href="../tool-transition.css">
<script src="../tool-transition.js"></script>

<style>
:root {
    --pink: #f47fa6;
    --deep-pink: #cf527e;
    --light-pink: #ffe5ed;
    --cream: #fff8f2;
    --dark: #573b4b;
    --mint: #b9e6d8;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 12px;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background:
        radial-gradient(circle at 15% 20%, #ffffff 0 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, #ffffff 0 2px, transparent 3px),
        linear-gradient(135deg, #fff0f4, #fce0e9 55%, #fff4e9);
    background-size: 55px 55px, 75px 75px, auto;
    color: var(--dark);
}

/* 機臺主體 */
.machine {
    position: relative;
    width: min(100%, 490px);
    padding: 15px;
    border: 5px solid #fff;
    border-radius: 34px;
    background: linear-gradient(145deg, #ffb4cb, #f47fa6 55%, #e96c98);
    box-shadow:
        0 12px 0 #cf6489,
        0 22px 35px rgba(164, 83, 116, .25),
        inset 0 3px 8px rgba(255,255,255,.8);
}

/* 機臺頂部 */
.machine-top {
    position: relative;
    padding: 17px 10px 15px;
    margin-bottom: 15px;
    text-align: center;
    border: 3px solid #fff;
    border-radius: 22px;
    background: linear-gradient(180deg, #fff9fb, #ffe9f0);
    box-shadow: inset 0 -4px 0 #f3c4d3;
}

/* 頂部燈泡 */
.lights {
    display: flex;
    justify-content: space-around;
    margin: 0 5px 12px;
}

.light {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff5bd;
    box-shadow: 0 0 8px #fff5bd, 0 0 14px #fff;
    animation: blink 1.5s infinite alternate;
}

.light:nth-child(2n) { animation-delay: .5s; }

.light:nth-child(3n) {
    background: #d9fff0;
    box-shadow: 0 0 8px #d9fff0, 0 0 14px #fff;
    animation-delay: .9s;
}

@keyframes blink {
    from { opacity: .55; transform: scale(.85); }
    to { opacity: 1; transform: scale(1.15); }
}

/* 跳舞乳牛 */
.art-illustrations {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 5px auto 8px;
}

.art-illustrations svg {
    width: 180px;
    height: 135px;
    overflow: visible;
    filter: drop-shadow(0 4px 3px rgba(180, 100, 130, .15));
    animation: cowDance .65s ease-in-out infinite alternate;
}

@keyframes cowDance {
    from { transform: rotate(-7deg) translateY(2px); }
    to { transform: rotate(7deg) translateY(-5px); }
}

/* 展示窗 */
.showcase {
    position: relative;
    padding: 17px;
    border: 5px solid #d98aa7;
    border-radius: 22px;
    background: linear-gradient(145deg, #fffdfb, #ffeef3);
    box-shadow:
        inset 0 0 0 3px #fff,
        inset 0 0 18px rgba(201, 116, 149, .18),
        0 5px 0 #c96d91;
}

.showcase-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
}

.showcase-header span {
    color: #b75b7d;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

.status-light {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #75ad9c;
    font-size: 11px;
    font-weight: bold;
}

.status-light::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #8ed9b8;
    box-shadow: 0 0 7px #8ed9b8;
}

/* 稀有度機率 */
.rates {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-bottom: 15px;
}

.rate-item {
    padding: 9px 3px;
    border-radius: 10px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    background: #fff;
    border: 1px solid #f1d3df;
    color: #8b7180;
}

.rate-item strong {
    display: block;
    margin-bottom: 3px;
    font-size: 17px;
}

.rate-item.ssr strong { color: #d69a28; }
.rate-item.sr strong { color: #a477d5; }
.rate-item.r strong { color: #8296a5; }

/* 出卡口 */
.dispenser {
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border: 5px solid #e8bdcd;
    border-radius: 16px;
    background: linear-gradient(180deg, #59434f, #392c36);
    box-shadow:
        inset 0 8px 15px rgba(0,0,0,.5),
        0 2px 0 #fff;
}

.dispenser::before,
.dispenser::after {
    content: "✦";
    position: absolute;
    color: rgba(255,255,255,.2);
    font-size: 30px;
    pointer-events: none;
}

.dispenser::before { top: 12px; left: 15px; }
.dispenser::after { bottom: 12px; right: 15px; }

.empty-message {
    color: #d9b9c8;
    font-size: 14px;
    letter-spacing: 2px;
}

/* 抽選文字 */
.drawing-message {
    position: absolute;
    z-index: 3;
    color: #fff0f6;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow:
        0 0 5px #ffb4d0,
        0 0 12px #f47fa6,
        0 0 20px #f47fa6;
    display: none;
    pointer-events: none;
}

.drawing-message.show {
    display: block;
    animation: drawingBlink .55s infinite alternate;
}

@keyframes drawingBlink {
    from { opacity: .3; transform: scale(.96); }
    to { opacity: 1; transform: scale(1.04); }
}

/* =========================
   全螢幕抽卡
========================= */

.card {
    position: fixed;
    z-index: 9999;
    left: 50%;
    top: 50%;
    width: min(82vw, 340px);
    height: 190px;
    perspective: 1000px;

    transform: translate(-50%, calc(-50% - 100vh)) scale(.8);
    opacity: 0;
    visibility: hidden;

    transition:
        transform .75s cubic-bezier(.2, 1.35, .4, 1),
        opacity .3s ease;

    cursor: pointer;
}

.card.drop {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    visibility: visible;
}

.card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.2, .8, .2, 1);
}

.card.flip .card-inner {
    transform: rotateY(180deg);
}

.card-front,
.card-back {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 20px;

    border-radius: 20px;
    border: 4px solid #fff;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    box-shadow:
        0 12px 30px rgba(0,0,0,.25),
        0 0 20px rgba(255,255,255,.5);
}

/* =========================
   卡片正面：幾何星象圖案
   不顯示任何文字
========================= */

.card-front {
    overflow: hidden;
    isolation: isolate;
    border: 3px solid rgba(255,255,255,.95);
    background: linear-gradient(135deg, #fff0d0, #e9a34f, #b96b35);
    color: #fff5d8;
}

/* 內外雙層邊框 */
.card-front::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 8px;
    border: 1px solid currentColor;
    border-radius: 13px;
    box-shadow:
        inset 0 0 0 4px rgba(255,255,255,.12),
        0 0 12px rgba(255,255,255,.3);
    opacity: .9;
}

/* 背景星點與光暈 */
.card-front::after {
    content: "";
    position: absolute;
    z-index: -2;
    inset: 0;
    background:
        radial-gradient(circle at 12% 20%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 82% 25%, rgba(255,255,255,.8) 0 1.5px, transparent 2.5px),
        radial-gradient(circle at 20% 78%, rgba(255,255,255,.7) 0 1px, transparent 2px),
        radial-gradient(circle at 88% 82%, rgba(255,255,255,.8) 0 1.5px, transparent 2.5px),
        radial-gradient(ellipse at center, rgba(255,255,255,.2), transparent 65%);
    background-size: 38px 38px, 52px 52px, 45px 45px, 55px 55px, auto;
}

/* 中央星象裝飾 */
.front-ornament {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 8px;
    pointer-events: none;
}

/* SSR：金橘色 */
.card.SSR .card-front {
    background:
        radial-gradient(ellipse at 50% 50%, rgba(255,238,177,.45), transparent 60%),
        linear-gradient(135deg, #ffdf91 0%, #e99a42 48%, #b96832 100%);
    color: #fff3c8;
    border-color: #fff8df;
    box-shadow:
        0 0 18px rgba(255,190,64,.8),
        0 0 40px rgba(255,170,50,.55),
        0 12px 30px rgba(0,0,0,.25);
}

/* SR：紫粉色 */
.card.SR .card-front {
    background:
        radial-gradient(ellipse at 50% 50%, rgba(255,210,245,.35), transparent 60%),
        linear-gradient(135deg, #f7c8e9 0%, #bd80d5 50%, #7954a5 100%);
    color: #ffe7fa;
    border-color: #fff4fc;
    box-shadow:
        0 0 22px rgba(210,150,255,.8),
        0 0 40px rgba(180,120,230,.5),
        0 12px 30px rgba(0,0,0,.25);
}

/* R：銀藍色 */
.card.R .card-front {
    background:
        radial-gradient(ellipse at 50% 50%, rgba(225,245,255,.4), transparent 60%),
        linear-gradient(135deg, #dce9f3 0%, #829db8 50%, #536d8b 100%);
    color: #f4f8ff;
    border-color: #fff;
    box-shadow:
        0 0 18px rgba(190,220,245,.65),
        0 12px 30px rgba(0,0,0,.25);
}

/* =========================
   卡片背面
========================= */

.card-back {
    transform: rotateY(180deg);
    background: linear-gradient(145deg, #fff, #fff1f5);
    color: #775365;
    border: 4px solid #f2cada;
}

.card-rarity {
    margin-bottom: 12px;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 3px;
    flex-shrink: 0;
}

.card-name {
    width: 100%;
    padding: 0 5px;
    font-size: clamp(16px, 4vw, 21px);
    font-weight: bold;
    line-height: 1.6;
    overflow-wrap: anywhere;
    word-break: break-word;
}

/* SSR 背面 */
.card.SSR .card-back {
    background: linear-gradient(135deg, #fff3b8, #ffc95f, #f4a63d);
    border: 5px solid #fff6d6;
    color: #8d541b;
    box-shadow:
        0 0 18px #ffdb70,
        0 0 40px rgba(255,190,64,.8),
        0 12px 30px rgba(0,0,0,.25);
}

/* SR 背面 */
.card.SR .card-back {
    background: linear-gradient(135deg, #f2e5ff, #d6b8fa, #b991e7);
    border: 5px solid #fff;
    color: #63458d;
    box-shadow:
        0 0 22px rgba(199,158,255,.8),
        0 12px 30px rgba(0,0,0,.25);
}

/* R 背面 */
.card.R .card-back {
    background: linear-gradient(135deg, #eaf2fa, #c4d7e8, #8fa9c0);
    border: 4px solid #e5f0fa;
    color: #4b657f;
    box-shadow:
        0 0 18px rgba(175,205,230,.6),
        0 12px 30px rgba(0,0,0,.25);
}

/* 點擊提示 */
.card-hint {
    margin-top: 12px;
    font-size: 11px;
    letter-spacing: 2px;
    opacity: .65;
}

/* 控制區 */
.control-panel {
    margin-top: 18px;
    padding: 15px;
    border: 3px solid #fff;
    border-radius: 20px;
    background: linear-gradient(145deg, #ffeaf1, #f8c8d9);
    box-shadow: inset 0 -4px 0 rgba(190,92,130,.15);
}

/* 抽卡按鈕 */
.draw-button {
    width: 100%;
    padding: 16px 12px;
    border: 3px solid #fff;
    border-radius: 15px;
    background: linear-gradient(180deg, #a8e8d5, #6cc9ae);
    color: #315f54;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow:
        0 6px 0 #4da88f,
        0 8px 12px rgba(100,155,135,.2);
    transition: .15s;
}

.draw-button:hover {
    filter: brightness(1.06);
    transform: translateY(-2px);
}

.draw-button:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #4da88f;
}

.draw-button:disabled {
    filter: grayscale(.5);
    cursor: not-allowed;
    transform: none;
}

/* 機臺底部 */
.machine-bottom {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    padding-top: 17px;
    color: #fff;
    font-size: 11px;
    letter-spacing: 3px;
    text-shadow: 0 1px 3px rgba(130,40,75,.3);
}

/* 手機版 */
@media (max-width: 420px) {
    .machine {
        padding: 11px;
        border-radius: 27px;
    }

    .showcase { padding: 12px; }
    .dispenser { height: 175px; }
    .control-panel { padding: 12px; }

    .art-illustrations svg {
        width: 160px;
        height: 120px;
    }

    .card {
        width: 84vw;
        height: 180px;
    }
}

/* 減少動態效果 */
@media (prefers-reduced-motion: reduce) {
    .light,
    .art-illustrations svg {
        animation: none;
    }
}
</style>
</head>

                      stroke-width="1.4" stroke-linecap="round"/>

                <!-- 星星 -->
                <g fill="currentColor">
                    <path d="M65 48 L69 60 L81 64 L69 68 L65 80 L61 68 L49 64 L61 60Z"/>
                    <path d="M275 48 L279 60 L291 64 L279 68 L275 80 L271 68 L259 64Z"/>
                    <path d="M65 110 L68 119 L77 122 L68 125 L65 134 L62 125 L53 122 L62 119Z"/>

                    <circle cx="94" cy="31" r="2"/>
                    <circle cx="246" cy="31" r="2"/>

                    <circle cx="246" cy="159" r="2"/>

                    <circle cx="170" cy="159" r="2"/>

                <!-- 小型月亮 -->
                <path d="M112 29 A8 8 0 1 0 123 39
                         A7 7 0 0 1 112 29Z"

        <!-- 卡片背面：挑戰結果 -->
        <div class="card-back">

            <div id="card-rarity" class="card-rarity"></div>

            <div id="card-name" class="card-name"></div>

        </div>

    </div>
</div>

<script>

/* 社交挑戰卡池 */
const cardPool = {

    SSR: [
        "喊巴啦啦小魔仙，變身",
        "單膝下跪，送陌生人玫瑰"
    ],

    SR: [
        "對陌生人比出大愛心",
        "隔街向路人熱情揮手",
        "下車前向整車乘客告別",
        "遲到進門大喊：報告長官",
        "突然特務式轉身貼牆",
        "詢問路人：我們穿越了嗎",
        "請路人幫拍狗仔偷拍照",
        "高舉雙手徵求陌生人擊掌",
        "假裝腳底被黏住，掙扎一分鐘",
        "問路人：黃金還是銀色寶特瓶？",
        "詢問店員：有賣勇氣嗎？"
    ],

    R: [
        "結帳時稱讚店員的髮型",
        "問路人：黃金還是銀色寶特瓶？",
        "問阿姨：哪瓶飲料最有初戀感",
        "拿白紙問路人地址怎麼走",
        "擦肩而過時突然找同學擊掌",
        "倒著走路，向路人微笑點頭",
        "對面紅燈時向行人大力揮手",
        "問路人霍格華茲列車在哪搭",
        "蹲下跟流浪貓約定見面時間",
        "在電梯裡面向乘客微笑",
        "點飲料時詢問有沒有初戀口味",
        "在捷運上假裝自己正在衝浪",
        "問服務生牛肉生前是否快樂",
        "指著天空大喊：你看",
        "買咖啡時自稱帥到分手",
        "在電扶梯上與對向路人深情對視",
        "問路人現在是西元幾年",
        "幫隔壁桌陌生人烤肉",
        "問男士哪支口紅是斬男色",
        "問路人能否拍被狗仔偷拍照",
        "問路人能否借拍一張合照",
        "詢問霍格華茲九又四分之三月臺在哪",
        "在步行街假裝腳底被黏住",
        "紅燈時舉辦一場即興歌友會",
        "帶朋友參觀人行道，假裝導遊",
        "對手錶說：計畫必須提前",
        "問店員有沒有賣有錢人的東西",
        "對鏡子整理儀容並鞠躬",
        "用播報員語氣轉播現場",
        "假裝接到組織的神祕電話",
        "對餐點舉杯感謝它的犧牲",
        "走路時假裝自己是電影主角",
        "問朋友：我變鴨子你還認得我嗎？",
        "對空氣拍手三下後離開",
        "用拍賣會語氣介紹普通物品",
        "看到三角錐說：目標確認",
        "告訴朋友：我討厭你，假的",
        "接飲料時像領獎一樣雙手捧著"
    ]

};

let isDrawing = false;
let cardShowing = false;
let audioContext = null;

/* 音效 */
function playBeep(freq, type, duration) {
    try {
        if (!audioContext) {
            audioContext = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(
            0.09,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + duration
        );

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();
        osc.stop(audioContext.currentTime + duration);

    } catch (error) {
        console.log("音效無法播放：", error);
    }
}

/* 啟動音效 */
function playStartSound() {
    playBeep(587.33, "sine", 0.15);

    setTimeout(() => {
        playBeep(880, "sine", 0.2);
    }, 100);
}

/* 抽卡稀有度 */
function getRarity() {
    const roll = Math.random();

    if (roll < 0.05) {
        return "SSR";
    } else if (roll < 0.25) {
        return "SR";
    } else {
        return "R";
    }
}

/* 隨機取得挑戰 */
function getRandomArtItem(rarity) {
    const list = cardPool[rarity];
    const index = Math.floor(Math.random() * list.length);

    return list[index];
}

/* 等待時間 */
function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

/* 收回卡片 */
function hideCard() {

    const cardOutput = document.getElementById("card-output");

    cardOutput.classList.remove("flip");
    cardOutput.classList.remove("drop");

    cardShowing = false;

    setTimeout(() => {
        cardOutput.className = "card";
    }, 400);
}

/* 抽卡主程式 */
async function draw() {

    if (isDrawing) return;

    /* 如果卡片已經顯示，按鈕改為收回卡片 */
    if (cardShowing) {
        hideCard();
        return;
    }

    isDrawing = true;

    const cardOutput =
        document.getElementById("card-output");

    const cardRarity =
        document.getElementById("card-rarity");

    const cardName =
        document.getElementById("card-name");

    const emptyMessage =
        document.getElementById("empty-message");

    const drawingMessage =
        document.getElementById("drawing-message");

    const drawButton =
        document.getElementById("draw-button");

    /* 1. 重置卡片 */
    cardOutput.className = "card";

    emptyMessage.style.display = "none";

    drawingMessage.classList.remove("show");

    /* 2. 鎖定按鈕 */
    drawButton.disabled = true;

    /* 3. 顯示抽選文字 */
    drawingMessage.classList.add("show");

    /* 播放啟動音效 */
    playStartSound();

    /* 4. 等待抽選 */
    await wait(1200);

    drawingMessage.classList.remove("show");

    /* 5. 決定抽卡結果 */
    const rarity = getRarity();
    const name = getRandomArtItem(rarity);

    /* 6. 設定卡片內容 */
    cardRarity.innerText = `${rarity} CHALLENGE`;
    cardName.innerText = name;

    /* 依照稀有度設定整張卡片的顏色 */
    cardOutput.className = `card ${rarity}`;

    /* 7. 開始掉落動畫 */
    void cardOutput.offsetWidth;

    requestAnimationFrame(() => {
        cardOutput.classList.add("drop");
    });

    /* 8. 等待卡片掉落 */
    await wait(800);

    /* 9. 卡片自動翻面 */
    cardOutput.classList.add("flip");

    /* 10. 播放稀有度音效 */
    if (rarity === "SSR") {

        playBeep(1046, "sine", 0.2);

        setTimeout(() => {
            playBeep(1318, "sine", 0.25);
        }, 120);

    } else if (rarity === "SR") {

        playBeep(784, "triangle", 0.25);

    } else {

        playBeep(523, "triangle", 0.2);
    }

    /* 11. 等待翻面動畫完成 */
    await wait(750);

    /* 12. 顯示卡片狀態 */
    cardShowing = true;

    /* 恢復按鈕 */
    drawButton.disabled = false;

    isDrawing = false;
}

/* 點擊畫面任意位置收回卡片 */
document.addEventListener("click", function(event) {

    if (!cardShowing) return;

    const cardOutput = document.getElementById("card-output");

    /* 點擊卡片以外的位置也能收回 */
    if (!cardOutput.contains(event.target)) {
        hideCard();
    }

});

/* 點擊卡片本身收回 */
document.getElementById("card-output").addEventListener("click", function() {

    if (cardShowing) {
        hideCard();
    }

});

</script>

</body>
